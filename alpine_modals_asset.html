<!--
  alpine_modals_asset.html — P3 資產 modal:CreateIsmsAssetModal(共用)/ AddAssetModal / EditAssetModal / BatchImportGuideModal
  逐行對應舊頁 2195-2469(CreateIsms)/11210-12021(Add)/12024-12509(Edit)/10908-11079(Guide)。
  CreateIsms 為共用 modal,由 store.createIsmsOpen 控制,建立回呼經 store.openCreateIsms 登記。
-->
<script>
document.addEventListener('alpine:init', function () {

    /* ===== CreateIsmsAssetModal(舊頁 2195-2469;共用) ===== */
    Alpine.data('createIsmsModal', function () {
        return {
            loading: false, loadError: '', submitting: false,
            categories: [], groups: [], statuses: [], businessProcesses: [],
            categoryIdx: -1, groupIdx: -1, statusIdx: -1, businessProcessIdx: -1,
            name: '', description: '', c: 2, integrity: 2, availability: 2,

            init: function () {
                var self = this;
                // 對應舊頁 useEffect[open]:每次開啟重置 + 載入下拉(此元件只在 open 時被 x-if 掛載)
                this.name = ''; this.description = ''; this.c = 2; this.integrity = 2; this.availability = 2;
                this.categoryIdx = -1; this.groupIdx = -1; this.statusIdx = -1; this.businessProcessIdx = -1;
                this.loadError = ''; this.loading = true;
                google.script.run
                    .withSuccessHandler(function (res) {
                        self.loading = false;
                        if (res && res.success) {
                            self.categories = res.categories || [];
                            self.groups = res.groups || [];
                            self.statuses = res.statuses || [];
                            self.businessProcesses = res.businessProcesses || [];
                        } else {
                            self.loadError = (res && res.error) || '載入下拉選單失敗';
                        }
                    })
                    .withFailureHandler(function (err) {
                        self.loading = false;
                        self.loadError = (err && err.message) || String(err);
                    })
                    .getIsmsDropdownOptions();
            },
            get selectedCategory() { return this.categoryIdx >= 0 ? this.categories[this.categoryIdx] : null; },
            get selectedGroup() { return this.groupIdx >= 0 ? this.groups[this.groupIdx] : null; },
            get selectedStatus() { return this.statusIdx >= 0 ? this.statuses[this.statusIdx] : null; },
            get previewId() {
                var sc = this.selectedCategory, sg = this.selectedGroup;
                return (sc && sg && sc.code && sg.code) ? (sg.code + '-' + sc.code + '-???') : '請先選擇組別與類別';
            },
            get previewValue() { return Number(this.c) + Number(this.integrity) + Number(this.availability); },
            get previewIdClass() {
                var sc = this.selectedCategory, sg = this.selectedGroup;
                return (sc && sg && sc.code && sg.code) ? 'text-indigo-700 font-semibold' : 'text-slate-400';
            },
            optionLabel: function (opt) { return opt.display + (opt.code ? ('（' + opt.code + '）') : ''); },
            handleSubmit: function () {
                var self = this;
                var sc = this.selectedCategory, sg = this.selectedGroup, ss = this.selectedStatus;
                if (!sc || !sc.display) return alert('請選擇類別');
                if (!sc.code) return alert('類別缺少代號，請檢查 ISMS 下拉選單工作表 C 欄');
                if (!sg || !sg.display) return alert('請選擇組別');
                if (!sg.code) return alert('組別缺少代號，請檢查 ISMS 下拉選單工作表 C 欄');
                var trimmedName = this.name.trim();
                if (!trimmedName) return alert('請輸入資產名稱');
                if (!ss || !ss.display) return alert('請選擇使用狀態');
                var checks = [['機密性', this.c], ['完整性', this.integrity], ['可用性', this.availability]];
                for (var i = 0; i < checks.length; i++) {
                    var n = Number(checks[i][1]);
                    if (!Number.isInteger(n) || n < 1 || n > 4) return alert(checks[i][0] + '必須介於 1~4');
                }
                this.submitting = true;
                google.script.run
                    .withSuccessHandler(function (res) {
                        self.submitting = false;
                        if (res && res.success) {
                            var newAsset = {
                                ismsAssetId: res.ismsAssetId,
                                category: sc.display,
                                name: trimmedName,
                                mainCategory: '',
                                subCategory: '',
                                responsibleUnit: sg.display
                            };
                            self.$store.app.onIsmsAssetCreated(newAsset);
                            self.$store.app.closeCreateIsms();
                        } else {
                            alert('建立失敗：' + ((res && res.error) || '未知錯誤'));
                        }
                    })
                    .withFailureHandler(function (err) {
                        self.submitting = false;
                        alert('建立失敗：' + ((err && err.message) || err));
                    })
                    .createIsmsAsset({
                        categoryDisplay: sc.display, categoryCode: sc.code,
                        groupDisplay: sg.display, groupCode: sg.code,
                        statusDisplay: ss.display,
                        businessProcess: self.businessProcessIdx >= 0 ? self.businessProcesses[self.businessProcessIdx].display : '',
                        name: trimmedName, description: self.description,
                        confidentiality: Number(self.c), integrity: Number(self.integrity), availability: Number(self.availability)
                    });
            }
        };
    });

    /* ===== AddAssetModal(舊頁 11210-12021) ===== */
    Alpine.data('addAssetModal', function () {
        return {
            isLoading: true, isSubmitting: false, dropdownData: null, showBatchImportGuide: false,
            activeTab: 'single', batchImportType: 'excel',
            assetType: 'property', assetId: '', assetName: '', modelBrand: '', category: '',
            purchaseDate: '', useLife: '', isItAsset: false, isActuallyComputer: false, isIsoScope: false,
            location: '', keeperEmail: '', userEmail: '', remarks: '',
            batchFile: null, batchImportError: '', batchImportResult: null, isBatchImporting: false, previewData: null,
            propertyCategoryForImport: '財產',
            propertyCategoryOptions: ['財產', '非消耗品'],

            init: function () {
                var self = this;
                var preloaded = this.$store.app.addAssetDropdownData;
                if (preloaded) {
                    this.dropdownData = preloaded;
                    this.isLoading = false;
                    return;
                }
                google.script.run
                    .withSuccessHandler(function (data) { self.dropdownData = data; self.isLoading = false; })
                    .withFailureHandler(function (error) { alert('載入選單資料失敗：' + error.message); self.close(); })
                    .getDropdownData();
                // 資訊資產連動(舊頁 11267-11272):取消主選項清子選項
                this.$watch('isItAsset', function (v) {
                    if (!v) { self.isActuallyComputer = false; self.isIsoScope = false; }
                });
            },
            close: function () { this.$store.app.showAddAssetModal = false; },
            switchTab: function(tab) {
                this.activeTab = tab;
                this.batchImportError = '';
                this.previewData = null;
                this.batchFile = null;
                if (this.$refs.batchFileInput) this.$refs.batchFileInput.value = '';
            },
            get sortedKeepers() {
                var kd = this.dropdownData && this.dropdownData.keepers;
                if (!kd) return [];
                return Object.entries(kd).sort(function (a, b) { return a[1].localeCompare(b[1], 'zh-Hant'); });
            },
            get keeperNameResolver() {
                var nameToEmail = {};
                var duplicateNames = {};
                var keepers = (this.dropdownData && this.dropdownData.keepers) || {};
                Object.entries(keepers).forEach(function (entry) {
                    var normalizedName = String(entry[1] || '').trim();
                    var normalizedEmail = String(entry[0] || '').trim().toLowerCase();
                    if (!normalizedName || !normalizedEmail) return;
                    if (nameToEmail[normalizedName] && nameToEmail[normalizedName] !== normalizedEmail) {
                        duplicateNames[normalizedName] = true;
                        return;
                    }
                    nameToEmail[normalizedName] = normalizedEmail;
                });
                return { nameToEmail: nameToEmail, duplicateNames: duplicateNames };
            },
            onKeeperChange: function (val) {
                this.keeperEmail = val;
                if (!this.userEmail) this.userEmail = val;
            },
            handleSubmit: function () {
                var self = this;
                if (!this.assetId.trim() || !this.assetName.trim() || !this.location || !this.keeperEmail) {
                    alert('請填寫所有必填欄位（編號、名稱、地點、保管人）');
                    return;
                }
                if (!confirm('確定要新增' + (this.assetType === 'property' ? '財產' : '物品') + '「' + this.assetId + '」嗎？')) return;
                this.isSubmitting = true;
                this.$store.app.toastProgress('正在新增資產...');
                var formData = {
                    assetType: this.assetType,
                    assetId: this.assetId.trim(),
                    assetName: this.assetName.trim(),
                    modelBrand: this.modelBrand.trim(),
                    category: this.category.trim(),
                    purchaseDate: this.purchaseDate,
                    useLife: this.useLife,
                    isItAsset: this.isItAsset,
                    isActuallyComputer: this.isActuallyComputer,
                    isIsoScope: this.isIsoScope,
                    location: this.location,
                    keeperEmail: this.keeperEmail,
                    userEmail: this.userEmail || this.keeperEmail,
                    remarks: this.remarks.trim()
                };
                google.script.run
                    .withSuccessHandler(function (message) {
                        self.$store.app.toastOrAlert('✅ 新增成功！', 'success');
                        alert(message);
                        self.isSubmitting = false;
                        self.$store.app.handleAddAssetSuccess();
                        self.close();
                    })
                    .withFailureHandler(function (error) {
                        self.$store.app.toastOrAlert('❌ 新增失敗：' + error.message, 'error');
                        alert('錯誤：' + error.message);
                        self.isSubmitting = false;
                    })
                    .addNewAsset(formData);
            },

            /* ── 批次匯入解析(舊頁 11352-11587;逐行保留) ── */
            normalizeImportText: function (value) { return String(value || '').trim(); },
            isRowEmpty: function (row) {
                var self = this;
                return (row || []).every(function (cell) { return !self.normalizeImportText(cell); });
            },
            formatImportDate: function (value) {
                if (!value) return '';
                if (value instanceof Date) {
                    var y = value.getFullYear();
                    var m = String(value.getMonth() + 1).padStart(2, '0');
                    var d = String(value.getDate()).padStart(2, '0');
                    return y + '/' + m + '/' + d;
                }
                if (typeof value === 'number' && window.XLSX && window.XLSX.SSF && window.XLSX.SSF.parse_date_code) {
                    var parsed = XLSX.SSF.parse_date_code(value);
                    if (parsed) {
                        return parsed.y + '/' + String(parsed.m).padStart(2, '0') + '/' + String(parsed.d).padStart(2, '0');
                    }
                }
                return this.normalizeImportText(value);
            },
            resolveNameEmail: function (name, label, errors) {
                var normalizedName = this.normalizeImportText(name);
                if (!normalizedName) { errors.push(label + '必填'); return ''; }
                if (normalizedName.indexOf('@') !== -1) { errors.push(label + '請填姓名'); return ''; }
                var resolver = this.keeperNameResolver;
                if (resolver.duplicateNames[normalizedName]) { errors.push(label + '姓名重複，請改用唯一姓名'); return ''; }
                var email = resolver.nameToEmail[normalizedName];
                if (!email) { errors.push(label + '不在名單中'); return ''; }
                return email;
            },
            buildFailureEntry: function (data) {
                return {
                    assetType: data.assetType || '', rowIndex: data.rowIndex || 0,
                    assetId: data.assetId || '', reason: data.reason || '', source: data.source || ''
                };
            },
            parsePropertyRows: function (rows, sourceLabel) {
                var self = this;
                var parsedRows = [], failures = [];
                (rows || []).forEach(function (row, index) {
                    if (index === 0) return;
                    if (!row || self.isRowEmpty(row)) return;
                    var rowIndex = index + 1, rowErrors = [];
                    var assetId = self.normalizeImportText(row[0]);
                    var assetName = self.normalizeImportText(row[1]);
                    var assetAlias = self.normalizeImportText(row[2]);
                    var modelBrand = self.normalizeImportText(row[3]);
                    var unit = self.normalizeImportText(row[4]);
                    var purchaseDate = self.formatImportDate(row[5]);
                    var useLife = self.normalizeImportText(row[6]);
                    var location = self.normalizeImportText(row[7]);
                    var accessory = self.normalizeImportText(row[8]);
                    var keeperName = self.normalizeImportText(row[9]);
                    var userName = self.normalizeImportText(row[10]);
                    var assetCategory = self.normalizeImportText(row[11]);
                    if (!assetId) rowErrors.push('編號必填');
                    if (!assetName) rowErrors.push('名稱必填');
                    if (!location) rowErrors.push('保管地點必填');
                    self.resolveNameEmail(keeperName, '保管人', rowErrors);
                    if (userName && userName.indexOf('@') !== -1) rowErrors.push('使用人請填姓名');
                    if (userName) self.resolveNameEmail(userName, '使用人', rowErrors);
                    if (rowErrors.length > 0) {
                        failures.push(self.buildFailureEntry({ assetType: '財產', rowIndex: rowIndex, assetId: assetId, reason: rowErrors.join('、'), source: sourceLabel }));
                        return;
                    }
                    parsedRows.push({
                        rowIndex: rowIndex, assetId: assetId, assetName: assetName, assetAlias: assetAlias,
                        modelBrand: modelBrand, unit: unit, purchaseDate: purchaseDate, useLife: useLife,
                        location: location, accessory: accessory, keeperName: keeperName,
                        userName: userName || keeperName, assetCategory: assetCategory
                    });
                });
                return { rows: parsedRows, failures: failures };
            },
            parseItemRows: function (rows, sourceLabel) {
                var self = this;
                var parsedRows = [], failures = [];
                (rows || []).forEach(function (row, index) {
                    if (index === 0) return;
                    if (!row || self.isRowEmpty(row)) return;
                    var rowIndex = index + 1, rowErrors = [];
                    var assetId = self.normalizeImportText(row[0]);
                    var assetName = self.normalizeImportText(row[1]);
                    var productSerial = self.normalizeImportText(row[2]);
                    var modelBrand = self.normalizeImportText(row[3]);
                    var purchaseDate = self.formatImportDate(row[4]);
                    var useLife = self.normalizeImportText(row[5]);
                    var unit = self.normalizeImportText(row[6]);
                    var amountTwd = self.normalizeImportText(row[7]);
                    var purchaseOrder = self.normalizeImportText(row[8]);
                    var assetCategory = self.normalizeImportText(row[9]);
                    var keeperName = self.normalizeImportText(row[10]);
                    var location = self.normalizeImportText(row[11]);
                    if (!assetId) rowErrors.push('編號必填');
                    if (!assetName) rowErrors.push('名稱必填');
                    if (!location) rowErrors.push('保管地點必填');
                    self.resolveNameEmail(keeperName, '保管人', rowErrors);
                    if (rowErrors.length > 0) {
                        failures.push(self.buildFailureEntry({ assetType: '物品', rowIndex: rowIndex, assetId: assetId, reason: rowErrors.join('、'), source: sourceLabel }));
                        return;
                    }
                    parsedRows.push({
                        rowIndex: rowIndex, assetId: assetId, assetName: assetName, productSerial: productSerial,
                        modelBrand: modelBrand, purchaseDate: purchaseDate, useLife: useLife, unit: unit,
                        amountTwd: amountTwd, purchaseOrder: purchaseOrder, assetCategory: assetCategory,
                        keeperName: keeperName, location: location
                    });
                });
                return { rows: parsedRows, failures: failures };
            },
            readFileAsArrayBuffer: function (file) {
                return new Promise(function (resolve, reject) {
                    var reader = new FileReader();
                    reader.onload = function () { resolve(reader.result); };
                    reader.onerror = function () { reject(new Error('讀取檔案失敗')); };
                    reader.readAsArrayBuffer(file);
                });
            },
            parseBatchFile: function (file) {
                var self = this;
                if (!window.XLSX) return Promise.reject(new Error('匯入功能尚未載入，請重新整理後再試。'));
                var fileName = ((file && file.name) || '').toLowerCase();
                var isCsv = fileName.endsWith('.csv') || String((file && file.type) || '').indexOf('csv') !== -1;
                return this.readFileAsArrayBuffer(file).then(function (buffer) {
                    var workbook = XLSX.read(buffer, { type: 'array', cellDates: true });
                    if (isCsv) {
                        var sheetName = workbook.SheetNames[0];
                        if (!sheetName) {
                            return { propertyRows: [], itemRows: [], failures: [self.buildFailureEntry({ assetType: self.assetType === 'property' ? '財產' : '物品', rowIndex: 0, assetId: '', reason: '找不到可解析的資料表', source: 'CSV' })] };
                        }
                        var rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: '', raw: true });
                        if (self.assetType === 'property') {
                            var pr = self.parsePropertyRows(rows, 'CSV');
                            return { propertyRows: pr.rows, itemRows: [], failures: pr.failures };
                        }
                        var ir = self.parseItemRows(rows, 'CSV');
                        return { propertyRows: [], itemRows: ir.rows, failures: ir.failures };
                    }
                    // 匯入端同時相容「財產總表/物品總表」(照說明命名) 與「財產/物品」(自家匯出檔的工作表名稱)
                    var propertySheet = workbook.Sheets['財產總表'] || workbook.Sheets['財產'];
                    var itemSheet = workbook.Sheets['物品總表'] || workbook.Sheets['物品'];
                    if (!propertySheet && !itemSheet) {
                        return { propertyRows: [], itemRows: [], failures: [self.buildFailureEntry({ assetType: '匯入', rowIndex: 0, assetId: '', reason: '找不到「財產總表」或「物品總表」工作表', source: 'Excel' })] };
                    }
                    var propertyRowsRaw = propertySheet ? XLSX.utils.sheet_to_json(propertySheet, { header: 1, defval: '', raw: true }) : [];
                    var itemRowsRaw = itemSheet ? XLSX.utils.sheet_to_json(itemSheet, { header: 1, defval: '', raw: true }) : [];
                    var pResult = propertySheet ? self.parsePropertyRows(propertyRowsRaw, '財產總表') : { rows: [], failures: [] };
                    var iResult = itemSheet ? self.parseItemRows(itemRowsRaw, '物品總表') : { rows: [], failures: [] };
                    return { propertyRows: pResult.rows, itemRows: iResult.rows, failures: pResult.failures.concat(iResult.failures) };
                });
            },
            handleBatchFileChange: function (event) {
                this.batchFile = (event.target.files && event.target.files[0]) || null;
                if (this.batchFile) {
                    var fname = this.batchFile.name.toLowerCase();
                    if (fname.endsWith('.csv')) {
                        this.batchImportType = 'csv';
                    } else if (fname.endsWith('.xlsx')) {
                        this.batchImportType = 'excel';
                    }
                }
                this.batchImportError = '';
                this.batchImportResult = null;
                this.previewData = null;
            },
            cancelPreview: function () {
                this.previewData = null;
                this.batchFile = null;
                if (this.$refs.batchFileInput) this.$refs.batchFileInput.value = '';
            },
            handlePreviewImport: function () {
                var self = this;
                if (this.isBatchImporting || this.isSubmitting) return;
                this.batchImportError = '';
                this.batchImportResult = null;
                this.previewData = null;
                if (!this.batchFile) { this.batchImportError = '請先選擇要匯入的檔案'; return; }
                if (!this.dropdownData) { this.batchImportError = '選單資料尚未載入，請稍後再試'; return; }
                
                window.ensureXLSX().then(function () {
                    return self.parseBatchFile(self.batchFile);
                }).then(function (parsedResult) {
                    var clientFailures = parsedResult.failures || [];
                    var propertyRows = parsedResult.propertyRows || [];
                    var itemRows = parsedResult.itemRows || [];
                    if (propertyRows.length > 0 && (!self.propertyCategoryForImport || self.propertyCategoryOptions.indexOf(self.propertyCategoryForImport) === -1)) {
                        self.batchImportError = '請先選擇正確的財產類別';
                        return;
                    }
                    if (propertyRows.length === 0 && itemRows.length === 0) {
                        self.batchImportError = '未找到可匯入的資料列';
                        return;
                    }
                    self.isBatchImporting = true;
                    self.$store.app.toastProgress('正在分析差異...');
                    var payload = { propertyCategory: self.propertyCategoryForImport, propertyRows: propertyRows, itemRows: itemRows };
                    google.script.run
                        .withSuccessHandler(function (response) {
                            self.isBatchImporting = false;
                            if (!response || response.error) {
                                self.$store.app.toastOrAlert('❌ 分析失敗：' + ((response && response.error) || '未知錯誤'), 'error');
                                self.batchImportError = (response && response.error) || '分析失敗';
                                return;
                            }
                            if (clientFailures.length > 0) {
                                response.errorAssets = (response.errorAssets || []).concat(clientFailures.map(function(f) {
                                    return { assetId: f.assetId, assetName: '', reason: f.reason, type: f.assetType };
                                }));
                            }
                            self.previewData = response;
                            self.$store.app.toastOrAlert('✅ 分析完成，請查看差異', 'success');
                        })
                        .withFailureHandler(function (error) {
                            self.$store.app.toastOrAlert('❌ 分析失敗', 'error');
                            self.isBatchImporting = false;
                            self.batchImportError = (error && error.message) || '分析失敗';
                        })
                        .previewAssetsBatch(payload);
                }).catch(function (error) {
                    self.batchImportError = (error && error.message) || '解析檔案失敗';
                });
            },
            commitImport: function () {
                var self = this;
                if (!this.previewData) return;
                this.isBatchImporting = true;
                self.$store.app.toastProgress('正在寫入資料...');
                google.script.run
                    .withSuccessHandler(function (response) {
                        self.isBatchImporting = false;
                        if (!response || response.error) {
                            self.$store.app.toastOrAlert('❌ 寫入失敗：' + ((response && response.error) || '未知錯誤'), 'error');
                            return;
                        }
                        self.previewData = null;
                        self.batchFile = null;
                        var successCount = Number(response.successCount || 0);
                        self.$store.app.toastOrAlert('✅ 匯入完成：成功 ' + successCount + ' 筆', 'success');
                        if (successCount > 0) self.$store.app.handleAddAssetSuccess();
                    })
                    .withFailureHandler(function (error) {
                        self.$store.app.toastOrAlert('❌ 寫入失敗', 'error');
                        self.isBatchImporting = false;
                    })
                    .commitAssetsBatch(this.previewData);
            }
        };
    });

    /* ===== EditAssetModal(舊頁 12024-12509) ===== */
    Alpine.data('editAssetModal', function () {
        return {
            isLoading: true, isSubmitting: false, categories: [],
            assetName: '', modelBrand: '', category: '', purchaseDate: '', useLife: '',
            isItAsset: false, isActuallyComputer: false, isIsoScope: false,
            ismsExpanded: true, selectedIsmsAssetId: '', ismsSearchKeyword: '',

            init: function () {
                var self = this;
                var asset = this.$store.app.editingAsset || {};
                var preloaded = this.$store.app.addAssetDropdownData;
                // 初始值(舊頁 12033-12053)
                this.assetName = asset.assetName || '';
                this.modelBrand = asset.modelBrand || '';
                this.category = asset.category || '';
                this.purchaseDate = (function () {
                    if (!asset.purchaseDate) return '';
                    var date = new Date(asset.purchaseDate);
                    if (isNaN(date.getTime())) return '';
                    return date.toISOString().split('T')[0];
                })();
                this.useLife = asset.useLife || '';
                this.isItAsset = asset.isItAsset === '是';
                this.isActuallyComputer = asset.isActuallyComputer === '是';
                this.isIsoScope = asset.isIsoScope === '是';
                this.selectedIsmsAssetId = String(asset.ismsAssetId || '').trim();
                // 載入類別(舊頁 12080-12106)
                if (preloaded) {
                    this.categories = Array.isArray(preloaded.categories) ? preloaded.categories : [];
                    this.isLoading = false;
                } else {
                    this.isLoading = true;
                }
                google.script.run
                    .withSuccessHandler(function (data) {
                        self.categories = Array.isArray(data && data.categories) ? data.categories : [];
                        self.isLoading = false;
                    })
                    .withFailureHandler(function (error) { console.error('載入類別資料失敗：', error); self.isLoading = false; })
                    .getDropdownData();
                // 資訊資產連動(舊頁 12109-12115):取消主選項清子選項與已選 ISMS
                this.$watch('isItAsset', function (v) {
                    if (!v) { self.isActuallyComputer = false; self.isIsoScope = false; self.selectedIsmsAssetId = ''; }
                });
            },
            close: function () {
                this.$store.app.showEditAssetModal = false;
                this.$store.app.editingAsset = null;
            },
            get asset() { return this.$store.app.editingAsset || {}; },
            get ismsEnabled() { return this.$store.app.ismsEnabled; },
            get ismsAssets() { return this.$store.app.ismsAssets; },
            get filteredIsmsAssets() {
                if (!this.ismsSearchKeyword) return this.ismsAssets;
                var keyword = this.ismsSearchKeyword.toLowerCase();
                return this.ismsAssets.filter(function (a) {
                    return (a.ismsAssetId && a.ismsAssetId.toLowerCase().indexOf(keyword) !== -1) ||
                        (a.name && a.name.toLowerCase().indexOf(keyword) !== -1) ||
                        (a.category && a.category.toLowerCase().indexOf(keyword) !== -1) ||
                        (a.responsibleUnit && a.responsibleUnit.toLowerCase().indexOf(keyword) !== -1);
                });
            },
            get filteredIsmsAssetsTop() { return this.filteredIsmsAssets.slice(0, 50); },
            get selectedIsmsAsset() {
                if (!this.selectedIsmsAssetId) return null;
                var id = this.selectedIsmsAssetId;
                return this.ismsAssets.find(function (a) { return a.ismsAssetId === id; }) || null;
            },
            openCreateIsms: function () {
                var self = this;
                this.$store.app.openCreateIsms(function (newAsset) {
                    self.selectedIsmsAssetId = newAsset.ismsAssetId;
                    self.ismsSearchKeyword = '';
                });
            },
            handleSubmit: function () {
                var self = this;
                var asset = this.asset;
                if (!this.assetName.trim()) { alert('請填寫名稱'); return; }
                this.isSubmitting = true;
                var updates = {
                    assetName: this.assetName.trim(),
                    modelBrand: this.modelBrand.trim(),
                    category: this.category.trim(),
                    purchaseDate: this.purchaseDate || '',
                    useLife: this.useLife || '',
                    isItAsset: this.isItAsset ? '是' : '',
                    isActuallyComputer: this.isActuallyComputer ? '是' : '',
                    isIsoScope: this.isIsoScope ? '是' : ''
                };
                google.script.run
                    .withSuccessHandler(function (message) {
                        if (self.ismsEnabled) {
                            var ismsAssetIdToSave = self.isItAsset ? String(self.selectedIsmsAssetId || '').trim() : '';
                            google.script.run
                                .withSuccessHandler(function () {
                                    self.isSubmitting = false;
                                    alert(message);
                                    self.$store.app.handleEditAssetSuccess();
                                    self.close();
                                })
                                .withFailureHandler(function (error) {
                                    self.isSubmitting = false;
                                    alert('基本資料已更新，但 ISMS 對照儲存失敗：' + error.message);
                                    self.$store.app.handleEditAssetSuccess();
                                    self.close();
                                })
                                .saveIsmsClassification(asset.assetId, self.isItAsset, ismsAssetIdToSave, self.isIsoScope);
                        } else {
                            self.isSubmitting = false;
                            alert(message);
                            self.$store.app.handleEditAssetSuccess();
                            self.close();
                        }
                    })
                    .withFailureHandler(function (error) {
                        self.isSubmitting = false;
                        alert('更新失敗：' + error.message);
                    })
                    .updateAssetBasicInfo(asset.assetId, updates);
            }
        };
    });
});
</script>

                        <p class="text-slate-600">本手冊說明「新增資產」中的批次匯入操作方式與檔案格式規範，請依實作邏輯準備檔案並依步驟操作。</p>
                        <div>

                        <div>
                            <div class="text-base font-semibold text-slate-800 mb-2">匯入檔案準備規則</div>
                            <div class="space-y-3">
                                <div>
                                    <div class="font-medium text-slate-700">1) Excel（.xlsx）</div>

                                        <li>若兩個工作表都有資料，系統會一次匯入財產與物品。</li>

                                </div>

                                            <tbody class="text-slate-700">

                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="text-base font-semibold text-slate-800 mb-2">操作步驟</div>
                            <ol class="list-decimal pl-5 space-y-1 text-slate-600">
                                <li>點擊「新增資產」開啟視窗。</li>
                                <li>在「批次匯入」區塊選擇 `.xlsx` 或 `.csv` 檔案。</li>
                                <li>選擇「財產類別」（財產 / 非消耗品）。僅在匯入新系統資料時生效，會寫入財產總表 L 欄。</li>
                                <li>若為 CSV，請在下方「系統類別」選擇新系統或舊系統。</li>
                                <li>點擊「開始批次匯入」。</li>
                                <li>匯入完成後畫面會顯示成功/失敗筆數與失敗清單。</li>
                            </ol>
                        </div>
                        <div>

                            <ul class="list-disc pl-5 space-y-1 text-slate-600">
                                <li>必填欄位缺漏（編號、名稱、保管地點、保管人）。</li>
                                <li>保管人/使用人不是名單中的姓名（請填姓名而非 Email）。</li>
                                <li>名單中有重複姓名（系統要求姓名唯一）。</li>
                                <li>編號已存在於系統中。</li>
                                <li>同一匯入檔案內編號重複。</li>
                                <li>Excel 沒有 `財產總表` 或 `物品總表` 工作表。</li>
                            </ul>
                        </div>
                        <div>
                            <div class="text-base font-semibold text-slate-800 mb-2">匯入結果說明</div>
                            <ul class="list-disc pl-5 space-y-1 text-slate-600">
                                <li>成功筆數：實際新增到表格的筆數。</li>
                                <li>失敗筆數：驗證未通過的筆數。</li>
                                <li>失敗清單欄位：類型、列號、編號、原因、來源（Excel/CSV/工作表名稱）。</li>
                            </ul>
                        </div>
                        <div>
                            <div class="text-base font-semibold text-slate-800 mb-2">注意事項</div>
                            <ul class="list-disc pl-5 space-y-1 text-slate-600">

                                <li>財產名稱包含「電腦」時，系統會自動標記資訊資產與電腦欄位。</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>

                                <div class="border border-indigo-200 rounded-lg overflow-hidden">
                                    <button type="button" @click="ismsExpanded = !ismsExpanded" class="w-full px-4 py-3 bg-indigo-50 flex items-center justify-between text-sm font-medium text-indigo-700 hover:bg-indigo-100 transition-colors">
                                        <span class="flex items-center gap-2">
                                            <i class="fa-solid fa-shield-halved"></i>資訊資產分類
                                            <span x-show="isItAsset" class="px-2 py-0.5 bg-indigo-200 text-indigo-800 rounded-full text-xs">已標記</span>
                                            <span x-show="selectedIsmsAsset" class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full text-xs font-mono" x-text="selectedIsmsAsset ? selectedIsmsAsset.ismsAssetId : ''"></span>
                                        </span>
                                        <i class="fa-solid text-xs" :class="ismsExpanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                                    </button>
                                    <template x-if="ismsExpanded">
                                        <div class="px-4 py-3 space-y-3 bg-white">
                                            <template x-if="!isItAsset">
                                                <div class="text-sm text-slate-500 bg-slate-50 rounded-lg px-3 py-2 flex items-center gap-2">
                                                    <i class="fa-solid fa-circle-info text-slate-400"></i>請先勾選「此設備是否為資訊資產？」才能設定對應的資訊資產分類。
                                                </div>
                                            </template>
                                            <template x-if="isItAsset">
                                                <div class="space-y-2">
                                                    <div class="flex items-center justify-between">
                                                        <label class="block text-sm font-medium text-slate-700">對應資訊資產<span class="text-slate-400 font-normal ml-1">（選填）</span></label>
                                                        <button type="button" @click="openCreateIsms()" class="inline-flex items-center gap-1 px-2 py-1 text-xs font-medium text-indigo-600 hover:bg-indigo-50 rounded" title="新增資訊資產"><i class="fa-solid fa-plus"></i>新增</button>
                                                    </div>
                                                    <div class="relative">
                                                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                                        <input type="text" x-model="ismsSearchKeyword" placeholder="搜尋資訊資產編號/名稱..." class="w-full pl-8 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                                    </div>
                                                    <template x-if="selectedIsmsAsset">
                                                        <div class="flex items-center gap-2 bg-indigo-50 rounded-lg px-3 py-2 text-sm">
                                                            <i class="fa-solid fa-link text-indigo-500"></i>
                                                            <span class="text-indigo-800 font-medium" x-text="selectedIsmsAsset.ismsAssetId"></span>
                                                            <span class="text-indigo-600" x-text="selectedIsmsAsset.name"></span>
                                                            <button type="button" @click="selectedIsmsAssetId = ''" class="ml-auto text-indigo-400 hover:text-indigo-600"><i class="fa-solid fa-xmark"></i></button>
                                                        </div>
                                                    </template>
                                                    <template x-if="!selectedIsmsAsset && selectedIsmsAssetId">
                                                        <div class="flex items-center gap-2 bg-amber-50 rounded-lg px-3 py-2 text-sm">
                                                            <i class="fa-solid fa-triangle-exclamation text-amber-500"></i>
                                                            <span class="text-amber-800 font-mono" x-text="selectedIsmsAssetId"></span>
                                                            <span class="text-amber-700">（找不到對應資訊資產，仍會保留此編號）</span>
                                                            <button type="button" @click="selectedIsmsAssetId = ''" class="ml-auto text-amber-500 hover:text-amber-700"><i class="fa-solid fa-xmark"></i></button>
                                                        </div>
                                                    </template>
                                                    <div class="max-h-36 overflow-y-auto border border-slate-200 rounded-lg divide-y divide-slate-100">
                                                        <template x-if="filteredIsmsAssets.length === 0">
                                                            <div class="px-3 py-4 text-center text-sm text-slate-400" x-text="ismsSearchKeyword ? '找不到符合條件的資訊資產' : '無資訊資產資料'"></div>
                                                        </template>
                                                        <template x-for="ismsAsset in filteredIsmsAssetsTop" :key="ismsAsset.ismsAssetId">
                                                            <button type="button" @click="selectedIsmsAssetId = ismsAsset.ismsAssetId"
                                                                    class="w-full text-left px-3 py-2 text-sm hover:bg-indigo-50 transition-colors"
                                                                    :class="selectedIsmsAssetId === ismsAsset.ismsAssetId ? 'bg-indigo-100 border-l-2 border-indigo-500' : ''">
                                                                <div class="flex items-center gap-2">
                                                                    <span class="font-mono text-xs text-slate-500" x-text="ismsAsset.ismsAssetId"></span>
                                                                    <span x-show="ismsAsset.category" class="px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded text-xs" x-text="ismsAsset.category"></span>
                                                                </div>
                                                                <div class="text-slate-700 mt-0.5" x-text="ismsAsset.name"></div>
                                                                <div x-show="ismsAsset.responsibleUnit" class="text-xs text-slate-400 mt-0.5" x-text="ismsAsset.responsibleUnit"></div>
                                                            </button>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 rounded-b-2xl flex justify-end gap-3">
                <button @click="close()" :disabled="isSubmitting" class="px-4 py-2 text-slate-600 hover:bg-slate-200 rounded-lg transition-colors disabled:opacity-50">取消</button>
                <button @click="handleSubmit()" :disabled="isLoading || isSubmitting" class="px-6 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                    <template x-if="isSubmitting"><span class="flex items-center gap-2"><i class="fas fa-spinner fa-spin"></i><span>更新中...</span></span></template>
                    <template x-if="!isSubmitting"><span class="flex items-center gap-2"><i class="fas fa-save"></i><span>儲存變更</span></span></template>
                </button>
            </div>
        </div>
    </div>
</template>
