<html lang="zh-TW">
<head>

        if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        originalWarn.apply(console, args);
      };
    })();
  </script>

  <style id="dynamic-col-styles"></style>

  <style>
    :root {
      --ink-900: #0f172a;
      --ink-700: #334155;
      --ink-500: #64748b;
      --surface: #ffffff;
      --accent-500: #2563eb;
      --accent-600: #1d4ed8;
    }

    body {
      font-family: "Noto Sans TC", sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: white;
      color: #334155;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 500;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 500;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
    }

    .stat-label {
      font-size: 0.875rem;
      color: #64748b;
      margin-top: 4px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th {
      background: #f8fafc;
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      color: #334155;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
    }

    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
      white-space: nowrap;
    }

    .data-table tr:hover {
      background: #f8fafc;
    }

    .data-table tr.selected {
      background: #eff6ff;
    }

    /* 資產清單表格改為寬度由內容決定(不強制滿版)。
       原因:寬螢幕下容器約 2300px、內容只需約 1200px,只要 width:100%,
       多出來的空間一定得塞在某處 —— 不是集中成單一大空隙,就是平均攤給每一欄。
       要零空隙就只能讓表格不滿版,代價是右側留白。 */
    #assetTable { width: auto; }

    /* 表格欄位寬度設定 (具名 scoped CSS class 避免 Tailwind 凍結限制) */
    .col-checkbox { width: 48px; min-width: 48px; text-align: center; }
    .col-asset-id { min-width: 120px; }
    .col-asset-name { min-width: 180px; }
    .col-brand { min-width: 110px; }

    /* 可換行儲存格:.data-table td 的 white-space:nowrap 會讓「單筆超長內容」
       把整欄撐到 max-content,短內容那幾列看起來就是一大片空白。
       改成允許換行 —— 內容完整顯示不截斷,只是折成多行。
       用內層 div 是因為 auto table layout 下 <td> 的 max-width 不保證生效。 */
    .cell-brand,
    .cell-name {
      white-space: normal;      /* 覆蓋 .data-table td 的 nowrap */
      overflow-wrap: anywhere;  /* 不含空白的長序號也能斷 */
      line-height: 1.5;
    }
    .cell-brand { max-width: 240px; }  /* 240 而非 200:少折一兩行,可讀性較好 */
    .cell-name  { max-width: 180px; }  /* 與 .col-asset-name 的 min-width 對齊 → 欄寬固定 180 */
    .col-person { min-width: 90px; }
    .col-location { min-width: 120px; }
    .col-group { min-width: 100px; }
    .col-status { min-width: 100px; }
    .col-info-id { min-width: 140px; }

    /* 可點擊統計卡 */
    .stat-card.is-clickable { cursor: pointer; transition: all 0.15s; }
    .stat-card.is-clickable:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(15,23,42,0.10); }
    .stat-card.is-active { outline: 2px solid #2563eb; outline-offset: -2px; background: #eff6ff; }

    /* 組別晶片列 */
    .chip-row {
      display: flex; flex-wrap: nowrap; gap: 8px;
      overflow-x: auto; padding: 4px 0 8px;
    }
    .chip {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      border: 1px solid #e2e8f0; background: #fff;
      color: #334155; font-size: 0.875rem; cursor: pointer;
      white-space: nowrap; transition: all 0.15s;
    }
    .chip:hover { border-color: #93c5fd; background: #f8fafc; }
    .chip.is-active { border-color: #2563eb; background: #2563eb; color: #fff; }
    .chip__count {
      min-width: 20px; padding: 0 6px; border-radius: 999px;
      background: #f1f5f9; color: #475569; font-size: 0.75rem; font-weight: 600;
    }
    .chip.is-active .chip__count { background: rgba(255,255,255,0.25); color: #fff; }

    /* 底部浮出動作條：勾選 >=1 才滑出，未勾選時完全不佔版面 */
    .action-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 12px 24px;
      background: #fff; border-top: 1px solid #e2e8f0;
      box-shadow: 0 -4px 20px rgba(15,23,42,0.10);
      transform: translateY(110%); transition: transform 0.2s ease;
    }
    .action-bar.is-open { transform: translateY(0); }
    .action-bar__count {
      display: inline-flex; align-items: center; gap: 6px;
      font-weight: 600; color: #1d4ed8; cursor: pointer; white-space: nowrap;
    }
    .action-bar__field { display: flex; align-items: center; gap: 8px; }
    .action-bar__spacer { flex: 1 1 auto; }

    /* 已選清單浮層 */
    .selected-popover {
      position: fixed; left: 24px; bottom: 76px; z-index: 41;
      width: min(420px, calc(100vw - 48px)); max-height: 320px; overflow-y: auto;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
      box-shadow: 0 8px 28px rgba(15,23,42,0.16); padding: 12px;
      display: none;
    }
    .selected-popover.is-open { display: block; }

    /* 動作條展開時，避免遮住表格最後一列 */
    body.has-action-bar { padding-bottom: 88px; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-success {
      background: #dcfce7;
      color: #166534;
    }

    .badge-warning {
      background: #fef3c7;
      color: #92400e;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 16px 24px;
      border-radius: 8px;
      color: white;
      font-weight: 500;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }

    .toast-success { background: #22c55e; }
    .toast-error { background: #ef4444; }
    .toast-info { background: #3b82f6; }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .loading-spinner {
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .search-input {
      padding: 10px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      width: 100%;
      max-width: 300px;
    }

    .search-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .select-input {
      padding: 10px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: white;
      min-width: 200px;
    }

    .select-input:focus {
      outline: none;
      border-color: #2563eb;
    }

    /* 條碼掃描器樣式 - 參考主應用程式設計 */

    /* 移動裝置大卡片按鈕 */
    .mobile-scan-card {
      display: none;
      margin: 0 0 24px;
    }

    .mobile-scan-card__button {
      width: 100%;
      border: 0;
      border-radius: 22px;
      padding: 22px 18px;
      background: linear-gradient(160deg, #2f6c7f 0%, #1aa39f 55%, #23b7a9 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      box-shadow: 0 18px 38px rgba(26, 163, 159, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .mobile-scan-card__button:active {
      transform: translateY(1px);
      box-shadow: 0 14px 30px rgba(26, 163, 159, 0.25);
    }

    .mobile-scan-card__button:focus-visible {
      outline: 3px solid rgba(125, 211, 199, 0.7);
      outline-offset: 3px;
    }

    .mobile-scan-card__icon {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .mobile-scan-card__title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .mobile-scan-card__subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
    }

    @media (max-width: 768px) {
      .mobile-scan-card {
        display: block;
      }
    }

    /* 掃描器背景遮罩 */
    .scanner-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 2000;
      display: none;
    }

    .scanner-backdrop.active {
      display: block;
    }

    /* 掃描器彈出窗口 */
    .scanner-zone {
      display: none;
    }

    .scanner-zone.active {
      display: block;
      position: fixed;
      top: 6vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(760px, 94vw);
      max-height: 88vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      z-index: 2001;
    }

    #scanner-reader {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    #scanner-reader video {
      width: 100%;
      height: auto;
      display: block;
    }

    #scanner-reader canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .scanner-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 400px;
      height: 60%;
      border: 2px solid rgba(37, 99, 235, 0.8);
      border-radius: 8px;
      pointer-events: none;
    }

    .scanner-overlay::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(37, 99, 235, 0.8);
      animation: scanPulse 2s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
    }

    @keyframes scanPulse {
      0%, 100% { top: 10%; opacity: 0.3; }
      50% { top: 90%; opacity: 1; }
    }

    .scanner-status {
      text-align: center;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-weight: 500;
    }

    .scanner-status.scanning {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .scanner-status.success {
      background: #dcfce7;
      color: #166534;
    }

    .scanner-status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    /* 桌面版搜尋框旁的掃描按鈕 */
    .btn-scan-barcode {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .btn-scan-barcode {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="min-h-screen">
    <!-- 導覽列 -->
    <nav class="bg-white shadow-sm">
      <div class="max-w-[1500px] mx-auto px-4 md:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <i class="fas fa-link text-blue-600 text-xl"></i>
          <h1 class="text-xl font-bold text-gray-900">資訊資產邏輯分類編號管理</h1>
        </div>
        <div id="userInfo" class="text-sm text-gray-500"></div>
      </div>
    </nav>

    <!-- 主內容區 -->
    <main class="max-w-[1500px] mx-auto px-4 md:px-8 py-8">
      <!-- 統計卡片 -->
      <div id="statsSection" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="stat-card is-clickable" id="cardTotal" onclick="setMappedStatusFilter('')">
          <div class="stat-value" id="statTotal">-</div>
          <div class="stat-label">資產總數</div>
        </div>
        <div class="stat-card is-clickable" id="cardMapped" onclick="setMappedStatusFilter('mapped')">
          <div class="stat-value text-green-600" id="statMapped">-</div>
          <div class="stat-label">已對照</div>
        </div>
        <div class="stat-card is-clickable" id="cardUnmapped" onclick="setMappedStatusFilter('unmapped')">
          <div class="stat-value text-amber-600" id="statUnmapped">-</div>
          <div class="stat-label">未對照</div>
        </div>
        <div class="stat-card">
          <div class="stat-value text-blue-600" id="statRate">-</div>
          <div class="stat-label">對照率</div>
        </div>
      </div>

      <!-- 移動裝置掃描大卡片 -->
      <div class="mobile-scan-card">
        <button
          class="mobile-scan-card__button"
          onclick="toggleScanner()"
          aria-label="開啟相機掃描"
        >
          <span class="mobile-scan-card__icon" aria-hidden="true">
            <i class="fas fa-camera"></i>
          </span>
          <span class="mobile-scan-card__title">Tap to Scan Item</span>
          <span class="mobile-scan-card__subtitle">開啟相機掃描資產條碼</span>
        </button>
      </div>

      <!-- 掃描器背景遮罩 -->
      <div id="scannerBackdrop" class="scanner-backdrop" onclick="toggleScanner()"></div>

      <!-- 條碼掃描區（彈出窗口） -->
      <div id="scannerZone" class="scanner-zone">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-gray-900">
            <i class="fas fa-camera mr-2 text-blue-600"></i>條碼掃描器
          </h3>
          <button class="text-gray-500 hover:text-gray-700" onclick="toggleScanner()">
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <div id="scanner-reader">
          <div class="scanner-overlay"></div>
        </div>
        <div id="scannerStatus" class="scanner-status scanning">
          <i class="fas fa-spinner fa-spin mr-2"></i>準備掃描器...
        </div>
      </div>

      <div class="card mb-6 p-6">
        <div class="flex flex-wrap items-center gap-4 mb-6">
          <input type="text" id="assetSearch" class="search-input" placeholder="搜尋資產編號、名稱、保管人...">
              <button class="btn-secondary btn-scan-barcode" onclick="toggleScanner()">
                <i class="fas fa-camera mr-2"></i>掃描條碼
              </button>
              <button class="btn-secondary" onclick="loadAssets()">
                <i class="fas fa-sync-alt mr-2"></i>重新整理
              </button>
              <button class="btn-secondary" onclick="exportFiltered()">
                <i class="fas fa-download mr-2"></i>匯出篩選結果
              </button>
              <button class="btn-secondary" onclick="runIsoScan()">
                <i class="fas fa-shield-alt mr-2"></i>執行範圍掃描
              </button>
              
              <!-- 顯示欄位切換 -->
              <div class="relative inline-block text-left">
                <button class="btn-secondary" onclick="document.getElementById('colDropdown').classList.toggle('hidden')">
                  <i class="fas fa-columns mr-2"></i>顯示欄位
                </button>
                <div id="colDropdown" class="absolute z-10 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 hidden" style="right: 0;">
                  <div class="p-3 flex flex-col gap-2 max-h-64 overflow-y-auto">
                    <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                      <input type="checkbox" class="col-toggle-cb rounded border-gray-300" value="assetName" checked onchange="updateColumnVisibility()">
                      <span>資產名稱</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                      <input type="checkbox" class="col-toggle-cb rounded border-gray-300" value="brand" checked onchange="updateColumnVisibility()">
                      <span>廠牌型號</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                      <input type="checkbox" class="col-toggle-cb rounded border-gray-300" value="leaderName" checked onchange="updateColumnVisibility()">
                      <span>保管人</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                      <input type="checkbox" class="col-toggle-cb rounded border-gray-300" value="userName" checked onchange="updateColumnVisibility()">
                      <span>使用人</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                      <input type="checkbox" class="col-toggle-cb rounded border-gray-300" value="location" checked onchange="updateColumnVisibility()">
                      <span>地點</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                      <input type="checkbox" class="col-toggle-cb rounded border-gray-300" value="group" checked onchange="updateColumnVisibility()">
                      <span>組別</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                      <input type="checkbox" class="col-toggle-cb rounded border-gray-300" value="mappedStatus" checked onchange="updateColumnVisibility()">
                      <span>對照狀態</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                      <input type="checkbox" class="col-toggle-cb rounded border-gray-300" value="isoScope" checked onchange="updateColumnVisibility()">
                      <span>ISO 範圍</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                      <input type="checkbox" class="col-toggle-cb rounded border-gray-300" value="isoBasis" checked onchange="updateColumnVisibility()">
                      <span>認證依據</span>
                    </label>
                  </div>
                </div>
              </div>
              <select id="locationFilter" class="select-input" onchange="setFilterState('location', this.value)">
                <option value="">全部地點(數量)</option>
              </select>
            </div>

            <!-- 獨立一列的資訊資產下拉選單與其他篩選器 -->
            <div class="flex flex-wrap items-center gap-4 mb-4">
              <select id="ismsFilter" class="select-input" onchange="setIsmsFilter(this.value)">
                <option value="">全部資訊資產</option>
              </select>
              <select id="assetNameFilter" class="select-input" onchange="setFilterState('assetName', this.value)">
                <option value="">全部資產名稱(數量)</option>
              </select>
              <select id="leaderFilter" class="select-input" style="min-width: 0; width: 120px;" onchange="setFilterState('leaderName', this.value)">
                <option value="">全部保管人</option>
              </select>
              <!-- 強制將使用人與認證依據綁在同一行 -->
              <div class="flex items-center gap-4">
                <select id="userFilter" class="select-input" style="min-width: 0; width: 120px;" onchange="setFilterState('userName', this.value)">
                  <option value="">全部使用人</option>
                </select>
                <select id="isoBasisFilter" class="select-input" onchange="setFilterState('isoBasis', this.value)">
                  <option value="">全部認證依據(資產/資訊資產)</option>
                </select>
              </div>
            </div>

            <!-- ISO 範圍晶片列：數字排除 isoScope 維度，點選後其他狀態仍可橫向比較 -->
            <div class="flex items-center mb-1">
              <span class="text-sm font-semibold text-slate-700 whitespace-nowrap mr-3">ISO範圍：</span>
              <div class="chip-row flex-1 min-w-0" id="isoChips"></div>
            </div>

            <!-- 組別晶片列：數字排除 group 維度，點選後其他組仍可橫向比較 -->
            <div class="flex items-center">
              <span class="text-sm font-semibold text-slate-700 whitespace-nowrap mr-3">組別：</span>
              <div class="chip-row flex-1 min-w-0" id="groupChips"></div>
            </div>
      </div>

      <div class="card overflow-hidden mb-6">
        <div class="overflow-x-auto">
          <table class="data-table" id="assetTable">
            <thead>
                  <tr>
                    <th class="col-checkbox" data-col="checkbox">
                      <input type="checkbox" id="selectAllAssets" onchange="toggleSelectAll()">
                    </th>
                    <th class="col-asset-id" data-col="assetId">資產編號</th>
                    <th class="col-asset-name" data-col="assetName">資產名稱</th>
                    <th class="col-brand" data-col="brand">廠牌型號</th>
                    <th class="col-person" data-col="leaderName">保管人</th>
                    <th class="col-person" data-col="userName">使用人</th>
                    <th class="col-location" data-col="location">地點</th>
                    <th class="col-group" data-col="group">組別</th>
                    <th class="col-status" data-col="mappedStatus">對照狀態</th>
                    <th class="col-info-id" data-col="ismsAssetId">資訊資產編號</th>
                    <th class="col-status" data-col="isoScope">ISO 範圍</th>
                    <th class="col-location" data-col="isoBasis">認證依據</th>
                  </tr>
                </thead>
                <tbody id="assetTableBody">
                  <tr>
                    <td colspan="12" class="text-center py-8 text-gray-500">
                      <div class="loading-spinner mx-auto mb-2"></div>
                      載入中...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
      </div>
    </main>

    <!-- 已選資產浮層（點動作條的「已選 N 筆」展開） -->
    <div id="selectedPopover" class="selected-popover">
      <div class="flex items-center justify-between mb-2">
        <span class="font-semibold text-gray-900 text-sm">
          待對照資產 <span id="mappingAssetCount" class="text-gray-500">(0 筆)</span>
        </span>
        <button class="text-gray-400 hover:text-gray-600" onclick="toggleSelectedPopover()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="selectedAssetsList" class="space-y-2"></div>
    </div>

    <!-- 底部浮出動作條：取代原本的「對照作業」分頁 -->
    <div id="actionBar" class="action-bar">
      <span class="action-bar__count" onclick="toggleSelectedPopover()">
        <i class="fas fa-chevron-up"></i>
        已選 <span id="selectedCount">0</span> 筆
      </span>

      <div class="action-bar__field">
        <input type="text" id="ismsSearch" class="search-input" placeholder="搜尋資訊資產…" style="width:180px">
        <select id="ismsAssetSelect" class="select-input" style="min-width:240px">
          <option value="">-- 請選擇資訊資產 --</option>
        </select>
      </div>

      <div class="action-bar__field">
        <input type="text" id="mappingRemarks" class="search-input" placeholder="備註（選填）" style="width:180px">
      </div>

      <div class="action-bar__field">
        <select id="businessProcessSelect" class="select-input" style="min-width:200px">
          <option value="">-- 業務流程：不變更 --</option>
        </select>
        <button id="applyBusinessProcessBtn" class="btn-secondary" onclick="applyBusinessProcess()" disabled>
          <i class="fas fa-diagram-project mr-2"></i>套用業務流程
        </button>
      </div>

      <div class="action-bar__spacer"></div>

      <button id="createMappingBtn" class="btn-primary" onclick="createMapping()" disabled>
        <i class="fas fa-link mr-2"></i>建立對照
      </button>
    </div>


    <!-- Toast 容器 -->
    <div id="toastContainer"></div>

    <!-- 確認對話框 -->
    <div id="confirmModal" class="modal-overlay hidden">
      <div class="modal-content">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">
          <i class="fas fa-exclamation-triangle text-amber-500 mr-2"></i>覆蓋確認
        </h3>
        <p class="text-gray-600 mb-4" id="confirmMessage">以下資產已有對照，是否要覆蓋？</p>
        <div id="existingMappingsList" class="bg-amber-50 rounded-lg p-4 mb-6 max-h-40 overflow-y-auto"></div>
        <div class="flex justify-end gap-3">
          <button class="btn-secondary" onclick="closeConfirmModal()">取消</button>
          <button class="btn-danger" onclick="confirmOverwrite()">確認覆蓋</button>
        </div>
      </div>
    </div>

    <!-- ISO 範圍掃描報告（試算，尚未寫入） -->
    <div id="isoScanModal" class="modal-overlay hidden">
      <div class="modal-content" style="max-width:720px">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">
          <i class="fas fa-shield-alt text-blue-500 mr-2"></i>ISO 範圍掃描報告
        </h3>
        <p class="text-sm text-gray-500 mb-4">以下為試算結果，尚未寫入任何資料。</p>
        <div id="isoScanBody" class="text-sm text-gray-700 max-h-96 overflow-y-auto"></div>
        <div class="flex justify-end gap-3 mt-6">
          <button class="btn-secondary" onclick="closeIsoScanModal()">關閉</button>
          <button class="btn-secondary" onclick="exportIsoScan()">匯出核對</button>
          <button id="isoApplyBtn" class="btn-primary" onclick="applyIsoScan()">確認套用</button>
        </div>
      </div>
    </div>

    <!-- 批次設定業務流程確認（僅在存在未勾選的關聯資產時跳出） -->
    <div id="businessProcessModal" class="modal-overlay hidden">
      <div class="modal-content" style="max-width:640px">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">
          <i class="fas fa-diagram-project text-blue-500 mr-2"></i>確認設定業務流程
        </h3>
        <div id="businessProcessBody" class="text-sm text-gray-700 max-h-96 overflow-y-auto"></div>
        <div class="flex justify-end gap-3 mt-6">
          <button class="btn-secondary" onclick="closeBusinessProcessModal()">取消</button>
          <button id="businessProcessConfirmBtn" class="btn-primary" onclick="confirmBusinessProcess()">確認套用</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 全域狀態
    let allAssets = [];
    let allIsmsAssets = [];
    let selectedAssetIds = new Set();
    let pendingMappingData = null;
    let isCurrentUserAdmin = false;
    let allBusinessProcesses = [];
    let businessProcessOptionsAvailable = false;
    let pendingBusinessProcessData = null;

    // ==========================================
    // 欄位顯示隱藏邏輯
    // ==========================================
    function updateColumnVisibility() {
      let styleHtml = '';
      document.querySelectorAll('.col-toggle-cb').forEach(cb => {
        if (!cb.checked) {
          styleHtml += `#assetTable [data-col="${cb.value}"] { display: none !important; }\n`;
        }
      });
      document.getElementById('dynamic-col-styles').innerHTML = styleHtml;
    }

    document.addEventListener('click', function(e) {
      const dropdown = document.getElementById('colDropdown');
      if (!dropdown) return;
      const button = dropdown.previousElementSibling;
      if (!dropdown.contains(e.target) && !button.contains(e.target)) {
        dropdown.classList.add('hidden');
      }
    });

    // ==========================================
    // 初始化
    // ==========================================
    document.addEventListener('DOMContentLoaded', function() {
      loadUserInfo();
      loadAssets();
      loadIsmsAssets();
      loadBusinessProcessOptions();
      setupEventListeners();
    });

    function setupEventListeners() {
      // 資產搜尋／篩選：一律先寫 filterState，再走統一的 applyFilters
      document.getElementById('assetSearch').addEventListener('input', debounce(function() {
        filterState.keyword = document.getElementById('assetSearch').value.toLowerCase().trim();
        applyFilters();
      }, 300));

      // 組別晶片用事件委派（晶片每次重繪，不能逐顆綁）
      document.getElementById('groupChips').addEventListener('click', function(e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        setGroupFilter(chip.dataset.group || '');
      });

      // ISO 範圍晶片用事件委派（晶片每次重繪，不能逐顆綁）
      document.getElementById('isoChips').addEventListener('click', function(e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        setIsoFilter(chip.dataset.iso || '');
      });

      // 資訊資產搜尋（對照用選單）
      document.getElementById('ismsSearch').addEventListener('input', debounce(filterIsmsSelect, 300));

      // 資訊資產選擇
      document.getElementById('ismsAssetSelect').addEventListener('change', updateCreateMappingBtn);

      // 業務流程選值變動時，同時更新套用鈕與「建立對照」的動態文案
      document.getElementById('businessProcessSelect')
        .addEventListener('change', onBusinessProcessChange);
    }

    // ==========================================
    // 資料載入
    // ==========================================
    function loadUserInfo() {
      google.script.run
        .withSuccessHandler(function(user) {
          document.getElementById('userInfo').textContent =
            (user && user.email) ? user.email : '(未知使用者)';
          isCurrentUserAdmin = !!(user && user.isAdmin);
          applyAdminGating();
        })
        .withFailureHandler(function(err) {
          document.getElementById('userInfo').textContent = '(無法取得使用者)';
          isCurrentUserAdmin = false;   // 取不到身分一律當非管理員
          applyAdminGating();
          console.error('loadUserInfo 失敗:', err);
        })
        .getCurrentUser();
    }

    /**
     * 業務流程僅管理員可設定。停用而非隱藏——隱藏會讓承辦人以為功能不存在，
     * 轉而直接改試算表，那是更難稽核的路徑。
     * 這只是 UI 提示；真正的守門在後端 setIsmsBusinessProcessBatch 的
     * assertWriteAccess_(true)——google.script.run 不經過 doGet，前端 disabled 攔不住 console。
     */
    function applyAdminGating() {
      var sel = document.getElementById('businessProcessSelect');
      var btn = document.getElementById('applyBusinessProcessBtn');
      var hint = isCurrentUserAdmin ? '' : '僅管理員可設定業務流程';
      // 兩個條件要一起看：選項載入失敗時就算是管理員也不能用。
      // 這兩件事是各自獨立的非同步流程，只看其中一個會被後到的那個覆蓋掉。
      sel.disabled = !isCurrentUserAdmin || !businessProcessOptionsAvailable;
      sel.title = hint;
      btn.title = hint;
      updateApplyBusinessProcessBtn();
    }

    /**
     * 業務流程選項。isCertified 一併留著，確認對話框要用它決定 ISO 提示措辭。
     * 讀不到就停用這個功能，但不影響對照與主清單（fail-open）。
     * 這與後端 getCertifiedProcessSet_() 的 fail-closed 刻意不同：
     * UI 選項讀不到只是少一個功能，判定依據讀不到會產出錯誤結論。
     */
    function loadBusinessProcessOptions() {
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result || !result.success) {
            disableBusinessProcessSelector(
              '業務流程選項載入失敗：' + ((result && result.error) || '未知錯誤'));
            return;
          }
          allBusinessProcesses = result.businessProcesses || [];
          var html = '<option value="">-- 業務流程：不變更 --</option>' +
                     '<option value="__CLEAR__">— 清除業務流程 —</option>';
          allBusinessProcesses.forEach(function(p) {
            html += '<option value="' + escapeHtml(p.display) + '">' +
                    escapeHtml(p.display) + '</option>';
          });
          document.getElementById('businessProcessSelect').innerHTML = html;
          businessProcessOptionsAvailable = true;
          applyAdminGating();
        })
        .withFailureHandler(function(err) {
          disableBusinessProcessSelector(
            '業務流程選項載入失敗：' + (err && err.message ? err.message : err));
        })
        .getDropdownOptions();
    }

    function disableBusinessProcessSelector(msg) {
      var sel = document.getElementById('businessProcessSelect');
      sel.innerHTML = '<option value="">（業務流程載入失敗）</option>';
      businessProcessOptionsAvailable = false;
      sel.disabled = true;
      document.getElementById('applyBusinessProcessBtn').disabled = true;
      showToast(msg, 'error');
      console.error(msg);
    }

    /**
     * 「套用業務流程」的啟用條件：管理員 + 選項可用 + 有勾選 + 有選值。
     * 「不變更」（空值）不算選值。
     */
    function updateApplyBusinessProcessBtn() {
      var value = document.getElementById('businessProcessSelect').value;
      document.getElementById('applyBusinessProcessBtn').disabled =
        !isCurrentUserAdmin || !businessProcessOptionsAvailable ||
        selectedAssetIds.size === 0 || value === '';
    }

    function onBusinessProcessChange() {
      updateApplyBusinessProcessBtn();
      refreshCreateMappingBtnLabel();
    }

    /**
     * 動作條上兩個動作的作用對象不同：
     *   「套用業務流程」→ 勾選資產反查出的資訊資產集合
     *   「建立對照」    → 下拉中選定的那一筆資訊資產
     * 一個下拉配兩顆按鈕會使作用對象無法從畫面判斷，所以用按鈕文案在點擊前揭露。
     */
    function createMappingBtnLabel() {
      var willSetProcess = isCurrentUserAdmin && businessProcessOptionsAvailable &&
                           document.getElementById('businessProcessSelect').value !== '';
      return willSetProcess
        ? '<i class="fas fa-link mr-2"></i>建立對照並設定業務流程'
        : '<i class="fas fa-link mr-2"></i>建立對照';
    }

    function refreshCreateMappingBtnLabel() {
      var btn = document.getElementById('createMappingBtn');
      if (btn.dataset.busy === '1') return;   // 處理中不要蓋掉 spinner
      btn.innerHTML = createMappingBtnLabel();
    }

    /** 失敗時把 loading spinner 收斂成錯誤列，附重試入口（PLAYBOOK §4-9） */
    function renderTableError(message) {
      document.getElementById('assetTableBody').innerHTML =
        '<tr><td colspan="12" class="text-center py-8">' +
        '<div class="text-red-600 mb-3"><i class="fas fa-triangle-exclamation mr-2"></i>' +
        escapeHtml(message) + '</div>' +
        '<button class="btn-secondary" onclick="loadAssets()">' +
        '<i class="fas fa-rotate-right mr-2"></i>重試</button>' +
        '</td></tr>';
    }

    /**
     * @param {Function} [onDone] 渲染完成後呼叫。**失敗路徑刻意不呼叫**——
     *   那時 allAssets 還是舊的，拿去算 TOCTOU 數字會被後端擋下，錯誤訊息還會誤導。
     */
    function loadAssets(onDone) {
      document.getElementById('assetTableBody').innerHTML = `
        <tr><td colspan="12" class="text-center py-8 text-gray-500">
          <div class="loading-spinner mx-auto mb-2"></div>載入中...
        </td></tr>`;

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            allAssets = result.assets;
            applyFilters();            // 表格 + 統計卡 + 晶片列，並保留使用者當前的篩選條件
            renderIsmsFilterOptions(); // 選項來自 allAssets 的對照結果，兩支載入誰先到都要重繪
            renderOtherFilterOptions(); // 其他 5 個佔位篩選器
            if (onDone) onDone();      // 渲染完才回呼：呼叫端要讀更新後的 allAssets
          } else {
            renderTableError('載入資產失敗：' + (result.error || '未知錯誤'));
          }
        })
        .withFailureHandler(function(err) {
          renderTableError('載入資產失敗：' + (err && err.message ? err.message : err));
        })
        .getAssetsWithMappingStatus({});
    }

    function loadIsmsAssets() {
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            allIsmsAssets = result.assets;
            populateIsmsSelect();      // 對照用選單
            renderIsmsFilterOptions(); // 主清單的資訊資產篩選器
            renderOtherFilterOptions(); // 其他 5 個佔位篩選器
          } else {
            disableIsmsSelectors('資訊資產載入失敗：' + (result.error || '未知錯誤'));
          }
        })
        .withFailureHandler(function(err) {
          disableIsmsSelectors('資訊資產載入失敗：' + (err && err.message ? err.message : err));
        })
        .getIsmsAssets({});
    }

    /**
     * 資訊資產載入失敗時降級：停用兩個選單但不阻擋主清單。
     * 資產清單仍可瀏覽、篩選、匯出。
     */
    function disableIsmsSelectors(msg) {
      var filterSel = document.getElementById('ismsFilter');
      var mapSel = document.getElementById('ismsAssetSelect');
      filterSel.innerHTML = '<option value="">（資訊資產載入失敗）</option>';
      filterSel.disabled = true;
      mapSel.innerHTML = '<option value="">（資訊資產載入失敗）</option>';
      mapSel.disabled = true;
      showToast(msg, 'error');
      console.error(msg);
    }

    // ==========================================
    // 渲染函式
    // ==========================================
    function renderAssetTable(assets) {
      const tbody = document.getElementById('assetTableBody');

      if (assets.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12" class="text-center py-8 text-gray-500">無符合條件的資產</td></tr>';
        return;
      }

      tbody.innerHTML = assets.map(function(asset) {
        const isSelected = selectedAssetIds.has(asset.assetId);
        return `
          <tr class="${isSelected ? 'selected' : ''}" data-asset-id="${escapeHtml(asset.assetId)}">
            <td class="checkbox-wrapper" data-col="checkbox">
              <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleAssetSelection('${escapeHtml(asset.assetId)}')">
            </td>
            <td class="font-mono text-sm" data-col="assetId">${escapeHtml(asset.assetId)}</td>
            <td data-col="assetName"><div class="cell-name">${escapeHtml(asset.assetName)}</div></td>
            <td data-col="brand"><div class="cell-brand">${escapeHtml(asset.modelBrand || '-')}</div></td>
            <td data-col="leaderName">${escapeHtml(asset.leaderName)}</td>
            <td data-col="userName">${escapeHtml(asset.userName)}</td>
            <td data-col="location">${escapeHtml(asset.location)}</td>
            <td data-col="group">${escapeHtml(asset.group)}</td>
            <td data-col="mappedStatus">
              ${asset.isMapped
                ? '<span class="badge badge-success"><i class="fas fa-check mr-1"></i>已對照</span>'
                : '<span class="badge badge-warning"><i class="fas fa-times mr-1"></i>未對照</span>'}
            </td>
            <td class="font-mono text-sm" data-col="ismsAssetId">${escapeHtml(asset.mappedIsmsAssetId || '-')}</td>
            <td data-col="isoScope">${escapeHtml(isoLabelOf(asset))}</td>
            <td data-col="isoBasis"><div class="cell-name">${escapeHtml(asset.isoBasis || '-')}</div></td>
          </tr>
        `;
      }).join('');
    }


    function populateIsmsSelect() {
      const select = document.getElementById('ismsAssetSelect');

      // 只顯示 CATEGORY 為 "HW" 或 "EV" 的資訊資產
      const filteredAssets = allIsmsAssets.filter(function(asset) {
        return asset.category === 'HW' || asset.category === 'EV';
      });

      const options = filteredAssets.map(function(asset) {
        return `<option value="${escapeHtml(asset.ismsAssetId)}">${escapeHtml(asset.ismsAssetId)} - ${escapeHtml(asset.name)}</option>`;
      }).join('');

      select.innerHTML = '<option value="">-- 請選擇資訊資產 --</option>' + options;
    }


    function renderStatCards(stats) {
      document.getElementById('statTotal').textContent = stats.totalCount;
      document.getElementById('statMapped').textContent = stats.mappedCount;
      document.getElementById('statUnmapped').textContent = stats.unmappedCount;
      document.getElementById('statRate').textContent = stats.mappingRate + '%';
    }

    // ==========================================
    // 篩選狀態（單一真相）與衍生計算
    // ==========================================
    var filterState = {
      keyword: '',        // 搜尋關鍵字（已 toLowerCase）
      group: '',          // '' = 全部組別
      mappedStatus: '',   // '' = 全部 | 'mapped' | 'unmapped'
      ismsAssetId: '',    // '' = 全部資訊資產
      isoScope: '',       // '' = 全部 | 'V' 在範圍 | '?' 待判定 | 'out' 不在範圍 | 'unmapped' 未對照
      assetName: '',
      leaderName: '',
      userName: '',
      location: '',
      isoBasis: ''
    };

    /**
     * 對照表 F 欄的值 → 前端顯示用狀態。
     * 未對照的資產沒有基準線可讀，另成一態。
     */
    function isoStateOf(asset) {
      if (!asset.isMapped) return 'unmapped';
      var cell = String(asset.isoScope || '').trim();
      if (cell === 'V') return 'V';
      if (cell === '?') return '?';
      return 'out';
    }

    function isoLabelOf(asset) {
      var state = isoStateOf(asset);
      if (state === 'V') return '✅ 在範圍';
      if (state === '?') return '❓ 待判定';
      if (state === 'out') return '⬜ 不在範圍';
      return '— 未對照';
    }

    /** 點已選中的狀態＝取消，回到全部（與 setGroupFilter 同慣例） */
    function setIsoFilter(value) {
      filterState.isoScope = (filterState.isoScope === value) ? '' : value;
      applyFilters();
    }

    /**
     * 判斷單筆資產是否通過篩選。
     * @param {Object} asset
     * @param {string|null} excludeDim 要略過的維度名（'group' 等），null = 全部維度都套用
     * @returns {boolean}
     */
    function matchesFilters(asset, excludeDim) {
      if (excludeDim !== 'keyword' && filterState.keyword) {
        var k = filterState.keyword;
        var hit = asset.assetId.toLowerCase().indexOf(k) >= 0 ||
                  asset.assetName.toLowerCase().indexOf(k) >= 0 ||
                  asset.leaderName.toLowerCase().indexOf(k) >= 0 ||
                  asset.location.toLowerCase().indexOf(k) >= 0;
        if (!hit) return false;
      }
      if (excludeDim !== 'group' && filterState.group) {
        if ((asset.group || '未分組') !== filterState.group) return false;
      }
      if (excludeDim !== 'mappedStatus' && filterState.mappedStatus) {
        if (filterState.mappedStatus === 'mapped' && !asset.isMapped) return false;
        if (filterState.mappedStatus === 'unmapped' && asset.isMapped) return false;
      }
      if (excludeDim !== 'ismsAssetId' && filterState.ismsAssetId) {
        if (asset.mappedIsmsAssetId !== filterState.ismsAssetId) return false;
      }
      // ISO 範圍維度。excludeDim === 'isoScope' 時跳過，讓晶片算自己的數字時
      // 排除自己那一維 —— 否則點下去其他選項全部歸零就再也點不回來。
      if (excludeDim !== 'isoScope' && filterState.isoScope) {
        if (isoStateOf(asset) !== filterState.isoScope) return false;
      }
      if (excludeDim !== 'assetName' && filterState.assetName) {
        if (asset.assetName !== filterState.assetName) return false;
      }
      if (excludeDim !== 'leaderName' && filterState.leaderName) {
        if (asset.leaderName !== filterState.leaderName) return false;
      }
      if (excludeDim !== 'userName' && filterState.userName) {
        if (asset.userName !== filterState.userName) return false;
      }
      if (excludeDim !== 'location' && filterState.location) {
        if (asset.location !== filterState.location) return false;
      }
      if (excludeDim !== 'isoBasis' && filterState.isoBasis) {
        if (asset.isoBasis !== filterState.isoBasis) return false;
      }
      return true;
    }

    function getFilteredAssets() {
      return allAssets.filter(function(a) { return matchesFilters(a, null); });
    }

    /** 統計卡：套用「全部」篩選維度 —— 描述「當前這批資料是什麼」 */
    function computeStats(assets) {
      var total = assets.length;
      var mapped = 0;
      for (var i = 0; i < assets.length; i++) {
        if (assets[i].isMapped) mapped++;
      }
      return {
        totalCount: total,
        mappedCount: mapped,
        unmappedCount: total - mapped,
        mappingRate: total > 0 ? Math.round((mapped / total) * 100) : 0
      };
    }

    /** 全部出現過的組別，去重排序（取代後端 getGroupList） */
    function deriveGroupList() {
      var seen = {};
      var list = [];
      for (var i = 0; i < allAssets.length; i++) {
        var g = allAssets[i].group || '未分組';
        if (!seen[g]) { seen[g] = true; list.push(g); }
      }
      return list.sort(function(a, b) { return a.localeCompare(b, 'zh-TW'); });
    }

    /**
     * 晶片計數：套用「除 group 以外」的所有維度。
     * 若也套用 group，點選任一組後其他組會全部歸零，晶片就失去橫向比較的價值。
     */
    function computeGroupCounts() {
      var counts = {};
      for (var i = 0; i < allAssets.length; i++) {
        var a = allAssets[i];
        if (!matchesFilters(a, 'group')) continue;
        var g = a.group || '未分組';
        counts[g] = (counts[g] || 0) + 1;
      }
      return deriveGroupList().map(function(g) {
        return { group: g, count: counts[g] || 0 };
      });
    }

    // ==========================================
    // 篩選與搜尋
    // ==========================================
    /** 唯一的「重算並重繪」入口：任何篩選變動都呼叫這支 */
    function applyFilters() {
      renderAssetTable(getFilteredAssets());
      renderStatCards(computeStats(getStatusFacetAssets()));
      renderGroupChips();
      renderIsoChips();
      renderStatCardActiveState();
    }

    /**
     * 統計卡的計算基礎：套用「除 mappedStatus 以外」的所有維度。
     *
     * 與組別晶片同一原則 —— 每個分面的計數都要排除它自己那一維，否則點下去
     * 其他選項就全部歸零、失去比較與點回去的能力（點「已對照」之後
     * 「未對照」變 0、「總數」變 3，三張卡就都廢了）。
     *
     * 副作用：狀態篩選啟用時「資產總數」不等於表格列數。這正是選中卡片
     * 有藍色外框的用意 —— 它標示目前正在看哪一個子集。
     */
    function getStatusFacetAssets() {
      return allAssets.filter(function(a) { return matchesFilters(a, 'mappedStatus'); });
    }

    function renderGroupChips() {
      var counts = computeGroupCounts();
      var total = counts.reduce(function(n, c) { return n + c.count; }, 0);

      // 用 data-group + 事件委派，不用 inline onclick：
      // escapeHtml 會把 ' 轉成 &#039;，而 HTML 屬性解析器會在 JS 看到之前把它解回 '，
      // 塞進 onclick="setGroupFilter('...')" 的字串就會被截斷。
      var html = '<button type="button" class="chip' + (filterState.group === '' ? ' is-active' : '') +
                 '" data-group=""><span>全部</span>' +
                 '<span class="chip__count">' + total + '</span></button>';

      html += counts.map(function(c) {
        var active = filterState.group === c.group ? ' is-active' : '';
        return '<button type="button" class="chip' + active +
               '" data-group="' + escapeHtml(c.group) + '">' +
               '<span>' + escapeHtml(c.group) + '</span>' +
               '<span class="chip__count">' + c.count + '</span></button>';
      }).join('');

      document.getElementById('groupChips').innerHTML = html;
    }

    /**
     * ISO 範圍晶片：計數排除 isoScope 自己那一維（與組別晶片同一原則）。
     * 用 data-iso + 事件委派，理由同 renderGroupChips 的註解。
     */
    function renderIsoChips() {
      var pool = allAssets.filter(function(a) { return matchesFilters(a, 'isoScope'); });
      var counts = { 'V': 0, '?': 0, 'out': 0, 'unmapped': 0 };
      for (var i = 0; i < pool.length; i++) {
        var state = isoStateOf(pool[i]);
        if (counts[state] !== undefined) counts[state]++;
      }

      var chips = [
        { value: '', label: '全部範圍', count: pool.length },
        { value: 'V', label: '✅ 在範圍', count: counts['V'] },
        { value: '?', label: '❓ 待判定', count: counts['?'] },
        { value: 'out', label: '⬜ 不在範圍', count: counts['out'] },
        { value: 'unmapped', label: '— 未對照', count: counts['unmapped'] }
      ];

      document.getElementById('isoChips').innerHTML = chips.map(function(c) {
        var active = filterState.isoScope === c.value ? ' is-active' : '';
        return '<button type="button" class="chip' + active +
               '" data-iso="' + escapeHtml(c.value) + '">' +
               '<span>' + escapeHtml(c.label) + '</span>' +
               '<span class="chip__count">' + c.count + '</span></button>';
      }).join('');
    }

    /** 點已選中的組別＝取消，回到全部 */
    function setGroupFilter(group) {
      filterState.group = (filterState.group === group) ? '' : group;
      applyFilters();
    }

    /**
     * 主清單的資訊資產篩選器，取代原本的「資訊資產」分頁與「依資訊資產查詢」。
     *
     * 只列出「實際有資產對照上去」的編號 —— 列全部 HW/EV 沒有意義,
     * 選到還沒有對照的編號只會得到空清單。選項後方的數字是該編號底下的資產筆數。
     *
     * 資料來源同時依賴 allAssets(誰對照到誰)與 allIsmsAssets(編號的名稱),
     * 而這兩份由不同的非同步呼叫載入,先後不定 —— 因此本函式在兩邊的
     * successHandler 都會被呼叫一次,設計成可重複執行且會自行收斂。
     */
    function renderIsmsFilterOptions() {
      var nameById = {};
      for (var i = 0; i < allIsmsAssets.length; i++) {
        nameById[allIsmsAssets[i].ismsAssetId] = allIsmsAssets[i].name;
      }

      var counts = {};
      for (var j = 0; j < allAssets.length; j++) {
        var id = String(allAssets[j].mappedIsmsAssetId || '').trim();
        if (!id) continue;
        counts[id] = (counts[id] || 0) + 1;
      }

      var ids = Object.keys(counts).sort(function(a, b) {
        return a.localeCompare(b, 'zh-TW');
      });

      var options = ids.map(function(id) {
        var label = id + (nameById[id] ? ' · ' + nameById[id] : '') + '（' + counts[id] + '）';
        return '<option value="' + escapeHtml(id) + '">' + escapeHtml(label) + '</option>';
      }).join('');

      var sel = document.getElementById('ismsFilter');
      sel.innerHTML = '<option value="">全部資訊資產</option>' + options;
      sel.value = filterState.ismsAssetId;   // 重繪後保留使用者的選擇
    }

    function setIsmsFilter(ismsAssetId) {
      filterState.ismsAssetId = ismsAssetId || '';
      applyFilters();
    }

    function setFilterState(key, value) {
      filterState[key] = value || '';
      applyFilters();
    }

    function renderOtherFilterOptions() {
      var nameCounts = {}, leaderCounts = {}, userCounts = {}, locCounts = {};
      var isoBasisMap = {};
      
      for (var i = 0; i < allAssets.length; i++) {
        var a = allAssets[i];
        
        var aName = String(a.assetName || '').trim();
        if (aName) nameCounts[aName] = (nameCounts[aName] || 0) + 1;
        
        var leader = String(a.leaderName || '').trim();
        if (leader) leaderCounts[leader] = (leaderCounts[leader] || 0) + 1;
        
        var user = String(a.userName || '').trim();
        if (user) userCounts[user] = (userCounts[user] || 0) + 1;
        
        var loc = String(a.location || '').trim();
        if (loc) locCounts[loc] = (locCounts[loc] || 0) + 1;
        
        var basis = String(a.isoBasis || '').trim();
        if (basis) {
          if (!isoBasisMap[basis]) {
            isoBasisMap[basis] = { count: 0, ismsSet: new Set() };
          }
          isoBasisMap[basis].count++;
          if (a.mappedIsmsAssetId) {
            isoBasisMap[basis].ismsSet.add(a.mappedIsmsAssetId);
          }
        }
      }

      function buildOptions(counts, defaultText, useCount) {
        var keys = Object.keys(counts).sort(function(x, y) { return x.localeCompare(y, 'zh-TW'); });
        var html = '<option value="">' + defaultText + '</option>';
        for (var k = 0; k < keys.length; k++) {
          var val = keys[k];
          var display = val;
          if (useCount) display += ' (' + counts[val] + ')';
          html += '<option value="' + escapeHtml(val) + '">' + escapeHtml(display) + '</option>';
        }
        return html;
      }
      
      function buildIsoBasisOptions(map, defaultText) {
        var keys = Object.keys(map).sort(function(x, y) { return x.localeCompare(y, 'zh-TW'); });
        var html = '<option value="">' + defaultText + '</option>';
        for (var k = 0; k < keys.length; k++) {
          var val = keys[k];
          var display = val + ' (' + map[val].count + '/' + map[val].ismsSet.size + ')';
          html += '<option value="' + escapeHtml(val) + '">' + escapeHtml(display) + '</option>';
        }
        return html;
      }

      var selName = document.getElementById('assetNameFilter');
      if (selName) {
        selName.innerHTML = buildOptions(nameCounts, '全部資產名稱(數量)', true);
        selName.value = filterState.assetName;
      }
      
      var selLeader = document.getElementById('leaderFilter');
      if (selLeader) {
        selLeader.innerHTML = buildOptions(leaderCounts, '全部保管人', false);
        selLeader.value = filterState.leaderName;
      }
      
      var selUser = document.getElementById('userFilter');
      if (selUser) {
        selUser.innerHTML = buildOptions(userCounts, '全部使用人', false);
        selUser.value = filterState.userName;
      }
      
      var selLoc = document.getElementById('locationFilter');
      if (selLoc) {
        selLoc.innerHTML = buildOptions(locCounts, '全部地點(數量)', true);
        selLoc.value = filterState.location;
      }
      
      var selBasis = document.getElementById('isoBasisFilter');
      if (selBasis) {
        selBasis.innerHTML = buildIsoBasisOptions(isoBasisMap, '全部認證依據(資產/資訊資產)');
        selBasis.value = filterState.isoBasis;
      }
    }

    // ==========================================
    // 匯出（取代後端 exportMappingReport）
    // ==========================================

    /**
     * 組出 CSV。欄位順序與標題必須與原後端 exportMappingReport 完全一致（10 欄），
     * 確保既有使用者拿到的檔案格式不變。
     * @param {Array} assets 要匯出的資產
     * @returns {string}
     */
    function buildExportCsv(assets) {
      var ismsMap = {};
      for (var i = 0; i < allIsmsAssets.length; i++) {
        ismsMap[allIsmsAssets[i].ismsAssetId] = allIsmsAssets[i];
      }

      var headers = ['資產編號', '資產名稱', '資產類別', '保管人', '地點', '組別',
                     '對照狀態', '資訊資產編號', '資訊資產名稱', '資訊資產類別'];

      var rows = assets.map(function(a) {
        var isms = ismsMap[a.mappedIsmsAssetId] || {};
        return [
          a.assetId, a.assetName, a.assetCategory, a.leaderName, a.location, a.group,
          a.isMapped ? '已對照' : '未對照',
          a.mappedIsmsAssetId || '', isms.name || '', isms.category || ''
        ];
      });

      return [headers].concat(rows).map(function(row) {
        return row.map(sanitizeCsvCell).join(',');
      }).join('\n');
    }

    /**
     * CSV 儲存格跳脫 + 公式注入防護。
     *
     * 引號跳脫只解決分隔符問題,不解決公式解析:Excel / LibreOffice / Sheets
     * 會把以 = + - @ 或 tab/CR 開頭的儲存格當公式執行,**即使它包在引號內**。
     * 總表由多人維護且有批次匯入管道,惡意字串(如 =HYPERLINK(...))進得來,
     * 承辦人用 Excel 開匯出檔就會觸發。前置單引號讓它被當成純文字。
     */
    function sanitizeCsvCell(value) {
      var s = String(value == null ? '' : value);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    }

    // ==========================================
    // ISO 範圍掃描
    // ==========================================
    var isoScanReport = null;

    function runIsoScan() {
      showToast('掃描中，請稍候…', 'info');
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result.success) { showToast(result.error || '掃描失敗', 'error'); return; }
          isoScanReport = result;
          renderIsoScanReport(result);
          document.getElementById('isoScanModal').classList.remove('hidden');
        })
        .withFailureHandler(function(err) {
          showToast('掃描失敗：' + (err && err.message ? err.message : '未知錯誤'), 'error');
        })
        .previewIsoScopeScan();
    }

    function renderIsoScanReport(r) {
      var rows = [];
      rows.push('<div class="mb-3"><strong>資訊資產範圍統計</strong><br>' +
        '✅ 全部在範圍 ' + r.summary.inScope + ' 筆　' +
        '⚠️ 部分在範圍 ' + r.summary.partial + ' 筆　' +
        '❓ 待判定 ' + r.summary.pending + ' 筆　' +
        '⬜ 不在範圍 ' + r.summary.outScope + ' 筆</div>');

      rows.push('<div class="mb-3"><strong>與基準線的差異</strong><br>' +
        '↗ 進入範圍 ' + r.diff.entering.length + ' 台　' +
        '↙ 離開範圍 ' + r.diff.leaving.length + ' 台</div>');

      if (r.diff.leaving.length) {
        rows.push('<div class="mb-3">離開範圍：<ul class="list-disc ml-6">' +
          r.diff.leaving.slice(0, 20).map(function(x) {
            return '<li>' + escapeHtml(x.assetId) + ' ' + escapeHtml(x.assetName) +
                   '（' + escapeHtml(x.location) + '）→ ' + escapeHtml(x.basis) + '</li>';
          }).join('') + '</ul>' +
          (r.diff.leaving.length > 20 ? '<em>僅顯示前 20 台，完整清單請按「匯出核對」</em>' : '') +
          '</div>');
      }

      if (r.autoCreate.length) {
        rows.push('<div class="mb-3"><strong>將自動補號 ' + r.autoCreate.length + ' 筆</strong>' +
          '<ul class="list-disc ml-6">' + r.autoCreate.map(function(g) {
            return '<li>' + escapeHtml(g.previewId) + '　' + escapeHtml(g.assetName) +
                   ' ×' + g.count + '（' + escapeHtml(g.location) + ' / ' + escapeHtml(g.groupName) + '）</li>';
          }).join('') + '</ul></div>');
      }

      if (r.skipped.length) {
        rows.push('<div class="mb-3 text-amber-700"><strong>無法處理 ' + r.skipped.length + ' 組</strong>' +
          '<ul class="list-disc ml-6">' + r.skipped.map(function(s) {
            return '<li>' + escapeHtml(s.location) + ' / ' + escapeHtml(s.assetName) +
                   ' ×' + s.count + ' — ' + escapeHtml(s.reason) + '</li>';
          }).join('') + '</ul></div>');
      }

      rows.push('<div class="text-gray-500">與主表 Z 欄不一致 ' + r.zColumnMismatch +
        ' 台（僅供人工核對，本系統不回寫主表）</div>');

      document.getElementById('isoScanBody').innerHTML = rows.join('');
    }

    function closeIsoScanModal() {
      document.getElementById('isoScanModal').classList.add('hidden');
    }

    function applyIsoScan() {
      if (!isoScanReport) return;
      var btn = document.getElementById('isoApplyBtn');
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          if (!result.success) { showToast(result.error || '套用失敗', 'error'); return; }
          showToast(result.message, 'success');
          closeIsoScanModal();
          loadAssets();
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          showToast('套用失敗：' + (err && err.message ? err.message : '未知錯誤'), 'error');
        })
        .applyIsoScopeScan({
          generatedAt: isoScanReport.generatedAt,
          autoCreateCount: isoScanReport.autoCreate.length,
          enteringCount: isoScanReport.diff.entering.length,
          leavingCount: isoScanReport.diff.leaving.length
        });
    }

    function exportIsoScan() {
      if (!isoScanReport) return;
      var lines = [['類型', '資產編號', '資產名稱', '地點', '依據/原因']
        .map(sanitizeCsvCell).join(',')];

      isoScanReport.diff.entering.forEach(function(x) {
        lines.push(['進入範圍', x.assetId, x.assetName, x.location, x.basis]
          .map(sanitizeCsvCell).join(','));
      });
      isoScanReport.diff.leaving.forEach(function(x) {
        lines.push(['離開範圍', x.assetId, x.assetName, x.location, x.basis]
          .map(sanitizeCsvCell).join(','));
      });
      isoScanReport.autoCreate.forEach(function(g) {
        lines.push(['將補號', g.previewId, g.assetName + ' ×' + g.count, g.location, g.groupName]
          .map(sanitizeCsvCell).join(','));
      });
      isoScanReport.skipped.forEach(function(s) {
        lines.push(['無法處理', '', s.assetName + ' ×' + s.count, s.location, s.reason]
          .map(sanitizeCsvCell).join(','));
      });

      downloadCsv(lines.join('\n'), 'iso_scope_scan.csv');
    }

    function downloadCsv(csvContent, filename) {
      // BOM 讓 Excel 正確辨識 UTF-8 中文
      var blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }

    function exportFiltered() {
      var assets = getFilteredAssets();
      if (assets.length === 0) {
        showToast('目前篩選結果沒有資料可匯出', 'error');
        return;
      }
      var d = new Date();
      var stamp = d.getFullYear() + '-' +
                  String(d.getMonth() + 1).padStart(2, '0') + '-' +
                  String(d.getDate()).padStart(2, '0');
      downloadCsv(buildExportCsv(assets), '資產對照報表_' + stamp + '.csv');
      showToast('已匯出 ' + assets.length + ' 筆', 'success');
    }

    /** 點已選中的狀態＝取消；'' 一律代表全部 */
    function setMappedStatusFilter(status) {
      filterState.mappedStatus = (filterState.mappedStatus === status) ? '' : status;
      applyFilters();
    }

    function renderStatCardActiveState() {
      document.getElementById('cardTotal').classList.toggle('is-active', filterState.mappedStatus === '');
      document.getElementById('cardMapped').classList.toggle('is-active', filterState.mappedStatus === 'mapped');
      document.getElementById('cardUnmapped').classList.toggle('is-active', filterState.mappedStatus === 'unmapped');
    }

    function filterIsmsSelect() {
      const keyword = document.getElementById('ismsSearch').value.toLowerCase();
      const select = document.getElementById('ismsAssetSelect');

      // 只顯示 CATEGORY 為 "HW" 或 "EV" 的資訊資產
      const filtered = allIsmsAssets.filter(function(a) {

        filtered.map(function(asset) {
          return `<option value="${escapeHtml(asset.ismsAssetId)}">${escapeHtml(asset.ismsAssetId)} - ${escapeHtml(asset.name)}</option>`;
        }).join('');

    // ==========================================
    // 對照操作
    // ==========================================
    function createMapping() {
      const assetIds = Array.from(selectedAssetIds);
      const ismsAssetId = document.getElementById('ismsAssetSelect').value;
      const remarks = document.getElementById('mappingRemarks').value;

      if (assetIds.length === 0 || !ismsAssetId) {
        showToast('請選擇資產和資訊資產', 'error');
        return;
      }

      // 檢查是否有既有對照
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success && result.hasExisting) {
            // 顯示確認對話框
            pendingMappingData = { assetIds, ismsAssetId, remarks };
            showConfirmModal(result.existingMappings);
          } else {
            // 直接建立對照
            doCreateMapping(assetIds, ismsAssetId, remarks);
          }
        })
        .withFailureHandler(function(err) {
          showToast('檢查失敗: ' + err.message, 'error');
        })
        .checkExistingMappings(assetIds);
    }

    function doCreateMapping(assetIds, ismsAssetId, remarks) {
      var btn = document.getElementById('createMappingBtn');
      btn.dataset.busy = '1';
      btn.disabled = true;
      btn.innerHTML = '<div class="loading-spinner inline-block mr-2"></div>處理中...';

      // 先記下來：成功後 selectedAssetIds 會被清空、下拉會被重設
      var processValue = (isCurrentUserAdmin && businessProcessOptionsAvailable &&
                          document.getElementById('businessProcessSelect').value !== '')
        ? businessProcessSelectValue()
        : null;

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            showToast(result.message, 'success');
            selectedAssetIds.clear();
            updateSelectionUI();
            document.getElementById('mappingRemarks').value = '';
            document.getElementById('ismsAssetSelect').value = '';
            resetCreateMappingBtn();
            if (processValue !== null) {
              applyBusinessProcessAfterMapping(ismsAssetId, processValue);
            } else {
              loadAssets();   // 連帶重算統計卡，不需再單獨呼叫後端統計
            }
          } else {
            showToast(result.error, 'error');
            resetCreateMappingBtn();
          }
        })
        .withFailureHandler(function(err) {
          showToast('建立失敗: ' + err.message, 'error');
          resetCreateMappingBtn();
        })
        .createMappings(assetIds, ismsAssetId, remarks);
    }

    /**
     * 建立對照成功後接著設定業務流程。
     * 必須先 loadAssets() 重載，因為對照剛變動、波及台數也跟著變——
     * 用舊的數字送出去會直接被後端的 TOCTOU 檢查擋掉。
     */
    function applyBusinessProcessAfterMapping(ismsAssetId, processValue) {
      loadAssets(function() {
        var total = allAssets.filter(function(a) {
          return String(a.mappedIsmsAssetId || '').trim() === ismsAssetId;
        }).length;
        doApplyBusinessProcess([ismsAssetId], processValue, total, null);
      });
    }

    function resetCreateMappingBtn() {
      const btn = document.getElementById('createMappingBtn');
      btn.dataset.busy = '';
      btn.disabled = false;
      btn.innerHTML = createMappingBtnLabel();   // 不可寫死，否則動態文案會被洗掉
      updateCreateMappingBtn();
    }

    // ==========================================
    // 業務流程批次設定
    // ==========================================

    /**
     * 由勾選的實體資產反查目標資訊資產，並算出波及範圍。
     *
     * affectedCount 的定義必須與後端 countAffectedAssets_() 完全一致：
     * 目標資訊資產底下**所有**已對照實體資產（含未勾選者）。
     * 兩邊定義若不同，TOCTOU 檢查會每次都誤判成「資料已變動」。
     *
     * @returns {{targets: Array<{ismsAssetId, selected, total, before}>,
     *            unmapped: Array<string>, affectedCount: number, hiddenCount: number}}
     */
    function resolveBusinessProcessTargets() {
      var targets = {};
      var unmapped = [];

      selectedAssetIds.forEach(function(assetId) {
        var asset = allAssets.find(function(a) { return a.assetId === assetId; });
        if (!asset) return;
        var id = String(asset.mappedIsmsAssetId || '').trim();
        if (!asset.isMapped || !id) { unmapped.push(assetId); return; }
        if (!targets[id]) {
          var isms = allIsmsAssets.find(function(x) { return x.ismsAssetId === id; });
          targets[id] = {
            ismsAssetId: id,
            selected: 0,
            total: 0,
            before: (isms && isms.businessProcess) ? isms.businessProcess : ''
          };
        }
        targets[id].selected++;
      });

      // total 要掃全表，不能只看勾選的——這正是「隱形波及」的來源
      allAssets.forEach(function(a) {
        var id = String(a.mappedIsmsAssetId || '').trim();
        if (id && targets[id]) targets[id].total++;
      });

      var list = Object.keys(targets).map(function(k) { return targets[k]; });
      return {
        targets: list,
        unmapped: unmapped,
        affectedCount: list.reduce(function(s, t) { return s + t.total; }, 0),
        hiddenCount: list.reduce(function(s, t) { return s + (t.total - t.selected); }, 0)
      };
    }

    /** 下拉的 __CLEAR__ 哨兵值轉成後端認得的空字串 */
    function businessProcessSelectValue() {
      var raw = document.getElementById('businessProcessSelect').value;
      return raw === '__CLEAR__' ? '' : raw;
    }

    /**
     * ISO 提示只陳述**流程層級**的事實，不預測逐台結果。
     * 駐站資產不看業務流程，而駐站認證狀態需讀 HR 組織架構樹 I 欄，只有後端知道；
     * 前端手上的 asset.isoScope 是對照表 F 欄的基準線，不是即時真相。
     * 逐台預測要另開後端判定端點，與 ISO 掃描的預覽高度重疊，故不做。
     */
    function isoHintFor(value) {
      if (value === '') {
        return '清除後，這些資訊資產底下的<strong>非駐站</strong>實體資產將回到「待判定」；駐站資產不受影響。';
      }
      var p = allBusinessProcesses.find(function(x) { return x.display === value; });
      var name = escapeHtml(value);
      if (p && p.isCertified) {
        return '「' + name + '」屬於 ISO 認證業務流程。套用後，這些資訊資產底下的' +
               '<strong>非駐站</strong>實體資產將納入驗證範圍；駐站資產不受影響' +
               '（其範圍由駐站認證狀態決定）。';
      }
      return '「' + name + '」<strong>不</strong>屬於 ISO 認證業務流程。套用後，這些資訊資產底下的' +
             '<strong>非駐站</strong>實體資產將脫離驗證範圍；駐站資產不受影響。';
    }

    /**
     * 「套用業務流程」進入點。
     * 只有在偵測到未勾選的關聯資產時才跳確認——沒有隱形波及就直接套用，
     * 不打斷順暢的情況。
     */
    function applyBusinessProcess() {
      var value = businessProcessSelectValue();
      var info = resolveBusinessProcessTargets();

      if (info.targets.length === 0) {
        showToast('勾選的資產都尚未對照，沒有可設定的資訊資產', 'error');
        return;
      }

      pendingBusinessProcessData = {
        ismsAssetIds: info.targets.map(function(t) { return t.ismsAssetId; }),
        value: value,
        expectedAffectedCount: info.affectedCount
      };

      if (info.hiddenCount > 0) {
        renderBusinessProcessConfirm(info, value);
        document.getElementById('businessProcessModal').classList.remove('hidden');
        return;
      }
      confirmBusinessProcess();
    }

    function renderBusinessProcessConfirm(info, value) {
      var label = value === '' ? '（清除）' : escapeHtml(value);
      var html = '<p class="mb-3">將把業務流程設為 <strong>' + label + '</strong>：</p>' +
                 '<div class="bg-gray-50 rounded-lg p-3 mb-4 space-y-2">';

      info.targets.forEach(function(t) {
        var hidden = t.total - t.selected;
        html += '<div class="flex items-center justify-between gap-3">' +
                '<span class="font-mono text-xs">' + escapeHtml(t.ismsAssetId) + '</span>' +
                '<span class="text-gray-600">' +
                  escapeHtml(t.before || '(未設定)') + ' → ' + label +
                '</span>' +
                '<span class="text-gray-500 text-xs">掛 ' + t.total + ' 台' +
                  (hidden > 0
                    ? '（其中 <strong class="text-amber-600">' + hidden + ' 台未勾選</strong>）'
                    : '（全部已勾選）') +
                '</span></div>';
      });
      html += '</div>';

      html += '<p class="text-blue-700 bg-blue-50 rounded p-3 mb-3">' +
              '<i class="fas fa-circle-info mr-2"></i>' + isoHintFor(value) + '</p>';

      if (info.unmapped.length > 0) {
        html += '<p class="text-amber-700 bg-amber-50 rounded p-3">' +
                '<i class="fas fa-triangle-exclamation mr-2"></i>' +
                info.unmapped.length + ' 台勾選的資產尚未對照，將略過（不會自動補號）。</p>';
      }

      document.getElementById('businessProcessBody').innerHTML = html;
    }

    function closeBusinessProcessModal() {
      document.getElementById('businessProcessModal').classList.add('hidden');
      pendingBusinessProcessData = null;
    }

    function confirmBusinessProcess() {
      if (!pendingBusinessProcessData) return;
      var d = pendingBusinessProcessData;
      doApplyBusinessProcess(d.ismsAssetIds, d.value, d.expectedAffectedCount, function() {
        closeBusinessProcessModal();
      });

    /**
     * 送出批次設定。錯誤走 withSuccessHandler 裡的 result.success 判斷——
     * 後端一律回 {success:...} 而不 throw，withFailureHandler 只會在連線層失敗時觸發。
     */
    function doApplyBusinessProcess(ismsAssetIds, value, expectedAffectedCount, onDone) {
      var btn = document.getElementById('businessProcessConfirmBtn');
      var applyBtn = document.getElementById('applyBusinessProcessBtn');
      btn.disabled = true;
      applyBtn.disabled = true;
      btn.innerHTML = '<div class="loading-spinner inline-block mr-2"></div>處理中...';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success) {
            var parts = [];
            if (result.updated.length) parts.push(result.updated.length + ' 筆已更新');
            if (result.noChange.length) parts.push(result.noChange.length + ' 筆無變更');
            if (result.skipped.length) parts.push(result.skipped.length + ' 筆略過');
            showToast(parts.join('、') || '沒有需要更新的資料', 'success');
            (result.skipped || []).forEach(function(s) {
              console.warn('略過 ' + s.ismsAssetId + '：' + s.reason);
            });
            selectedAssetIds.clear();
            document.getElementById('businessProcessSelect').value = '';
            updateSelectionUI();
            loadAssets();
            loadIsmsAssets();   // 業務流程改了，前端快取的 allIsmsAssets 要跟著更新
          } else {
            showToast((result && result.error) || '設定失敗', 'error');
          }
          resetBusinessProcessBtn();
          if (onDone) onDone();
        })
        .withFailureHandler(function(err) {
          showToast('設定失敗: ' + (err && err.message ? err.message : err), 'error');
          resetBusinessProcessBtn();
          if (onDone) onDone();
        })
        .setIsmsBusinessProcessBatch({
          ismsAssetIds: ismsAssetIds,
          businessProcess: value,
          expectedAffectedCount: expectedAffectedCount
        });
    }

      var btn = document.getElementById('businessProcessConfirmBtn');

    // ==========================================
    // 工具函式
    // ==========================================
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function debounce(func, wait) {
      let timeout;
      return function() {
        const context = this;
        const args = arguments;
        clearTimeout(timeout);
        timeout = setTimeout(function() {
          func.apply(context, args);
        }, wait);
      };
    }

    function showToast(message, type) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      toast.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle') + ' mr-2"></i>' + escapeHtml(message);
      container.appendChild(toast);

      setTimeout(function() {
        toast.style.animation = 'slideIn 0.3s ease reverse';
        setTimeout(function() {
          container.removeChild(toast);
        }, 300);
      }, 3000);
    }

    // ==========================================
    // 條碼掃描功能
    // ==========================================
    (function() {
      let isScanning = false;
      let lastScannedCode = null;
      let lastScannedTime = 0;
      const SCAN_COOLDOWN = 2000; // 2 秒冷卻時間

      // 格式化條碼（參考主應用程式規則）
      function formatBarcode(barcode) {
        const cleanCode = barcode.toString().trim();
        // 20 碼去前 2 位
        let processed = cleanCode.length === 20 ? cleanCode.substring(2) : cleanCode;

        if (processed.length < 11) return processed;

        // 格式化為 XXXXXXX-XXXX-XXXXXXX (7-4-7)
        return processed.substring(0, 7) + '-' +
               processed.substring(7, 11) + '-' +
               processed.substring(11);
      }

      // 切換掃描器顯示/隱藏
      window.toggleScanner = function() {
        const zone = document.getElementById('scannerZone');
        const backdrop = document.getElementById('scannerBackdrop');

        if (zone.classList.contains('active')) {
          stopScanner();
        } else {
          zone.classList.add('active');
          backdrop.classList.add('active');
          startScanner();
        }
      };

      // 啟動掃描器
      function startScanner() {
        if (typeof Quagga === 'undefined') {
          updateScannerStatus('error', '無法載入掃描器函式庫，請使用搜尋功能');
          setTimeout(() => {
            document.getElementById('scannerZone').classList.remove('active');
            document.getElementById('assetSearch').focus();
          }, 2000);
          return;
        }

        updateScannerStatus('scanning', '準備相機中...');

        Quagga.init({
          inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector('#scanner-reader'),
            constraints: {
              width: 640,
              height: 480,
              facingMode: "environment"
            }
          },
          decoder: {
            readers: [
              "code_128_reader",
              "ean_reader",
              "ean_8_reader",
              "code_39_reader",
              "code_39_vin_reader",
              "codabar_reader",
              "upc_reader",
              "upc_e_reader",
              "i2of5_reader"
            ]
          },
          locate: true,
          locator: {
            patchSize: "medium",
            halfSample: true
          }
        }, function(err) {
          if (err) {
            console.error('Quagga 初始化失敗:', err);
            updateScannerStatus('error', '相機啟動失敗：' + err.message);
            setTimeout(() => {
              stopScanner();
              document.getElementById('assetSearch').focus();
            }, 2000);
            return;
          }

          Quagga.start();
          isScanning = true;
          updateScannerStatus('scanning', '掃描器運作中，請對準條碼...');
        });

        Quagga.onDetected(onBarcodeDetected);
      }

      // 停止掃描器
      function stopScanner() {
        if (isScanning) {
          Quagga.stop();
          isScanning = false;
        }

        // 釋放相機資源
        const videoElement = document.querySelector('#scanner-reader video');
        if (videoElement && videoElement.srcObject) {
          videoElement.srcObject.getTracks().forEach(track => track.stop());
        }

        // 清空 DOM
        const reader = document.getElementById('scanner-reader');
        while (reader.children.length > 1) {
          reader.removeChild(reader.lastChild);
        }

        // 關閉彈出窗口和背景遮罩
        document.getElementById('scannerZone').classList.remove('active');
        document.getElementById('scannerBackdrop').classList.remove('active');
      }

      // 條碼檢測回調
      function onBarcodeDetected(result) {
        if (!result || !result.codeResult) return;

        const code = result.codeResult.code;
        const now = Date.now();

        // 防重複掃描（2 秒冷卻）
        if (code === lastScannedCode && (now - lastScannedTime) < SCAN_COOLDOWN) {
          return;
        }

        lastScannedCode = code;
        lastScannedTime = now;

        // 播放提示音

      // 處理條碼
      function processBarcode(rawCode) {
        const formattedCode = formatBarcode(rawCode);

        updateScannerStatus('scanning', `掃描到條碼: ${formattedCode}，查找中...`);

        // 在 allAssets 中查找（支援原始碼 + 格式化碼匹配）
        const asset = allAssets.find(a => {
          const assetId = a.assetId;
          const assetIdNoDash = assetId.replace(/-/g, '');
          const formattedNoDash = formattedCode.replace(/-/g, '');
          const rawNoDash = rawCode.replace(/-/g, '');

          return assetId === rawCode ||
                 assetId === formattedCode ||
                 assetIdNoDash === rawNoDash ||
                 assetIdNoDash === formattedNoDash;
        });

        if (asset) {
          // 找到資產，自動勾選
          selectedAssetIds.add(asset.assetId);
          updateSelectionUI();

          updateScannerStatus('success', `✓ 已加入資產: ${asset.assetName}`);
          showToast(`已加入資產: ${asset.assetName}`, 'success');

          // 2 秒後恢復掃描狀態
          setTimeout(() => {
            if (isScanning) {
              updateScannerStatus('scanning', '掃描器運作中，請對準條碼...');
            }
          }, 2000);
        } else {
          updateScannerStatus('error', `✗ 未找到資產編號: ${formattedCode}`);
          console.log('無法匹配的條碼:', { raw: rawCode, formatted: formattedCode });

          setTimeout(() => {
            if (isScanning) {
              updateScannerStatus('scanning', '掃描器運作中，請對準條碼...');
            }
          }, 2000);
        }
      }

      // 更新掃描器狀態顯示
      function updateScannerStatus(type, message) {
        const status = document.getElementById('scannerStatus');
        status.className = 'scanner-status ' + type;

        let icon = '';
        if (type === 'scanning') icon = '<i class="fas fa-spinner fa-spin mr-2"></i>';
        else if (type === 'success') icon = '<i class="fas fa-check-circle mr-2"></i>';
        else if (type === 'error') icon = '<i class="fas fa-exclamation-circle mr-2"></i>';

        status.innerHTML = icon + message;
      }

      // 增強搜尋框功能：Enter 鍵快速掃描
      function enhanceSearchBox() {
        const searchInput = document.getElementById('assetSearch');
        searchInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            const code = this.value.trim();
            if (code) {
              const formattedCode = formatBarcode(code);

              // 查找資產
              const asset = allAssets.find(a => {
                const assetId = a.assetId;
                const assetIdNoDash = assetId.replace(/-/g, '');
                const formattedNoDash = formattedCode.replace(/-/g, '');
                const codeNoDash = code.replace(/-/g, '');

                return assetId === code ||
                       assetId === formattedCode ||
                       assetIdNoDash === codeNoDash ||
                       assetIdNoDash === formattedNoDash;
              });

              if (asset) {
                selectedAssetIds.add(asset.assetId);
                updateSelectionUI();
                showToast(`已加入資產: ${asset.assetName}`, 'success');
                this.value = ''; // 清空搜尋框
              } else {
                // 找不到，保持搜尋模式
                filterState.keyword = this.value.toLowerCase().trim();
                applyFilters();
              }
            }
          }
        });
      }

      // 初始化增強功能
      document.addEventListener('DOMContentLoaded', function() {
        enhanceSearchBox();
      });
    })();
  </script>
