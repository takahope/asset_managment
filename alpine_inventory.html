
<!-- ===== InventoryDashboardCard(盤點功能關閉時整張隱藏,已由 alpine_views.html 掛載點控制) ===== -->
<template x-if="$store.app.inventoryFeatureEnabled">
    <div x-data="inventoryDashboardCard" x-show="isLoadingSessions || sessions.length > 0" class="bg-white rounded-xl shadow-sm border border-slate-200 mb-6">
        <div class="px-4 py-3 border-b border-slate-200 flex justify-between items-center cursor-pointer hover:bg-slate-50 transition-colors" @click="isExpanded = !isExpanded">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-teal-500"></i>
                <h3 class="text-base font-semibold text-slate-800">盤點進度監控儀表板</h3>
                <span x-show="!isExpanded && selectedSession" class="text-xs text-slate-500 ml-2" x-text="selectedSession ? ('(' + selectedSession.inventoryDate + ' - ' + progressPercent + '%)') : ''"></span>
            </div>
            <i class="fa-solid text-slate-400 transition-transform" :class="isExpanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
        </div>
        <template x-if="isExpanded">
            <div class="p-4">
                <template x-if="isLoadingDashboard">
                    <div class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl text-teal-500"></i><p class="text-sm text-slate-500 mt-2">載入中...</p></div>
                </template>
                <template x-if="!isLoadingDashboard">
                    <div>
                        <div class="mb-4" x-show="sessions.length > 1">
                            <label class="block text-sm font-medium text-slate-700 mb-2">選擇盤點會話</label>
                            <select x-model="selectedSessionId" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                                <template x-for="session in sessions" :key="session.inventoryId">
                                    <option :value="session.inventoryId" x-text="session.inventoryDate + ' - ' + session.inventoryPerson + ' - ' + (session.conditionSummary || session.filter || '未指定範圍')"></option>
                                </template>
                            </select>
                        </div>
                        <div class="mb-3 text-xs text-slate-500 break-all" x-show="selectedSession">
                            <i class="fa-regular fa-circle-info mr-1"></i>範圍：<span x-text="selectedSession ? (selectedSession.conditionSummary || selectedSession.filter || '未指定') : ''"></span>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div class="text-center p-3 bg-slate-50 rounded-lg">
                                <div class="text-3xl font-bold text-teal-600" x-text="progressPercent + '%'"></div>
                                <div class="text-xs text-slate-500 mt-1">總體完成率</div>
                            </div>
                            <div class="text-center p-3 bg-slate-50 rounded-lg">
                                <div class="text-3xl font-bold text-slate-700" x-text="verifiedCount + '/' + totalCount"></div>
                                <div class="text-xs text-slate-500 mt-1">已盤點/總數</div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                                <div class="bg-gradient-to-r from-teal-500 to-teal-600 h-full transition-all duration-300" :style="'width:' + progressPercent + '%'"></div>
                            </div>
                        </div>
                        <template x-if="isLoadingStats"><div class="text-center text-sm text-slate-500 py-4">載入分組統計中...</div></template>
                        <template x-if="!isLoadingStats && statsError"><div class="text-center text-sm text-rose-600 py-4" x-text="'分組統計載入失敗：' + statsError"></div></template>
                        <template x-if="!isLoadingStats && !statsError && groupStats.length > 0">
                            <div class="overflow-hidden rounded-lg border border-slate-200 mb-4">
                                <table class="w-full text-sm">
                                    <thead class="bg-slate-50"><tr>
                                        <th class="px-3 py-2 text-left font-medium text-slate-600">分配對象</th>
                                        <th class="px-3 py-2 text-left font-medium text-slate-600">進度</th>
                                        <th class="px-3 py-2 text-right font-medium text-slate-600">數量</th>
                                    </tr></thead>
                                    <tbody class="divide-y divide-slate-100">
                                        <template x-for="(stat, idx) in groupStats" :key="idx">
                                            <tr class="hover:bg-slate-50" :class="canViewAssignmentDetails(statAssignmentKey(stat)) ? 'cursor-pointer' : 'opacity-60'"
                                                @click="canViewAssignmentDetails(statAssignmentKey(stat)) ? openAssignmentDetails(stat) : null"
                                                :title="canViewAssignmentDetails(statAssignmentKey(stat)) ? '查看詳細清單' : '僅限本人/組別查看'">
                                                <td class="px-3 py-2">
                                                    <template x-if="statLabel(stat) === '未指派'">
                                                        <span class="inline-flex items-center gap-2 text-red-600 font-medium">
                                                            <span>⚠️ 未指派</span>
                                                            <span class="text-xs font-normal" :class="canViewAssignmentDetails(statAssignmentKey(stat)) ? 'text-teal-600' : 'text-slate-400'" x-text="canViewAssignmentDetails(statAssignmentKey(stat)) ? '查看' : '限本人/組別'"></span>
                                                        </span>
                                                    </template>
                                                    <template x-if="statLabel(stat) !== '未指派'">
                                                        <span class="inline-flex items-center gap-2">
                                                            <span x-text="statLabel(stat)"></span>
                                                            <span class="text-xs" :class="canViewAssignmentDetails(statAssignmentKey(stat)) ? 'text-teal-600' : 'text-slate-400'" x-text="canViewAssignmentDetails(statAssignmentKey(stat)) ? '查看' : '限本人/組別'"></span>
                                                        </span>
                                                    </template>
                                                </td>
                                                <td class="px-3 py-2">
                                                    <div class="flex items-center gap-2">
                                                        <div class="flex-1 bg-slate-200 rounded-full h-2 overflow-hidden">
                                                            <div class="h-full transition-all" :class="statColorClass(stat)" :style="'width:' + statPercent(stat) + '%'"></div>
                                                        </div>
                                                        <span class="text-xs text-slate-600 w-10 text-right" x-text="statPercent(stat) + '%'"></span>
                                                    </div>
                                                </td>
                                                <td class="px-3 py-2 text-right text-slate-600" x-text="Number(stat.verifiedCount || 0) + ' / ' + Number(stat.assignedCount || 0)"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                        <template x-if="!isLoadingStats && !statsError && groupStats.length === 0">
                            <div class="text-center text-sm text-slate-500 py-4">尚無分組統計資料</div>
                        </template>
                        <div class="mt-4 flex justify-end gap-2" x-show="$store.app.isAdminView">
                            <button @click="fetchDashboardData(selectedSessionId, { refreshModal: true }); $store.app.refreshCardData();" class="px-4 py-2 text-sm bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition-colors">
                                <i class="fa-solid fa-rotate mr-2"></i>重新載入
                            </button>
                            <button @click="handleCompleteSession()" :disabled="!selectedSessionId || totalCount === 0 || verifiedCount < totalCount"
                                    class="px-4 py-2 text-sm bg-teal-500 text-white rounded-lg hover:bg-teal-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                                <i class="fa-solid fa-check mr-2"></i>完成盤點
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
