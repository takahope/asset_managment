<!--
  alpine_modals_batch.html — P4 批次操作:BatchActionButtons(底部固定列)+ BatchTransfer/Lending/Scrap modal
  逐行對應舊頁 6280-6353(按鈕列)/10235-10547(轉移)/10550-10763(出借)/10766-10906(報廢)。
-->
<script>
document.addEventListener('alpine:init', function () {
    var S = window.AppShared;

    /* ===== BatchActionButtons(舊頁 6280-6353) ===== */
    Alpine.data('batchActionButtons', function () {
        return {
            batchCount: 0,
            _timer: null,
            init: function () {
                var self = this;
                var update = function () {
                    if (typeof window.BatchList_getItems === 'function') self.batchCount = window.BatchList_getItems().length;
                };
                update();
                this._timer = setInterval(update, 500);
            },
            destroy: function () { if (this._timer) clearInterval(this._timer); },
            get visible() { return this.batchCount > 0; }
        };
    });

    /* 已選資產詳情(三個批次 modal 共用) */
    function selectedAssetsDetails(store) {
        return store.batchActionAssetIds.map(function (id) {
            return store.allAssets.find(function (a) { return a.assetId === id; });
        }).filter(Boolean);
    }

    /* ===== BatchTransferModal(舊頁 10235-10547) ===== */
    Alpine.data('batchTransferModal', function () {
        return {
            transferMode: 'normal', changeLocation: false, changeKeeper: false, changeUser: false,
            newLocation: '', newKeeperEmail: '', newUserEmail: '', custodianEmail: '', stationLocation: '',
            isSubmitting: false,
            get options() { return this.$store.app.transferOptions; },
            get selectedAssetIds() { return this.$store.app.batchActionAssetIds; },
            get selectedAssetsDetails() { return selectedAssetsDetails(this.$store.app); },
            get hasCustodians() { return !!(this.options && this.options.custodians && Object.keys(this.options.custodians).length > 0); },
            entries: function (obj) { return Object.entries(obj || {}); },
            aliasLabel: function (a) { return S.getAssetAliasLabel(a); },
            aliasDisplay: function (a) { return S.getAssetAliasDisplay(a); },
            handleSubmit: function () {
                var self = this;
                var store = this.$store.app;
                var options = this.options;
                var selectedAssetIds = this.selectedAssetIds;
                if (selectedAssetIds.length === 0) { alert('請先選取要轉移的資產'); return; }
                if (this.transferMode === 'normal') {
                    if (!this.changeLocation && !this.changeKeeper && !this.changeUser) { alert('請至少選擇一項變更（地點、保管人或使用人）'); return; }
                    if (this.changeLocation && !this.newLocation) { alert('請選擇新地點'); return; }
                    if (this.changeKeeper && !this.newKeeperEmail) { alert('請選擇新保管人'); return; }
                    if (this.changeUser && !this.newUserEmail) { alert('請選擇新使用人'); return; }
                } else if (this.transferMode === 'station') {
                    if (!this.custodianEmail) { alert('請選擇駐管！'); return; }
                    if (!this.stationLocation) { alert('請選擇駐站地點！'); return; }
                }
                // 代理轉移偵測(舊頁 10300-10341)
                var normalizedCurrentEmail = (window.currentUserEmail || '').toLowerCase().trim();
                var proxyTransfers = [];
                selectedAssetIds.forEach(function (assetId) {
                    var asset = store.allAssets.find(function (a) { return a.assetId === assetId; });
                    if (!asset) return;
                    var assetLeaderEmail = (asset.leaderEmail || '').toLowerCase().trim();
                    if (assetLeaderEmail !== normalizedCurrentEmail) {
                        proxyTransfers.push({ assetId: assetId, originalKeeperEmail: asset.leaderEmail, originalKeeperName: asset.leader });
                    }
                });
                var confirmMessage = '確定要批次轉移 ' + selectedAssetIds.length + ' 筆資產嗎？';
                if (proxyTransfers.length > 0) {
                    var proxyCount = proxyTransfers.length;
                    var ownCount = selectedAssetIds.length - proxyCount;
                    var proxyList = proxyTransfers.map(function (pt) { return '  - ' + pt.originalKeeperName + ' (' + pt.originalKeeperEmail + ')'; }).slice(0, 5).join('\n');
                    confirmMessage = '⚠️ 代理轉移確認\n\n您選取的資產中包含：\n  • 自己的資產：' + ownCount + ' 筆\n  • 同組成員的資產：' + proxyCount + ' 筆\n\n代理轉移的原保管人：\n' + proxyList + (proxyTransfers.length > 5 ? '\n  ... 等其他成員' : '') + '\n\n此操作將被記錄為「同組代理轉移」。\n\n是否確定繼續？';
                }
                if (!confirm(confirmMessage)) return;

                var processingIds = [].concat(selectedAssetIds);
                // 防重複送出:任一目標資產處理中則忽略本次點擊
                if (processingIds.some(function (id) { return store.isAssetProcessing(id); })) return;
                var submittedModalType = store.batchModalType; // 關閉前先捕捉,供成功後依類型清購物車
                store.toastProgress('正在提交 ' + processingIds.length + ' 筆資產的批次轉移申請...');
                store.addProcessingAssets(processingIds);
                store.handleCloseBatchModal();

                var formData = {
                    assetIds: selectedAssetIds,
                    newKeeperEmail: this.changeKeeper ? this.newKeeperEmail : null,
                    newLocation: this.changeLocation ? this.newLocation : null,
                    newUserName: null,
                    newUserEmail: this.changeUser ? this.newUserEmail : null,
                    isStationTransfer: this.transferMode === 'station',
                    isInfoTransfer: this.transferMode === 'info',
                    isIntakeTransfer: this.transferMode === 'intake',
                    proxyTransfers: proxyTransfers.length > 0 ? proxyTransfers : null
                };
                if (this.transferMode === 'station') {
                    formData.custodianEmail = this.custodianEmail;
                    formData.stationLocation = this.stationLocation;
                } else if (this.transferMode === 'info' && options.infoCustodian) {
                    formData.infoCustodianEmail = Object.keys(options.infoCustodian)[0];
                    formData.infoUserEmail = Object.keys(options.infoUser || {})[0];
                    formData.infoLocation = options.infoLocation;
                    formData.infoComputerLocation = options.infoComputerLocation;
                } else if (this.transferMode === 'intake' && options.intakeCustodian) {
                    formData.intakeCustodianEmail = Object.keys(options.intakeCustodian)[0];
                    formData.intakeLocation = options.intakeLocation;
                }
                google.script.run
                    .withSuccessHandler(function (message) {
                        store.removeProcessingAssets(processingIds);
                        
                        // 後端 catch 會以「申請失敗：」字串回傳(非拋出),須辨識為失敗
                        if (typeof message === 'string' && message.indexOf('申請失敗') === 0) {
                            store.toastOrAlert('❌ 提交批次轉移失敗：' + message, 'error');
                            alert(message);
                            return;
                        }
                        var requiresPrint = message.includes('請列印轉移申請單') || message.includes('需列印');
                        var waitReview = message.includes('需要審核') || message.includes('等待') || message.includes('任一方審核');
                        
                        store.toastOrAlert('✅ 批次轉移申請已提交！', 'success');
                        
                        store.showSuccessPrompt({
                            title: '批次轉移申請已提交',
                            message: message,
                            actionType: 'TRANSFER',
                            requiresPrint: requiresPrint,
                            waitReview: waitReview
                        });
                        // 清購物車(依提交前類型)並以權威資料對帳,修正純地點/部分成功等狀態落差
                        store.handleBatchActionSuccess(false, submittedModalType);
                    })
                    .withFailureHandler(function (error) {
                        store.removeProcessingAssets(processingIds);
                        store.toastOrAlert('❌ 提交批次轉移失敗: ' + error.message, 'error');
                        alert('錯誤：' + error.message);
                    })
                    .processBatchTransferApplication(formData);
            }
        };
    });

    /* ===== BatchLendingModal(舊頁 10550-10763) ===== */
    Alpine.data('batchLendingModal', function () {
        return {
            borrowerType: 'internal', borrowerName: '', lendingLocation: '', returnDate: '', reason: '', contactPhone: '', isSubmitting: false,
            get options() { return this.$store.app.lendingOptions; },
            get selectedAssetIds() { return this.$store.app.batchActionAssetIds; },
            get selectedAssetsDetails() { return selectedAssetsDetails(this.$store.app); },
            get isExternal() { return this.borrowerType === 'external'; },
            aliasLabel: function (a) { return S.getAssetAliasLabel(a); },
            aliasDisplay: function (a) { return S.getAssetAliasDisplay(a); },
            handleSubmit: function () {
                var self = this;
                var store = this.$store.app;
                var selectedAssetIds = this.selectedAssetIds;
                if (selectedAssetIds.length === 0) { alert('請先選取要出借的資產'); return; }
                var trimmedBorrowerName = this.borrowerName.trim();
                var trimmedLocation = this.lendingLocation.trim();
                var trimmedReason = this.reason.trim();
                var trimmedContactPhone = this.contactPhone.trim();
                if (!trimmedBorrowerName || !trimmedLocation || !this.returnDate) { alert('請填寫所有必填欄位（借用人、地點、歸還日期）'); return; }
                if (this.isExternal && (!trimmedReason || !trimmedContactPhone)) { alert('外部借用需填寫聯絡電話與出借事由'); return; }
                var confirmMessage = '確定要批次出借 ' + selectedAssetIds.length + ' 筆資產給 ' + this.borrowerName + ' 嗎？';
                if (!confirm(confirmMessage)) return;

                var processingIds = [].concat(selectedAssetIds);
                // 防重複送出:任一目標資產處理中則忽略本次點擊
                if (processingIds.some(function (id) { return store.isAssetProcessing(id); })) return;
                var submittedModalType = store.batchModalType; // 關閉前先捕捉,供成功後依類型清購物車
                store.toastProgress('正在提交 ' + processingIds.length + ' 筆資產的批次出借申請...');
                store.addProcessingAssets(processingIds);
                store.handleCloseBatchModal();

                var formData = {
                    assetIds: selectedAssetIds,
                    borrowerName: trimmedBorrowerName,
                    lendingLocation: trimmedLocation,
                    returnDate: this.returnDate,
                    reason: trimmedReason,
                    borrowerType: this.borrowerType,
                    contactPhone: trimmedContactPhone
                };
                google.script.run
                    .withSuccessHandler(function (message) {
                        store.removeProcessingAssets(processingIds);
                        
                        // 後端 catch 會以「申請出借失敗：」字串回傳(非拋出),須辨識為失敗
                        if (typeof message === 'string' && message.indexOf('申請出借失敗') === 0) {
                            store.toastOrAlert('❌ 提交批次出借失敗：' + message, 'error');
                            alert(message);
                            return;
                        }
                        // 出借一律提供列印外部出借申請單入口(後端成功訊息不含列印關鍵字)
                        var requiresPrint = true;
                        var waitReview = message.includes('需要審核') || message.includes('等待') || message.includes('任一方審核');
                        
                        store.toastOrAlert('✅ 批次出借申請已提交！', 'success');
                        
                        store.showSuccessPrompt({
                            title: '批次出借申請已提交',
                            message: message,
                            actionType: 'LEND',
                            requiresPrint: requiresPrint,
                            waitReview: waitReview
                        });
                        // 清購物車(依提交前類型)並以權威資料對帳,修正部分成功等狀態落差
                        store.handleBatchActionSuccess(false, submittedModalType);
                    })
                    .withFailureHandler(function (error) {
                        store.removeProcessingAssets(processingIds);
                        store.toastOrAlert('❌ 提交批次出借失敗: ' + error.message, 'error');
                        alert('錯誤：' + error.message);
                    })
                    .processBatchLending(formData);
            }
        };
    });

    /* ===== BatchScrapModal(舊頁 10766-10906) ===== */
    Alpine.data('batchScrapModal', function () {
        return {
            reason: '', remarks: '', isSubmitting: false,
            get selectedAssetIds() { return this.$store.app.batchActionAssetIds; },
            get selectedAssetsDetails() { return selectedAssetsDetails(this.$store.app); },
            aliasLabel: function (a) { return S.getAssetAliasLabel(a); },
            aliasDisplay: function (a) { return S.getAssetAliasDisplay(a); },
            handleSubmit: function () {
                var self = this;
                var store = this.$store.app;
                var selectedAssetIds = this.selectedAssetIds;
                var trimmedNotes = this.remarks.trim();
                if (selectedAssetIds.length === 0) { alert('請先選取要報廢的資產'); return; }
                if (!this.reason) { alert('請選擇報廢原因'); return; }
                if ((this.reason === 'C' || this.reason === '其他') && !trimmedNotes) { alert('選擇「其他」原因時，請務必填寫詳細說明'); return; }
                var confirmMessage = '確定要批次申請報廢 ' + selectedAssetIds.length + ' 筆資產嗎？\n報廢原因：' + (this.reason === 'A' ? 'A.維修不具效益，且逾使用年限' : this.reason === 'B' ? 'B.損壞無法修復，且逾使用年限' : 'C.其他');
                if (!confirm(confirmMessage)) return;

                var processingIds = [].concat(selectedAssetIds);
                // 防重複送出:任一目標資產處理中則忽略本次點擊
                if (processingIds.some(function (id) { return store.isAssetProcessing(id); })) return;
                var submittedModalType = store.batchModalType; // 關閉前先捕捉,供成功後依類型清購物車
                store.toastProgress('正在提交 ' + processingIds.length + ' 筆資產的批次報廢申請...');
                store.addProcessingAssets(processingIds);
                store.handleCloseBatchModal();

                var formData = {
                    assetIds: selectedAssetIds,
                    reason: this.reason,
                    remarks: trimmedNotes
                };
                google.script.run
                    .withSuccessHandler(function (message) {
                        store.removeProcessingAssets(processingIds);
                        
                        // 後端 catch 會以「申請報廢失敗：」字串回傳(非拋出),須辨識為失敗
                        if (typeof message === 'string' && message.indexOf('申請報廢失敗') === 0) {
                            store.toastOrAlert('❌ 提交批次報廢失敗：' + message, 'error');
                            alert(message);
                            return;
                        }
                        var requiresPrint = message.includes('請列印報廢申請單') || message.includes('需列印');
                        var waitReview = message.includes('需要審核') || message.includes('等待');
                        
                        store.toastOrAlert('✅ 批次報廢申請已提交！', 'success');
                        
                        store.showSuccessPrompt({
                            title: '批次報廢申請已提交',
                            message: message,
                            actionType: 'SCRAP',
                            requiresPrint: true,
                            waitReview: false
                        });
                        // 清購物車(依提交前類型)並以權威資料對帳,修正部分成功等狀態落差
                        store.handleBatchActionSuccess(false, submittedModalType);
                    })
                    .withFailureHandler(function (error) {
                        store.removeProcessingAssets(processingIds);
                        store.toastOrAlert('❌ 提交失敗：' + error.message, 'error');
                        alert('錯誤：' + error.message);
                    })
                    .processBatchScrapping(formData);
            }
        };
    });
});
</script>

<!-- ===== BatchActionButtons(底部固定列;非進階模式才顯示) ===== -->
<template x-if="!$store.app.isAdvancedMode">
    <div x-data="batchActionButtons"
         class="fixed bottom-0 left-0 right-0 z-40 px-4 py-3 bg-white/95 backdrop-blur border-t border-slate-200 shadow-[0_-6px_24px_rgba(15,23,42,0.08)] transition-transform duration-300 ease-out"
         :class="visible ? 'translate-y-0' : 'translate-y-full'" :aria-hidden="!visible">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="text-sm text-slate-700">
                    <i class="fa-solid fa-cart-shopping text-blue-500 mr-2"></i>
                    已選取 <span class="font-bold text-blue-600 text-base" x-text="batchCount"></span> 項資產
                </div>
                <button x-show="batchCount > 0" @click="window.BatchList_toggleSidebar && window.BatchList_toggleSidebar()" class="text-xs text-blue-500 hover:text-blue-700 underline">查看清單</button>
            </div>
            <div class="flex gap-2 flex-wrap">
                <button @click="$store.app.handleBatchTransfer()" :disabled="batchCount === 0" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2 text-sm"><i class="fa-solid fa-right-left"></i> 批次轉移</button>
                <button @click="$store.app.handleBatchLending()" :disabled="batchCount === 0" class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2 text-sm"><i class="fa-solid fa-hand-holding-hand"></i> 批次出借</button>
                <button @click="$store.app.handleBatchScrap()" :disabled="batchCount === 0" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2 text-sm"><i class="fa-regular fa-trash-can"></i> 批次報廢</button>
                <template x-if="$store.app.hasActiveInventory">
                    <button @click="$store.app.handleBatchInventory()" :disabled="batchCount === 0" class="px-4 py-2 bg-teal-500 text-white rounded-lg hover:bg-teal-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2 text-sm"><i class="fa-solid fa-clipboard-check"></i> 批次盤點</button>
                </template>
            </div>
        </div>
    </div>
</template>

<!-- ===== 已選資產清單片段(三 modal 共用樣板) ===== -->
<!-- ===== BatchTransferModal ===== -->
<template x-if="$store.app.batchModalType === 'transfer' && $store.app.transferOptions">
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" x-data="batchTransferModal">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden">
            <div class="px-6 py-4 border-b bg-blue-50 flex justify-between items-center">
                <h3 class="text-lg font-bold text-blue-800"><i class="fa-solid fa-right-left mr-2"></i>批次轉移財產 (<span x-text="selectedAssetIds.length"></span> 筆)</h3>
                <button @click="$store.app.handleCloseBatchModal()" class="text-blue-600 hover:text-blue-800 transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="px-6 py-4 overflow-y-auto max-h-[calc(90vh-140px)]">
                <div class="mb-4">
                    <div class="text-sm font-medium text-slate-700 mb-2">已選擇的資產：</div>
                    <div class="max-h-32 overflow-y-auto bg-slate-50 rounded-lg p-3 border border-slate-200">
                        <template x-if="selectedAssetsDetails.length === 0"><div class="text-slate-400 text-sm">沒有選取的資產</div></template>
                        <template x-if="selectedAssetsDetails.length > 0">
                            <div class="space-y-1">
                                <template x-for="asset in selectedAssetsDetails" :key="asset.assetId">
                                    <div class="text-sm flex justify-between">
                                        <span class="font-mono text-slate-600" x-text="asset.assetId"></span>
                                        <div class="text-right ml-2 min-w-0">
                                            <div class="text-slate-500 truncate" x-text="asset.assetName"></div>
                                            <div class="text-xs text-slate-400 truncate" x-text="aliasLabel(asset) + '：' + aliasDisplay(asset)"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-2">轉移模式</label>
                    <div class="space-y-2">
                        <label class="flex items-center"><input type="radio" name="batchTransferMode" value="normal" x-model="transferMode" class="mr-2"><span>一般轉移</span></label>
                        <template x-if="hasCustodians"><label class="flex items-center"><input type="radio" name="batchTransferMode" value="station" x-model="transferMode" class="mr-2"><span>中心轉給駐站</span></label></template>
                        <template x-if="options.infoCustodian">
                            <div class="space-y-2">
                                <label class="flex items-center"><input type="radio" name="batchTransferMode" value="info" x-model="transferMode" class="mr-2"><span>駐站回送中心資訊組</span></label>
                                <label class="flex items-center"><input type="radio" name="batchTransferMode" value="intake" x-model="transferMode" class="mr-2"><span>駐站回送中心收案組</span></label>
                            </div>
                        </template>
                    </div>
                </div>
                <template x-if="transferMode === 'normal'">
                    <div class="space-y-4">
                        <div>
                            <label class="flex items-center mb-2"><input type="checkbox" x-model="changeLocation" class="mr-2"><span class="font-medium text-slate-700">變更地點</span></label>
                            <template x-if="changeLocation">
                                <select x-model="newLocation" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                    <option value="">請選擇新地點...</option>
                                    <template x-for="loc in (options.locations || [])" :key="loc"><option :value="loc" x-text="loc"></option></template>
                                </select>
                            </template>
                        </div>
                        <div>
                            <label class="flex items-center mb-2"><input type="checkbox" x-model="changeKeeper" class="mr-2"><span class="font-medium text-slate-700">變更保管人</span></label>
                            <template x-if="changeKeeper">
                                <select x-model="newKeeperEmail" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                    <option value="">請選擇新保管人...</option>
                                    <template x-for="entry in entries(options.keepers)" :key="entry[0]"><option :value="entry[0]" x-text="entry[1]"></option></template>
                                </select>
                            </template>
                        </div>
                        <div>
                            <label class="flex items-center mb-2"><input type="checkbox" x-model="changeUser" class="mr-2"><span class="font-medium text-slate-700">變更使用人</span></label>
                            <template x-if="changeUser">
                                <select x-model="newUserEmail" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                    <option value="">請選擇新使用人...</option>
                                    <template x-for="entry in entries(options.users)" :key="entry[0]"><option :value="entry[0]" x-text="entry[1]"></option></template>
                                </select>
                            </template>
                        </div>
                    </div>
                </template>
                <template x-if="transferMode === 'station'">
                    <div class="p-4 bg-blue-50 rounded-lg space-y-4">
                        <div class="flex items-center gap-2 text-sm text-blue-800 mb-3"><i class="fas fa-info-circle"></i><strong>駐站模式說明：</strong>保管人和使用人將同時設為此駐管。</div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">轉移給駐管：<span class="text-red-600">*</span></label>
                                <select x-model="custodianEmail" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
