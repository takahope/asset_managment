<!--
  alpine_store.html — Alpine 全域狀態(Store)+ 資料層核心
  逐行對應舊頁 userstate.html 的 App() 狀態與 handler(行號註記為舊頁位置)。
  狀態/函式名稱一律沿用 React 版,方便對照表核對(example/alpine_migration_checklist.md)。
  日常修改本檔零編譯,直接 clasp push。
-->
<script>
(function () {
    'use strict';

    /* ============ A. 常數(舊頁 2152-2192, 3144-3390) ============ */
    var ACTION_LABELS = {
        TRANSFER: '轉移',
        LEND: '出借',
        SCRAP: '報廢',
        INVENTORY: '盤點',
        INVENTORY_RESET: '取消確認',
        NONE: '未指定'
    };
    var INVENTORY_STATUS_LABELS = {
        NORMAL: '正常',
        LOST: '遺失',
        DAMAGED: '損壞',
        OLD: '過舊'
    };
    var INVENTORY_RESULT_OPTIONS = [
        { label: INVENTORY_STATUS_LABELS.NORMAL, color: 'green', icon: 'fa-solid fa-circle-check' },
        { label: INVENTORY_STATUS_LABELS.LOST, color: 'red', icon: 'fa-solid fa-magnifying-glass' },
        { label: INVENTORY_STATUS_LABELS.DAMAGED, color: 'orange', icon: 'fa-solid fa-triangle-exclamation' },
        { label: INVENTORY_STATUS_LABELS.OLD, color: 'amber', icon: 'fa-solid fa-clock-rotate-left' }
    ];
    var ACTION_TYPE_BY_MODAL = { transfer: 'TRANSFER', lending: 'LEND', scrap: 'SCRAP' };
    var ACTION_MODAL_BY_TYPE = { TRANSFER: 'transfer', LEND: 'lending', SCRAP: 'scrap' };
    var STATUS_COLORS = {
        '在庫': 'bg-green-50 text-green-700 border-green-200',
        '出借中': 'bg-yellow-50 text-yellow-700 border-yellow-200',
        '借出中': 'bg-yellow-50 text-yellow-700 border-yellow-200',
        '報廢中': 'bg-red-50 text-red-700 border-red-200',
        '已報廢': 'bg-gray-50 text-gray-700 border-gray-200',
        '轉移中': 'bg-blue-50 text-blue-700 border-blue-200',
        '待接收': 'bg-purple-50 text-purple-700 border-purple-200'
    };
    var STATUS_DETAIL_TYPES = {
        '轉移中': 'transfer',
        '出借中': 'lending',
        '借出中': 'lending',
        '報廢中': 'scrap'
    };
    var STATUS_DETAIL_THEMES = {
        transfer: { title: '轉移中資訊', icon: 'fa-right-left', headerClass: 'bg-cyan-50', textClass: 'text-cyan-800' },
        lending: { title: '出借中資訊', icon: 'fa-hand-holding-hand', headerClass: 'bg-amber-50', textClass: 'text-amber-800' },
        scrap: { title: '報廢中資訊', icon: 'fa-trash-can', headerClass: 'bg-red-50', textClass: 'text-red-700' }
    };
    var ITEM_MASTER_SOURCE_SHEET = '物品總表';
    var PENDING_INVENTORY_CACHE_TTL = 10000;
    var INITIAL_FILTERS = function () {
        return {
            status: [],
            category: '',
            systemCategory: '',
            leader: [],
            user: [],
            group: [],
            location: [],
            search: '',
            inventoryTaskOnly: false
        };
    };

    /* ============ B. 純函式(舊頁 2175-2192, 3156-3173, 3373-3391) ============ */
    var escapeHtml = function (value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    };
    var stableStringify = function (value) {
        if (value === null || value === undefined) return 'null';
        if (typeof value !== 'object') return JSON.stringify(value);
        if (Array.isArray(value)) {
            return '[' + value.map(stableStringify).join(',') + ']';
        }
        var keys = Object.keys(value).sort();
        return '{' + keys.map(function (key) { return JSON.stringify(key) + ':' + stableStringify(value[key]); }).join(',') + '}';
    };
    var normalizeEmail = function (value) { return String(value || '').trim().toLowerCase(); };
    var normalizeInventoryInitialResult = function (value) {
        var normalized = String(value || '').trim();
        var allowed = Object.keys(INVENTORY_STATUS_LABELS).map(function (k) { return INVENTORY_STATUS_LABELS[k]; });
        return allowed.indexOf(normalized) !== -1 ? normalized : '';
    };
    var createInventoryFormDefaults = function (opts) {
        var asset = opts.asset;
        var isBatch = opts.isBatch || false;
        var initialResult = opts.initialResult || '';
        var isItAsset = !isBatch && !!asset && String(asset.isItAsset || '').trim() === '是';
        return {
            result: normalizeInventoryInitialResult(initialResult),
            remarks: '',
            ismsExpanded: true,
            isItAsset: isItAsset,
            isIsoScope: !isBatch && !!asset && String(asset.isIsoScope || '').trim() === '是',
            selectedIsmsAssetId: !isBatch && asset ? String(asset.ismsAssetId || '').trim() : '',
            ismsSearchKeyword: ''
        };
    };
    var getAssetAliasLabel = function (asset) {
        return String((asset && asset.sourceSheet) || '').trim() === ITEM_MASTER_SOURCE_SHEET ? '產品序號' : '財產別名';
    };
    var getAssetAliasValue = function (asset) {
        if (!asset) return '';
        var sourceSheet = String(asset.sourceSheet || '').trim();
        var rawValue = sourceSheet === ITEM_MASTER_SOURCE_SHEET ? asset.productSerial : asset.assetAlias;
        return String(rawValue || '').trim();
    };
    var getAssetAliasDisplay = function (asset, empty) {
        var value = getAssetAliasValue(asset);
        return value || (empty === undefined ? '-' : empty);
    };
    var ensureArray = function (value) {
        if (Array.isArray(value)) return value;
        return value ? [value] : [];
    };

    /* ============ C. requestIdleCallback polyfill(對應舊頁 App 內的 polyfill) ============ */
    if (typeof window.requestIdleCallback !== 'function') {
        window.requestIdleCallback = function (cb, options) {
            var timeout = options && options.timeout ? Math.min(options.timeout, 500) : 200;
            return setTimeout(function () {
                cb({ didTimeout: true, timeRemaining: function () { return 0; } });
            }, timeout);
        };
        window.cancelIdleCallback = function (id) { clearTimeout(id); };
    }

    /* ============ D. 頁面網址快取(舊頁 2121-2150 逐字對應) ============ */
    var USERSTATE_PAGE_URLS_EVENT = 'userstate:page-urls-ready';
    var __USERSTATE_PAGE_URLS = {
        webAppUrl: '',
        operationManualUrl: '',
        operationManualPdfDownloadUrl: ''
    };
    window.__WEB_APP_URL = window.__WEB_APP_URL || '';
    var operationManualSrcDocTemplate = document.getElementById('operationManualSrcDocTemplate');
    var __OPERATION_MANUAL_SRCDOC = operationManualSrcDocTemplate
        ? operationManualSrcDocTemplate.innerHTML.trim()
        : '';
    try {
        google.script.run
            .withSuccessHandler(function (urls) {
                var nextUrls = {
                    webAppUrl: (urls && urls.webAppUrl) || '',
                    operationManualUrl: (urls && urls.operationManualUrl) || '',
                    operationManualPdfDownloadUrl: (urls && urls.operationManualPdfDownloadUrl) || ''
                };
                window.__WEB_APP_URL = nextUrls.webAppUrl || '';
                Object.assign(__USERSTATE_PAGE_URLS, nextUrls);
                window.dispatchEvent(new CustomEvent(USERSTATE_PAGE_URLS_EVENT, { detail: Object.assign({}, nextUrls) }));
            })
            .withFailureHandler(function () {})
            .getUserStatePageUrls();
    } catch (e) { /* ignore */ }

    /* ============ E. 共用命名空間(供 alpine_views 等 partial 取用) ============ */
    window.AppShared = {
        ACTION_LABELS: ACTION_LABELS,
        INVENTORY_STATUS_LABELS: INVENTORY_STATUS_LABELS,
        INVENTORY_RESULT_OPTIONS: INVENTORY_RESULT_OPTIONS,
        ACTION_TYPE_BY_MODAL: ACTION_TYPE_BY_MODAL,
        ACTION_MODAL_BY_TYPE: ACTION_MODAL_BY_TYPE,
        STATUS_COLORS: STATUS_COLORS,
        STATUS_DETAIL_TYPES: STATUS_DETAIL_TYPES,
        STATUS_DETAIL_THEMES: STATUS_DETAIL_THEMES,
        ITEM_MASTER_SOURCE_SHEET: ITEM_MASTER_SOURCE_SHEET,
        USERSTATE_PAGE_URLS_EVENT: USERSTATE_PAGE_URLS_EVENT,
        getPageUrls: function () { return Object.assign({}, __USERSTATE_PAGE_URLS); },
        getOperationManualSrcDoc: function () { return __OPERATION_MANUAL_SRCDOC; },
        escapeHtml: escapeHtml,
        stableStringify: stableStringify,
        normalizeEmail: normalizeEmail,
        normalizeInventoryInitialResult: normalizeInventoryInitialResult,
        createInventoryFormDefaults: createInventoryFormDefaults,
        getAssetAliasLabel: getAssetAliasLabel,
        getAssetAliasValue: getAssetAliasValue,
        getAssetAliasDisplay: getAssetAliasDisplay,
        ensureArray: ensureArray
    };

    /* ============ F. 非反應式 refs(對應舊頁 useRef,不驅動 UI) ============ */
    var refs = {
        viewModeInitialized: false,          // viewModeInitializedRef
        statusDetailRequest: 0,              // statusDetailRequestRef
        transferOverviewRequest: 0,          // transferOverviewRequestRef
        pendingApprovalAutoOpen: false,      // pendingApprovalAutoOpenRef
        transferStatusDetailLoad: null,      // transferStatusDetailLoadRef
        pendingInventoryLoad: null,          // pendingInventoryLoadRef
        pendingInventoryCache: new Map(),    // pendingInventoryCacheRef
        pendingInventoryRequestMap: new Map(),
        pendingInventoryInFlight: new Map(),
        scrapPendingLoad: null,
        scrapPendingRequest: 0,
        transferPendingLoad: null,
        transferPendingRequest: 0,
        addAssetDropdownLoad: null,
        addAssetDropdownRequest: 0,
        inventoryToastTimer: null,
        advancedSubmit: false,
        closeActionPanelFn: null,            // closeActionPanelRef
        queueReturnContext: { assetId: '', shouldRestoreActionPanel: false },
        ismsCreatedCallback: null            // 共用 CreateIsms modal 的建立回呼
    };
    var cancelScheduled = function (slot) {
        if (!refs[slot]) return;
        var entry = refs[slot];
        if (entry.type === 'idle' && typeof window.cancelIdleCallback === 'function') {
            window.cancelIdleCallback(entry.id);
        } else if (entry.type === 'timeout') {
            clearTimeout(entry.id);
        }
        refs[slot] = null;
    };
    var scheduleIdle = function (slot, runLoad, idleTimeout, fallbackDelay) {
        cancelScheduled(slot);
        var wrapped = function () {
            refs[slot] = null;
            runLoad();
        };
        if (typeof window.requestIdleCallback === 'function') {
            refs[slot] = { type: 'idle', id: window.requestIdleCallback(wrapped, { timeout: idleTimeout }) };
        } else {
            refs[slot] = { type: 'timeout', id: setTimeout(wrapped, fallbackDelay) };
        }
    };

    /* ============ G. Alpine Store:App 狀態核心 ============ */
    document.addEventListener('alpine:init', function () {
        Alpine.store('app', {
            /* ── 狀態(對應舊頁 12807-12931 useState;名稱一致) ── */
            isReady: false,
            allAssets: [],
            isAdmin: false,
            viewMode: 'user',
            currentUserEmail: '',
            currentUserName: '',
            webAppUrl: '',
            showOperationManualModal: false,
            userStatePageUrls: Object.assign({}, __USERSTATE_PAGE_URLS),
            pendingApprovalsData: [],
            inventorySessions: null,
            filters: INITIAL_FILTERS(),
            activeModal: null,
            isLoadingCards: false,
            isExporting: false,
            lentAssetsDetails: null,
            isLoadingLentDetails: false,
            scrapPendingDetails: null,
            transferPendingDetails: null,
            transferPendingCount: 0,
            isLoadingScrapDetails: false,
            isLoadingTransferDetails: false,
            statusDetailState: null,
            transferStatusDetailMap: {},
            isLoadingTransferOverview: false,
            transferOverviewLoaded: false,
            transferringCount: 0,
            transferringAssets: null,
            isLoadingTransferring: false,
            quickActionModalType: null,
            selectedAsset: null,
            quickActionMode: 'submit',
            transferOptions: null,
            lendingOptions: null,
            batchModalType: null,
            batchActionAssetIds: [],
            showAddAssetModal: false,
            addAssetDropdownData: null,
            showEditAssetModal: false,
            editingAsset: null,
            selectedAssetIds: [],
            showInventoryMgmtModal: false,
            inventoryFeatureEnabled: true,
            inventoryFeatureToggling: false,
            inventoryPendingByAsset: {},
            pendingInventoryItems: [],
            isLoadingPendingInventory: false,
            pendingInventoryError: '',
            currentInventorySessionId: null,
            showInventoryModal: false,
            inventoryModalAsset: null,
            inventoryModalInitialResult: '',
            inventoryModalSessionCount: 0,
            showBatchInventoryModal: false,
            selectedInventoryAssetIds: [],
            currentUserGroup: '',
            inventoryStatusByAsset: {},
            ismsAssets: [],
            ismsEnabled: false,
            createIsmsOpen: false,      // 共用「新增資訊資產」modal(EditAsset/盤點表單開啟)
            cartSnapshot: { mode: 'ADVANCED', items: [], pendingAssetId: null },
            isScannerOpen: false,
            actionPanelState: { isOpen: false, assetId: '', asset: null, displayMode: 'modal' },
            assetsVersion: 0, // 資產/盤點資料變更訊號(供 assetTable 重設頁碼;非舊頁狀態,等價 React 的 props 識別變更)

            /* ── 衍生狀態(getter;對應舊頁 useMemo) ── */
            get isAdminView() {
                return this.isAdmin && this.viewMode === 'admin';
            },
            get isAdvancedMode() {
                return this.cartSnapshot.mode === 'ADVANCED';
            },
            // 舊頁 14547-14572
            get filteredAssets() {
                var filters = this.filters;
                var self = this;
                var searchLower = filters.search ? filters.search.toLowerCase() : '';
                return this.allAssets.filter(function (asset) {
                    var statusValues = ensureArray(filters.status);
                    var leaderValues = ensureArray(filters.leader);
                    var userValues = ensureArray(filters.user);
                    var groupValues = ensureArray(filters.group);
                    var locationValues = ensureArray(filters.location);
                    var statusMatch = statusValues.length === 0 || statusValues.indexOf(asset.status) !== -1;
                    var categoryMatch = !filters.category || asset.category === filters.category;
                    var systemCategoryMatch = !filters.systemCategory || asset.systemCategory === filters.systemCategory;
                    var leaderMatch = leaderValues.length === 0 || leaderValues.indexOf(asset.leader) !== -1;
                    var userName = String(asset.userName || '').trim() || '無';
                    var groupName = String(asset.group || '').trim() || '未分組';
                    var userMatch = userValues.length === 0 || userValues.indexOf(userName) !== -1;
                    var groupMatch = groupValues.length === 0 || groupValues.indexOf(groupName) !== -1;
                    var locationMatch = locationValues.length === 0 || locationValues.indexOf(asset.location) !== -1;
                    var inventoryTaskMatch = !filters.inventoryTaskOnly || self.hasActiveInventoryForAsset(asset.assetId);
                    var searchMatch = !searchLower || (asset.searchText && asset.searchText.indexOf(searchLower) !== -1);
                    return statusMatch && categoryMatch && systemCategoryMatch && leaderMatch && userMatch && groupMatch && locationMatch && inventoryTaskMatch && searchMatch;
                });
            },
            // 舊頁 14878-14914
            get cardCounts() {
                var inventoryCount = this.isAdminView
                    ? ((this.inventorySessions && (this.inventorySessions.totalPendingInventoryCount || this.inventorySessions.myPendingInventoryCount)) || 0)
                    : ((this.inventorySessions && this.inventorySessions.myPendingInventoryCount) || 0);
                var scrapPendingCount;
                var scrappingAssets = this.allAssets.filter(function (a) { return a.status === '報廢中'; });
                if (this.isAdminView) {
                    scrapPendingCount = scrappingAssets.length;
                } else {
                    var groupProxyEnabled = (this.transferOptions && this.transferOptions.groupProxyEnabled) || false;
                    var groupMemberEmailsLower = (this.transferOptions && this.transferOptions.groupMemberEmailsLower) || [];
                    var groupEmailSet = {};
                    groupMemberEmailsLower.forEach(function (e) { groupEmailSet[e] = true; });
                    var currentEmailLower = this.currentUserEmail.toLowerCase();
                    scrapPendingCount = scrappingAssets.filter(function (a) {
                        var leaderEmail = (a.leaderEmail || '').toLowerCase();
                        var userEmail = (a.userEmail || '').toLowerCase();
                        var isOwner = leaderEmail === currentEmailLower || userEmail === currentEmailLower;
                        var isGroupMember = groupProxyEnabled && (groupEmailSet[leaderEmail] || groupEmailSet[userEmail]);
                        return isOwner || isGroupMember;
                    }).length;
                }
                return {
                    transferring: this.transferringCount,
                    pending: this.pendingApprovalsData.length,
                    lent: this.allAssets.filter(function (a) { return a.status === '出借中'; }).length,
                    scrapPending: scrapPendingCount,
                    transferPending: this.transferPendingCount,
                    inventory: inventoryCount
                };
            },
            get hasActiveInventory() {
                return Object.keys(this.inventoryStatusByAsset || {}).length > 0;
            },
            get inventoryTaskCount() {
                return Object.keys(this.inventoryStatusByAsset || {}).length;
            },
            // 舊頁 14801-14826(以 filteredAssets 計算重複產編)
            get duplicateInfo() {
                var map = new Map();
                var duplicates = new Map();
                var duplicateCount = 0;
                this.filteredAssets.forEach(function (asset) {
                    var key = String(asset.assetId || '').trim();
                    if (map.has(key)) {
                        duplicateCount += 1;
                        var existing = map.get(key);
                        if (!duplicates.has(key)) duplicates.set(key, [existing]);
                        duplicates.get(key).push(asset);
                    } else {
                        map.set(key, asset);
                    }
                });
                var groups = Array.from(duplicates.entries()).map(function (entry) {
                    return { assetId: entry[0], items: entry[1] };
                });
                return { duplicateCount: duplicateCount, groups: groups };
            },

            /* ── 資產裝飾(舊頁 12941-12963) ── */
            decorateAssetForUserState: function (asset) {
                var sourceSheet = String((asset && asset.sourceSheet) || '').trim();
                var systemCategory = sourceSheet === '物品總表' ? '舊系統' : '新系統';
                var groupName = String((asset && asset.group) || '').trim() || '未分組';
                return Object.assign({}, asset, {
                    group: groupName,
                    systemCategory: systemCategory,
                    searchText: [
                        asset && asset.assetId,
                        asset && asset.assetName,
                        getAssetAliasValue(asset),
                        asset && asset.leader,
                        asset && asset.userName,
                        groupName,
                        asset && asset.location,
                        systemCategory
                    ].filter(Boolean).join(' ').toLowerCase()
                });
            },
            decorateAssetListForUserState: function (assets) {
                var self = this;
                return Array.isArray(assets) ? assets.map(function (a) { return self.decorateAssetForUserState(a); }) : [];
            },

            /* ── 盤點輔助(舊頁 12964-12992, 13219-13221, 13480-13534, 14058-14079) ── */
            isInventoryTaskOnly: function (asset) {
                if (!asset) return false;
                if (this.isAdminView) return false;
                var currentEmail = normalizeEmail(this.currentUserEmail);
                if (!currentEmail) return false;
                var leaderEmail = normalizeEmail(asset.leaderEmail);
                var userEmail = normalizeEmail(asset.userEmail);
                var isOwner = leaderEmail === currentEmail || userEmail === currentEmail;
                if (isOwner) return false;
                return !!this.inventoryStatusByAsset[asset.assetId];
            },
            hasActiveInventoryForAsset: function (assetId) {
                return !!this.inventoryStatusByAsset[assetId];
            },
            hasInventoryTaskForActionPanel: function (assetId) {
                if (!assetId) return false;
                return this.hasActiveInventoryForAsset(assetId);
            },
            getAssetPendingSessions: function (assetId) {
                var entry = this.inventoryPendingByAsset[assetId];
                return entry ? entry.sessions || [] : [];
            },
            getAssetInventorySessionCount: function (assetId) {
                var entry = this.inventoryStatusByAsset[assetId];
                if (!entry) return 0;
                return typeof entry.sessionCount === 'number' ? entry.sessionCount : 0;
            },
            resolveInventoryStatusLabel: function (assetId) {
                if (!assetId) return '無盤點任務';
                var entry = this.inventoryStatusByAsset[assetId];
                if (!entry) return '無盤點任務';
                return entry.status || '未盤點';
            },
            resolveAssetIsTask: function (assetId) {
                var checkbox = document.querySelector('.asset-checkbox[value="' + assetId + '"]');
                if (checkbox && checkbox.dataset && checkbox.dataset.isTask) {
                    return checkbox.dataset.isTask === 'true';
                }
                var self = this;
                var asset = this.allAssets.find(function (a) { return a.assetId === assetId; });
                return asset ? self.isInventoryTaskOnly(asset) : false;
            },
            buildInventoryPendingByAsset: function (pendingItems) {
                var map = {};
                (pendingItems || []).forEach(function (item) {
                    var assetId = String(item.assetId || '').trim();
                    if (!assetId) return;
                    if (!map[assetId]) {
                        map[assetId] = {
                            assetId: assetId,
                            assetName: item.assetName || '',
                            keeperName: item.keeperName || '',
                            userName: item.userName || '',
                            location: item.location || '',
                            sessions: []
                        };
                    }
                    var sessions = map[assetId].sessions;
                    var exists = sessions.some(function (s) { return s.inventoryId === item.inventoryId; });
                    if (!exists) {
                        sessions.push({
                            inventoryId: item.inventoryId,
                            inventoryDate: item.inventoryDate || '',
                            inventoryPerson: item.inventoryPerson || '',
                            inventoryEmail: item.inventoryEmail || ''
                        });
                    }
                });
                return map;
            },
            getPendingInventoryCacheKey: function (forceUserScope, options) {
                options = options || {};
                var scopeKey = forceUserScope ? 'user' : 'admin';
                var sessionKey = options.sessionId
                    ? String(options.sessionId)
                    : (this.currentInventorySessionId ? String(this.currentInventorySessionId) : 'all');
                return scopeKey + ':' + sessionKey;
            },
            applyPendingInventorySuccess: function (response) {
                var pendingItems = (response && response.pendingItems) || [];
                this.inventoryPendingByAsset = this.buildInventoryPendingByAsset(pendingItems);
                this.pendingInventoryItems = pendingItems;
                this.inventoryStatusByAsset = (response && response.inventoryStatusByAsset) || {};
                this.isLoadingPendingInventory = false;
                this.pendingInventoryError = '';
                this.afterInventoryStatusChanged();
            },
            applyPendingInventoryFailure: function (message) {
                this.inventoryPendingByAsset = {};
                this.pendingInventoryItems = [];
                this.inventoryStatusByAsset = {};
                this.isLoadingPendingInventory = false;
                this.pendingInventoryError = message || '載入失敗';
                this.afterInventoryStatusChanged();
            },
            // 舊頁 14436-14444 useEffect:盤點任務清空時關閉 inventoryTaskOnly 篩選
            afterInventoryStatusChanged: function () {
                this.assetsVersion += 1;
                if (!this.hasActiveInventory && this.filters.inventoryTaskOnly) {
                    this.filters.inventoryTaskOnly = false;
                }
            },
            updateCurrentInventorySessionId: function (nextSessionId) {
                if (this.currentInventorySessionId !== nextSessionId) {
                    refs.pendingInventoryCache.clear();
                    refs.pendingInventoryRequestMap.clear();
                    refs.pendingInventoryInFlight.clear();
                }
                this.currentInventorySessionId = nextSessionId;
            },
            clearInventoryState: function () {
                this.inventorySessions = null;
                this.inventoryPendingByAsset = {};
                this.pendingInventoryItems = [];
                this.inventoryStatusByAsset = {};
                this.isLoadingPendingInventory = false;
                this.pendingInventoryError = '';
                this.ismsAssets = [];
                this.ismsEnabled = false;
                this.updateCurrentInventorySessionId(null);
                this.afterInventoryStatusChanged();
            },
            handleIsmsAssetCreated: function (newAsset) {
                if (!newAsset || !newAsset.ismsAssetId) return;
                var exists = this.ismsAssets.some(function (a) { return a.ismsAssetId === newAsset.ismsAssetId; });
                if (!exists) this.ismsAssets = this.ismsAssets.concat([newAsset]);
            },
            // 共用「新增資訊資產」modal:開啟時登記回呼(建立成功後由開啟者接手選取)
            openCreateIsms: function (onCreated) {
                refs.ismsCreatedCallback = typeof onCreated === 'function' ? onCreated : null;
                this.createIsmsOpen = true;
            },
            closeCreateIsms: function () {
                this.createIsmsOpen = false;
                refs.ismsCreatedCallback = null;
            },
            onIsmsAssetCreated: function (newAsset) {
                this.handleIsmsAssetCreated(newAsset);
                if (refs.ismsCreatedCallback) refs.ismsCreatedCallback(newAsset);
            },

            refreshCardData: function () {
                var self = this;
                var MIN_LOADING_DURATION = 500;
                this.isLoadingCards = true;
                this.isLoadingPendingInventory = true;
                this.pendingInventoryError = '';
                var startTime = Date.now();

                this.scheduleTransferPendingPreload(forceUserScope);
                if (this.isAdmin && !forceUserScope) {
                    this.scheduleAddAssetDropdownPreload();
                }
                var run = function (fnName, arg) {
                    return new Promise(function (resolve, reject) {
                        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName](arg);
                    });
                };
                Promise.allSettled([
                    run('getTransferOverviewForUserState', forceUserScope),
                    self.inventoryFeatureEnabled ? run('getInventoryData', forceUserScope) : Promise.resolve(null),
                    run('getUserStateData', forceUserScope),
                    run('getTransferableItemsCount', forceUserScope),
                    self.inventoryFeatureEnabled

                ]).then(function (results) {

                    var inventoryResponse = results[1];
                    var assetsResponse = results[2];
                    var transferCountResponse = results[3];
                    var pendingInventoryResponse = results[4];
                    var lentResponse = results[5];

                    if (transferOverviewResponse.status === 'fulfilled') {
                        var response = transferOverviewResponse.value;
                        if (response && !response.error) {
                            var transferring = response.transferring || {};
                            var pending = response.pending || {};
                            self.transferringAssets = Array.isArray(transferring.assets) ? transferring.assets : [];
                            self.transferringCount = typeof transferring.count === 'number'
                                ? transferring.count
                                : (Array.isArray(transferring.assets) ? transferring.assets.length : 0);
                            self.pendingApprovalsData = Array.isArray(pending.approvals) ? pending.approvals : [];
                            self.transferStatusDetailMap = response.transferDetailMap || {};
                            self.transferOverviewLoaded = true;
                        } else {
                            self.transferringAssets = [];
                            self.transferringCount = 0;
                            self.pendingApprovalsData = [];
                            self.transferStatusDetailMap = {};
                            self.transferOverviewLoaded = true;
                        }
                        self.syncPendingApprovalsGlobal();
                    }
                    if (!self.inventoryFeatureEnabled) {
                        self.clearInventoryState();
                    } else if (inventoryResponse.status === 'fulfilled' && inventoryResponse.value) {
                        self.inventorySessions = inventoryResponse.value;
                        var activeSessions = inventoryResponse.value.activeSessions || [];
                        var sessionId = activeSessions.length > 0 ? activeSessions[0].inventoryId : null;

                    var failures = [transferOverviewResponse, inventoryResponse, assetsResponse, transferCountResponse, pendingInventoryResponse, lentResponse]
                        .filter(function (r) { return r.status === 'rejected'; });
                    if (failures.length > 0) {
                        console.warn('部分數據載入失敗：', failures);

                    }
                    var elapsedTime = Date.now() - startTime;
                    var remainingTime = Math.max(0, MIN_LOADING_DURATION - elapsedTime);
                    setTimeout(function () { self.isLoadingCards = false; }, remainingTime);
                }).catch(function (error) {
                    self.isLoadingCards = false;

                }
                if (detailType === 'transfer' && Array.isArray(this.transferringAssets)) {
                    var match = this.transferringAssets.find(function (item) { return String((item && item.assetId) || '').trim() === assetId; });
                    if (match) {
                        return {
                            type: 'transfer',
                            detail: {
                                workflowStatus: match.status || asset.status || '',
                                applicationTime: match.applicationTime || '',
                                transferType: match.transferType || '',
                                oldKeeper: match.oldKeeper || '',
                                newKeeper: match.newKeeper || '',
                                oldUser: match.oldUser || '',
                                newUser: match.newUser || '',
                                oldLocation: match.oldLocation || '',
                                newLocation: match.newLocation || '',
                                applicantEmail: match.applicantEmail || ''

                }
                if (detailType === 'transfer' && Array.isArray(this.pendingApprovalsData)) {
                    var pendingMatch = this.pendingApprovalsData.find(function (item) { return String((item && item.assetId) || '').trim() === assetId; });
                    if (pendingMatch) {
                        return {
                            type: 'transfer',
                            detail: {
                                workflowStatus: '待接收',
                                applicationTime: pendingMatch.applyTime || '',
                                transferType: pendingMatch.transferType || '',
                                oldKeeper: pendingMatch.oldKeeper || '',
                                newKeeper: pendingMatch.newKeeper || '',
                                oldUser: pendingMatch.oldUser || '',
                                newUser: pendingMatch.newUser || '',
                                oldLocation: pendingMatch.oldLocation || '',
                                newLocation: pendingMatch.newLocation || '',
                                applicantEmail: ''
                            }
                        };
                    }
                }
                if (detailType === 'lending' && Array.isArray(this.lentAssetsDetails)) {
                    var lendingMatch = this.lentAssetsDetails.find(function (item) { return String((item && item.assetId) || '').trim() === assetId; });
                    if (lendingMatch) {
                        return {
                            type: 'lending',
                            detail: {
                                lenderName: lendingMatch.lenderName || '',
                                borrower: lendingMatch.borrower || '',
                                borrowerType: lendingMatch.borrowerType || '',

                                originalLocation: lendingMatch.originalLocation || '',
                                lendingLocation: lendingMatch.lendingLocation || '',

                            }

            handleOpenStatusDetail: function (asset) {

                        productSerial: asset.productSerial || '',
                        sourceSheet: asset.sourceSheet || '',
                        status: asset.status
                    },

                };

                    .withSuccessHandler(function (response) {

            /* ── 匯出(舊頁 14574-14732;xlsx 改按需載入 ensureXLSX,行為等價) ── */
            requestExportData: function (format) {
                var self = this;
                if (this.isExporting) return;
                var targets = this.filteredAssets.map(function (asset) {
                    return { assetId: asset.assetId, sourceSheet: asset.sourceSheet };
                });
                if (targets.length === 0) {
                    alert('沒有可匯出的資料');
                    return;
                }
                var proceed = function () {
                    self.isExporting = true;
                    if (typeof showToastProgress === 'function') {
                        showToastProgress(format === 'excel' ? '正在匯出 Excel...' : '正在匯出 CSV...');
                    }
                    var forceUserScope = self.viewMode === 'user';
                    google.script.run
                        .withSuccessHandler(function (response) {
                            if (!response || response.error) {
                                var message = (response && response.error) || '匯出失敗';
                                if (typeof hideToastProgress === 'function') hideToastProgress('匯出失敗', 300);
                                alert(message);
                                self.isExporting = false;
                                return;
                            }
                            self.finishExport(format, response);
                        })
                        .withFailureHandler(function (error) {
                            console.error('匯出失敗：', error);
                            if (typeof hideToastProgress === 'function') hideToastProgress('匯出失敗', 300);
                            alert('匯出失敗：' + ((error && error.message) || error));
                            self.isExporting = false;
                        })
                        .getUserStateExportDataByTargets(targets, forceUserScope);
                };
                if (format === 'excel') {
                    // 新頁改為按需載入 xlsx(對應舊頁的「元件尚未載入」防護)
                    window.ensureXLSX().then(proceed).catch(function (e) {
                        alert(e.message || 'Excel 匯出元件載入失敗，請重新整理後再試。');
                    });
                } else {
                    proceed();
                }
            },
            finishExport: function (format, response) {
                var self = this;
                var buildExportTimestamp = function () {
                    var now = new Date();
                    var pad = function (v) { return String(v).padStart(2, '0'); };
                    return '' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
                };
                var buildExportFilename = function (prefix, timestamp, extension) {
                    return prefix + '_' + timestamp + '.' + extension;
                };
                var escapeCsvValue = function (value) {
                    if (value === null || value === undefined) return '';
                    var text = String(value);
                    var escaped = text.replace(/"/g, '""');
                    return /[",\r\n]/.test(escaped) ? '"' + escaped + '"' : escaped;
                };
                var downloadBlob = function (content, filename, mimeType) {
                    var blob = new Blob([content], { type: mimeType });
                    var url = URL.createObjectURL(blob);
                    var link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(function () { URL.revokeObjectURL(url); }, 0);
                };
                var buildColumnWidths = function (rows) {
                    var columnCount = rows.reduce(function (max, row) { return Math.max(max, row.length); }, 0);
                    return Array.from({ length: columnCount }, function (_, columnIndex) {
                        var maxLength = 0;
                        rows.forEach(function (row) {
                            var cell = row[columnIndex];
                            if (cell === null || cell === undefined) return;
                            var length = String(cell).length;
                            if (length > maxLength) maxLength = length;
                        });
                        var width = Math.min(36, Math.max(8, Math.round(maxLength * 1.6)));
                        return { wch: width };
                    });
                };

                var propertyData = response.property || {};
                var itemData = response.items || {};
                var propertyHeaders = Array.isArray(propertyData.headers) ? propertyData.headers : [];
                var propertyRows = Array.isArray(propertyData.rows) ? propertyData.rows : [];
                var itemHeaders = Array.isArray(itemData.headers) ? itemData.headers : [];
                var itemRows = Array.isArray(itemData.rows) ? itemData.rows : [];
                var hasProperty = propertyRows.length > 0;
                var hasItems = itemRows.length > 0;

                if (!hasProperty && !hasItems) {
                    if (typeof hideToastProgress === 'function') hideToastProgress('沒有可匯出的資料', 300);
                    else alert('沒有可匯出的資料');
                    self.isExporting = false;
                    return;
                }
                var timestamp = buildExportTimestamp();
                if (format === 'excel') {
                    var workbook = XLSX.utils.book_new();
                    if (hasProperty) {
                        var propertySheetRows = [propertyHeaders].concat(propertyRows);
                        var propertySheet = XLSX.utils.aoa_to_sheet(propertySheetRows);
                        propertySheet['!cols'] = buildColumnWidths(propertySheetRows);
                        XLSX.utils.book_append_sheet(workbook, propertySheet, '財產');
                    }
                    if (hasItems) {
                        var itemSheetRows = [itemHeaders].concat(itemRows);
                        var itemSheet = XLSX.utils.aoa_to_sheet(itemSheetRows);
                        itemSheet['!cols'] = buildColumnWidths(itemSheetRows);
                        XLSX.utils.book_append_sheet(workbook, itemSheet, '物品');
                    }
                    XLSX.writeFile(workbook, buildExportFilename('userstate_export', timestamp, 'xlsx'));
                } else {
                    if (hasProperty) {
                        var rows = [propertyHeaders].concat(propertyRows);
                        var csvContent = rows.map(function (row) { return row.map(escapeCsvValue).join(','); }).join('\r\n');
                        downloadBlob('﻿' + csvContent, buildExportFilename('userstate_property', timestamp, 'csv'), 'text/csv;charset=utf-8;');
                    }
                    if (hasItems) {
                        var itemRowsAll = [itemHeaders].concat(itemRows);
                        var itemCsv = itemRowsAll.map(function (row) { return row.map(escapeCsvValue).join(','); }).join('\r\n');
                        downloadBlob('﻿' + itemCsv, buildExportFilename('userstate_item', timestamp, 'csv'), 'text/csv;charset=utf-8;');
                    }
                }
                if (typeof hideToastProgress === 'function') hideToastProgress('匯出完成！', 300);
                self.isExporting = false;
            },
            handleExportExcel: function () { this.requestExportData('excel'); },
            handleExportCsv: function () { this.requestExportData('csv'); },

                        lending: function () { self.handleBatchLending(); },
                        scrap: function () { self.handleBatchScrap(); },
                        inventory: function () { self.handleBatchInventory(); }
                    }
                };
                try { window.dispatchEvent(new Event('UserstateCartBridge:update')); } catch (err) { /* ignore */ }
            },

            /* ── 全域契約同步(舊頁 14446-14459, 14828-14875) ── */
            syncPendingApprovalsGlobal: function () {
                window.pendingApprovals = this.pendingApprovalsData;
            },
            syncTransferOptionGlobals: function () {
                if (this.transferOptions) {
                    window.currentUserEmail = this.transferOptions.currentUserEmail || '';
                    window.groupProxyEnabled = this.transferOptions.groupProxyEnabled || false;
                    window.groupMemberEmailsLower = this.transferOptions.groupMemberEmailsLower || [];
                    window.currentGroup = this.transferOptions.currentGroup || null;
                }
            },
            syncAssetGlobals: function () {
                if (!this.isReady) return;
                this.assetsVersion += 1;
                window.allAssets = this.allAssets
                    .filter(function (asset) { return asset.status === '在庫'; })
                    .map(function (asset) {
                        return {
                            id: asset.assetId,
                            assetId: asset.assetId,
                            assetName: asset.assetName,
                            assetAlias: asset.assetAlias || '',
                            productSerial: asset.productSerial || '',
                            keeperName: asset.leader,
                            leader: asset.leader,
                            leaderEmail: asset.leaderEmail || '',
                            userName: asset.userName || '',
                            userEmail: asset.userEmail || '',
                            group: asset.group || '未分組',
                            location: asset.location,
                            status: asset.status,
                            category: asset.category || '',
                            sourceSheet: asset.sourceSheet || '',
                            isItAsset: asset.isItAsset || '',
                            isIsoScope: asset.isIsoScope || '',
                            ismsAssetId: asset.ismsAssetId || ''
                        };
                    });
                if (typeof window.BatchList_rebuildIndex === 'function') {
                    window.BatchList_rebuildIndex();
                }
                if (typeof window.Scanner_enhanceSearchBox === 'function') {
                    setTimeout(function () { window.Scanner_enhanceSearchBox(); }, 100);
                }
                window.duplicateGroups = this.duplicateInfo.groups;
                console.log('[App] 已更新 window.allAssets，共', window.allAssets.length, '筆「在庫」資產');
            },

            /* ── 初始化(對應舊頁 mount useEffect 群:14413-14434, 13052-13071) ── */
            init: function () {
                var self = this;
                this.loadData();
                // 全域刷新契約(舊頁 14417;vanilla 審核區審核後呼叫)
                window.refreshReactData = function () { self.loadData(); };
                // 頁面網址事件(舊頁 14422-14434)
                window.addEventListener(USERSTATE_PAGE_URLS_EVENT, function (event) {
                    self.userStatePageUrls = Object.assign({}, self.userStatePageUrls, event.detail || {});
                });
                // BatchList → 選取狀態單向同步(舊頁 13053-13071;處理 Scanner Enter 掃描加入)
                setInterval(function () {
                    if (typeof window.BatchList_getItems === 'function') {
                        var batchItems = window.BatchList_getItems();
                        var prev = self.selectedAssetIds;
                        var newItems = batchItems.filter(function (id) { return prev.indexOf(id) === -1; });
                        if (newItems.length > 0) {
                            self.selectedAssetIds = prev.concat(newItems);
                        }
                    }
                }, 500);
                // duplicateGroups 同步(舊頁 14829-14831;篩選變動時重算)
                Alpine.effect(function () {
                    window.duplicateGroups = self.duplicateInfo.groups;
                });
                // 進階模式購物車(舊頁 13073-13082):訂閱快照 + 初始化(alpine_cart.html 提供)
                // ⚠ 訂閱回呼只更新快照;「離開進階模式關閉面板」需以「模式轉變」為條件(舊頁是
                //   獨立的 useEffect[isAdvancedMode],僅值變化時觸發)。若在每次 notify 都關面板,
                //   closeActionPanel→clearPendingAsset→notify 會無限遞迴。故以 prevAdvanced 做守衛。
                if (window.AssetCartStore) {
                    window.AssetCartStore.subscribe(function (snapshot) {
                        var prevAdvanced = self.isAdvancedMode;
                        self.cartSnapshot = snapshot;
                        var nowAdvanced = snapshot.mode === 'ADVANCED';
                        if (prevAdvanced && !nowAdvanced) { // 舊頁 13469-13476
                            self.isScannerOpen = false;
                            if (refs.closeActionPanelFn) {
                                refs.closeActionPanelFn({ skipScannerStatus: true });
                            }
                        }
                    });
                    window.AssetCartStore.init();
                }
                // BatchList / Scanner 覆寫(舊頁 3175-3331;alpine_cart.html 提供,內建重試)
                if (typeof window.setupBatchListOverrides === 'function') window.setupBatchListOverrides();
                if (typeof window.setupScannerOverrides === 'function') window.setupScannerOverrides();
                // 掃描器 shell 契約(舊頁 13455-13462)
                window.App_toggleScanner = function () { self.toggleScannerShell(); };
                window.AdvancedMode_toggleScanner = function () {
                    self.toggleScannerShell({
                        onClose: function () {
                            if (refs.closeActionPanelFn) refs.closeActionPanelFn({ skipScannerStatus: true });
                        }
                    });
                };
                // 進階清單移除契約(舊頁 13390-13393)
                window.AdvancedCart_removeItem = function (assetId) {
                    if (!window.AssetCartStore) return;
                    window.AssetCartStore.removeItem(assetId);
                };
                // closeActionPanel ref(舊頁 13465-13467)+ 進階模式開關 ActionPanel 動作面板契約
                refs.closeActionPanelFn = function (opts) { self.closeActionPanel(opts); };
                window.AdvancedMode_openActionPanel = function (assetId, opts) { self.openActionPanel(assetId, opts || {}); };
                window.AdvancedMode_handleScan = function (rawCode, opts) {
                    opts = opts || {};
                    if (!window.AssetCartStore || !window.AssetCartStore.isAdvancedMode()) return;
                    if (window.AssetCartStore.isPendingAction()) {
                        if (typeof window.BatchList_showToast === 'function') window.BatchList_showToast('請先完成上一筆動作', 'warning');
                        return;
                    }
                    var rawValue = String(rawCode || '').trim();
                    var formatted = typeof window.Scanner_formatBarcode === 'function' ? window.Scanner_formatBarcode(rawValue) : rawValue;
                    var asset = (typeof window.BatchList_findAsset === 'function'
                        ? (window.BatchList_findAsset(formatted) || window.BatchList_findAsset(rawValue))
                        : null) || (window.allAssets || []).find(function (entry) { return entry.id === formatted || entry.id === rawValue; });
                    if (!asset) {
                        var message = '未找到資產：' + formatted;
                        if (typeof window.BatchList_showToast === 'function') window.BatchList_showToast(message, 'error');
                        if (typeof window.Scanner_updateStatus === 'function' && opts.source === 'camera') window.Scanner_updateStatus(message, 'error');
                        return;
                    }
                    var assetId = asset.id || asset.assetId || formatted;
                    var displayMode = opts.source === 'camera' ? 'embedded' : 'modal';
                    self.openActionPanel(assetId, { displayMode: displayMode, source: opts.source });
                    if (typeof window.Scanner_playSound === 'function') window.Scanner_playSound();
                };

                // 進階模式:購物車 items → 選取狀態鏡射(舊頁 13089-13093)
                Alpine.effect(function () {
                    if (!self.isAdvancedMode) return;
                    self.selectedAssetIds = self.cartSnapshot.items.map(function (item) { return item.assetId; });
                });
                // 進階模式:攔截 checkbox change 冒泡(舊頁 13095-13104)
                document.addEventListener('change', function (event) {
                    if (!self.isAdvancedMode) return;
                    var target = event.target;
                    if (!target || !target.classList || !target.classList.contains('asset-checkbox')) return;
                    event.stopPropagation();
                }, true);
                // 進階模式:硬體掃描器鍵盤緩衝(舊頁 13106-13146)
                (function () {
                    var buffer = '';
                    var timerId = null;
                    var resetBuffer = function () { buffer = ''; if (timerId) { clearTimeout(timerId); timerId = null; } };
                    document.addEventListener('keydown', function (event) {
                        if (!self.isAdvancedMode) return;
                        var target = event.target;
                        var isEditable = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable);
                        if (isEditable) return;
                        if (event.key === 'Enter') {
                            if (buffer.length >= 4 && typeof window.AdvancedMode_handleScan === 'function') {
                                window.AdvancedMode_handleScan(buffer, { source: 'hardware' });
                            }
                            resetBuffer();
                            return;
                        }
                        if (event.key.length === 1) {
                            buffer += event.key;
                            if (timerId) clearTimeout(timerId);
                            timerId = setTimeout(resetBuffer, 120);
                        }
                    });
                })();
                // 進階模式:搜尋框 Enter 當作掃描(舊頁 13148-13171;搜尋框於 alpine_views 掛載後才存在,延遲綁定)
                var bindSearchEnter = function () {
                    var searchBox = document.getElementById('search-box');
                    if (!searchBox) { setTimeout(bindSearchEnter, 300); return; }
                    searchBox.addEventListener('keypress', function (event) {
                        if (!self.isAdvancedMode) return;
                        if (event.key !== 'Enter') return;
                        event.preventDefault();
                        event.stopPropagation();
                        event.stopImmediatePropagation();
                        var value = String(searchBox.value || '').trim();
                        if (!value) return;
                        if (typeof window.AdvancedMode_handleScan === 'function') window.AdvancedMode_handleScan(value, { source: 'manual' });
                        if (typeof window.clearSearchBox === 'function') window.clearSearchBox();
                        else { searchBox.value = ''; searchBox.dispatchEvent(new Event('input', { bubbles: true })); }
                    }, true);
                };
                bindSearchEnter();

                // 進階清單送出契約(舊頁 15666-15673)
                window.AdvancedCart_submit = function () { self.submitAdvancedCart(); };
                // 購物車橋接(舊頁 15480-15496):模式或盤點狀態變化時更新
                Alpine.effect(function () {
                    // 觸發依賴:isAdvancedMode、hasActiveInventory
                    var _ = self.isAdvancedMode; var __ = self.hasActiveInventory;
                    self.updateCartBridge();
                });
            }
        });
    });
})();
</script>
