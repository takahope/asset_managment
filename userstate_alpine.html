    <!-- Excel 匯出/匯入模組(xlsx-js-style)按需載入:點匯出/匯入時才下載,初始載入零成本 -->
    <script>
        window.ensureXLSX = function () {
            if (window.XLSX) return Promise.resolve(window.XLSX);
            if (window.__xlsxLoading) return window.__xlsxLoading;
            window.__xlsxLoading = new Promise(function (resolve, reject) {
                var s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
                s.integrity = 'sha384-OUW9euuUyxyHcAhTqbhI+Iyb8LMssXt/cpz0yXhs9UWG2/R/uaWdakx/4cfww7Vb';
                s.crossOrigin = 'anonymous';
                s.onload = function () { resolve(window.XLSX); };
                s.onerror = function () {
                    window.__xlsxLoading = null;
                    s.remove();
                    reject(new Error('Excel 模組載入失敗，請檢查網路後重試。'));
                };
                document.head.appendChild(s);
            });
            return window.__xlsxLoading;
        };
    </script>

        .toggle-switch {
            position: relative;
            --toggle-width: 54px;
            --toggle-height: 30px;
            --toggle-padding: 4px;
            --toggle-thumb: calc(var(--toggle-height) - (var(--toggle-padding) * 2));
            width: var(--toggle-width);
            height: var(--toggle-height);
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            min-width: var(--toggle-width);
            min-height: var(--toggle-height);
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: 0.25s ease;
            border-radius: 999px;
            overflow: hidden;
        }

        .toggle-slider::after {
            content: "";
            position: absolute;
            height: var(--toggle-thumb);
            width: var(--toggle-thumb);
            left: var(--toggle-padding);
            top: var(--toggle-padding);
            background-color: #ffffff;
            transition: 0.25s ease;
            border-radius: 50%;
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.18);
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: #1aa39f;
        }

        .toggle-switch input:checked + .toggle-slider::after {
            transform: translateX(calc(var(--toggle-width) - var(--toggle-thumb) - (var(--toggle-padding) * 2)));
        }

            <div class="lm-card">
                <div class="lm-header">
                    <h5 class="lm-title" id="assignmentAssetsTitle">分派清單</h5>

    <!-- 全域函數橋接 jQuery Modal -->
    <script>
        // 全域變數供 React 與 jQuery 共享
        window.pendingApprovals = [];
        window.filteredPendingApprovals = [];
        window.pendingCurrentPage = 1;
        window.pendingRowsPerPage = 50;
        window.duplicateGroups = [];
        window.assignmentRowsPerPage = 50;
        window.assignmentModalState = {
            key: '',
            title: '',
            sessionId: '',
            assets: [],
            page: 1,
            loading: false,
            error: ''
        };
        window.inventoryAssignmentOptions = { users: [], groups: [] };

        function setAssignmentCustomError(message) {
            const errorEl = document.getElementById('assignment-custom-error');
            if (!errorEl) return;
            if (message) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            } else {
                errorEl.textContent = '';
                errorEl.style.display = 'none';
            }
        }

        function toggleAssignmentCustomFields(isCustom) {
            const container = document.getElementById('assignment-custom-fields');
            if (!container) return;
            if (isCustom) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function updateAssignmentTargetOptions(options = window.inventoryAssignmentOptions, keepSelection = true) {
            const typeEl = document.getElementById('assignment-target-type');
            const valueEl = document.getElementById('assignment-target-value');
            if (!typeEl || !valueEl) return;

            const targetType = typeEl.value || 'user';
            const previousValue = keepSelection ? valueEl.value : '';
            valueEl.innerHTML = '<option value="">-- 請選擇 --</option>';

            if (targetType === 'group') {
                const groups = Array.isArray(options.groups) ? options.groups : [];
                groups.forEach(group => {
                    const option = document.createElement('option');
                    option.value = group;
                    option.textContent = group;
                    valueEl.appendChild(option);
                });
            } else {
                const users = Array.isArray(options.users) ? options.users : [];
                users.forEach(user => {
                    const email = user?.email || '';
                    if (!email) return;
                    const name = user?.name || email.split('@')[0];
                    const group = user?.group ? ` - ${user.group}` : '';
                    const option = document.createElement('option');
                    option.value = email;
                    option.textContent = `${name} (${email})${group}`;
                    valueEl.appendChild(option);
                });
            }

            if (previousValue) {
                const hasOption = Array.from(valueEl.options).some(option => option.value === previousValue);
                if (hasOption) valueEl.value = previousValue;
            }
        }

        window.updateAssignmentTargetOptions = updateAssignmentTargetOptions;
        window.prepareAssignmentModeModal = () => {
            const isCustom = !!document.getElementById('assignment-mode-custom')?.checked;
            toggleAssignmentCustomFields(isCustom);
            setAssignmentCustomError('');
            updateAssignmentTargetOptions(window.inventoryAssignmentOptions, true);
        };
        window.setAssignmentCustomError = setAssignmentCustomError;

        (function initAssignmentModeModal() {
            const modal = document.getElementById('assignmentModeModal');
            if (!modal || modal.dataset.initialized) return;
            modal.dataset.initialized = 'true';

            modal.querySelectorAll('input[name="assignmentMode"]').forEach(radio => {
                radio.addEventListener('change', () => {
                    const isCustom = !!document.getElementById('assignment-mode-custom')?.checked;
                    toggleAssignmentCustomFields(isCustom);
                    setAssignmentCustomError('');
                });
            });

            const typeEl = document.getElementById('assignment-target-type');
            if (typeEl) {
                typeEl.addEventListener('change', () => {
                    setAssignmentCustomError('');
                    updateAssignmentTargetOptions(window.inventoryAssignmentOptions, false);
                });
            }

            const valueEl = document.getElementById('assignment-target-value');
            if (valueEl) {
                valueEl.addEventListener('change', () => {
                    setAssignmentCustomError('');
                });
            }
        })();

        window.openPendingApprovalModal = () => {
            if (!Array.isArray(window.pendingApprovals)) {
                window.pendingApprovals = [];
            }

            if (!document.getElementById('pendingApprovalModal').dataset.initialized) {
                document.getElementById('pending-location-filter').addEventListener('change', filterPendingApprovals);
                document.getElementById('pending-search-box').addEventListener('input', filterPendingApprovals);
                document.getElementById('pending-select-all').addEventListener('change', (event) => {
                    document.querySelectorAll('.pending-approval-checkbox').forEach(cb => {
                        cb.checked = event.target.checked;
                    });
                });
                document.getElementById('pendingApprovalModal').dataset.initialized = 'true';
            }

            populatePendingFilters();
            filterPendingApprovals();
            $('#pendingApprovalModal').modal('show');
        };

        window.openDuplicateAssetsModal = () => {
            if (!window.duplicateGroups || window.duplicateGroups.length === 0) return;
            renderDuplicateAssetsModal();
            $('#duplicateAssetsModal').modal('show');
        };

        window.openInventoryAssignmentModal = (state = {}) => {
            window.assignmentModalState = {
                key: '',
                title: '',
                sessionId: '',
                assets: [],
                page: 1,
                loading: false,
                error: '',
                ...state
            };
            renderAssignmentAssetsModal();
            $('#assignmentAssetsModal').modal('show');
        };

        window.updateInventoryAssignmentModal = (state = {}) => {
            window.assignmentModalState = {
                ...window.assignmentModalState,
                ...state
            };
            renderAssignmentAssetsModal();
        };

        function legacyGetAssetAliasValue(asset) {
            if (!asset) return '';
            const sourceSheet = String(asset.sourceSheet || '').trim();
            const rawValue = sourceSheet === '物品總表'
                ? asset.productSerial
                : asset.assetAlias;
            return String(rawValue || '').trim();
        }

        function legacyGetAssetAliasDisplay(asset, empty = '') {
            const value = legacyGetAssetAliasValue(asset);
            return value || empty;
        }

        function populatePendingFilters() {
            const locationFilter = document.getElementById('pending-location-filter');
            locationFilter.innerHTML = '<option value="">-- 顯示全部 --</option>';
            const uniqueLocations = [...new Set(window.pendingApprovals.map(item => item.oldLocation))].filter(Boolean).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            uniqueLocations.forEach(loc => {
                const option = document.createElement('option');
                option.value = loc;
                option.textContent = loc;
                locationFilter.appendChild(option);
            });
        }

        function filterPendingApprovals() {
            const locationFilter = document.getElementById('pending-location-filter').value.toUpperCase();
            const searchFilter = document.getElementById('pending-search-box').value.toUpperCase();

            window.filteredPendingApprovals = window.pendingApprovals.filter(item => {
                const locationMatch = (locationFilter === '') || (item.oldLocation && item.oldLocation.toUpperCase() === locationFilter);
                const searchMatch = item.assetId.toUpperCase().includes(searchFilter) ||
                                    (item.assetName && item.assetName.toUpperCase().includes(searchFilter)) ||
                                    (legacyGetAssetAliasValue(item) && legacyGetAssetAliasValue(item).toUpperCase().includes(searchFilter)) ||
                                    (item.oldKeeper && item.oldKeeper.toUpperCase().includes(searchFilter));
                return locationMatch && searchMatch;
            });

            window.pendingCurrentPage = 1;
            renderPendingPage(window.pendingCurrentPage);
        }

        function renderPendingPage(page) {
            window.pendingCurrentPage = page;
            const listBody = document.getElementById('pending-approval-list');
            const pagination = document.getElementById('pending-pagination');
            listBody.innerHTML = '';

            if (window.filteredPendingApprovals.length === 0) {
                const hasAnyPending = Array.isArray(window.pendingApprovals) && window.pendingApprovals.length > 0;
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 10;
                cell.className = 'text-center text-slate-500';
                cell.textContent = hasAnyPending ? '沒有符合條件的項目。' : '無待接收項目。';
                row.appendChild(cell);
                listBody.appendChild(row);
                pagination.textContent = '';
                return;
            }

            const start = (page - 1) * window.pendingRowsPerPage;
            const end = start + window.pendingRowsPerPage;
            const items = window.filteredPendingApprovals.slice(start, end);

            const fragment = document.createDocumentFragment();
            items.forEach(item => {
                const row = document.createElement('tr');

                const checkboxTd = document.createElement('td');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'pending-approval-checkbox';
                checkbox.value = item.appId;
                checkboxTd.appendChild(checkbox);
                row.appendChild(checkboxTd);

                const assetIdTd = document.createElement('td');
                assetIdTd.textContent = item.assetId;
                row.appendChild(assetIdTd);

                const assetNameTd = document.createElement('td');
                assetNameTd.textContent = item.assetName;
                row.appendChild(assetNameTd);

                const assetAliasTd = document.createElement('td');
                assetAliasTd.textContent = legacyGetAssetAliasDisplay(item, '');
                row.appendChild(assetAliasTd);

                const modelBrandTd = document.createElement('td');
                modelBrandTd.textContent = item.modelBrand || '';
                row.appendChild(modelBrandTd);

                function createChangeTd(oldVal, newVal, hasChange) {
                    const td = document.createElement('td');
                    if (hasChange) {
                        td.appendChild(document.createTextNode(oldVal || ''));
                        const arrow = document.createElement('span');
                        arrow.className = 'text-blue-600';
                        arrow.textContent = ' → ';
                        td.appendChild(arrow);
                        td.appendChild(document.createTextNode(newVal || ''));
                    } else {
                        td.textContent = oldVal || '';
                    }
                    return td;
                }

                const keeperHasChange = item.newKeeper && item.oldKeeper !== item.newKeeper;
                row.appendChild(createChangeTd(item.oldKeeper, item.newKeeper, keeperHasChange));

                const oldUser = item.oldUser || item.userName || '';
                const newUser = item.newUser || '';
                const userHasChange = newUser && oldUser !== newUser;
                row.appendChild(createChangeTd(oldUser, newUser, userHasChange));

                const locationHasChange = item.newLocation && item.oldLocation !== item.newLocation;
                row.appendChild(createChangeTd(item.oldLocation, item.newLocation, locationHasChange));

                const transferType = item.transferType || '地點';
                const typeTd = document.createElement('td');
                const typeBadgeEl = document.createElement('span');
                if (transferType.includes('保管人') && transferType.includes('使用人')) {
                    typeBadgeEl.className = 'lm-badge lm-badge--danger';
                    typeBadgeEl.textContent = '保管人+使用人';
                } else if (transferType.includes('保管人')) {
                    typeBadgeEl.className = 'lm-badge lm-badge--warning';
                    typeBadgeEl.textContent = '保管人';
                } else if (transferType.includes('使用人')) {
                    typeBadgeEl.className = 'lm-badge lm-badge--info';
                    typeBadgeEl.textContent = '使用人';
                } else {
                    typeBadgeEl.className = 'lm-badge lm-badge--secondary';
                    typeBadgeEl.textContent = '地點';
                }
                typeTd.appendChild(typeBadgeEl);
                row.appendChild(typeTd);

                const applyTimeTd = document.createElement('td');
                applyTimeTd.textContent = item.applyTime;
                row.appendChild(applyTimeTd);

                fragment.appendChild(row);
            });

            listBody.appendChild(fragment);
            renderPendingPagination();
            document.getElementById('pending-select-all').checked = false;
        }

        function renderPendingPagination() {
            const pagination = document.getElementById('pending-pagination');
            const totalPages = Math.ceil(window.filteredPendingApprovals.length / window.pendingRowsPerPage);

            if (window.filteredPendingApprovals.length === 0) {
                const hasAnyPending = Array.isArray(window.pendingApprovals) && window.pendingApprovals.length > 0;
                pagination.innerHTML = hasAnyPending
                    ? '<span class="text-slate-500">沒有符合篩選條件的項目。</span>'
                    : '<span class="text-slate-500">無待接收項目。</span>';
                return;
            }
            if (totalPages <= 1) {
                pagination.innerHTML = `<span class="text-slate-500">共 ${window.filteredPendingApprovals.length} 筆資料</span>`;
                return;
            }

            const info = document.createElement('span');
            info.className = 'text-slate-500';
            info.textContent = `共 ${window.filteredPendingApprovals.length} 筆資料，第 ${window.pendingCurrentPage} / ${totalPages} 頁`;

            const nav = document.createElement('ul');
            nav.className = 'pagination mb-0';

            const prev = document.createElement('li');
            prev.className = `page-item ${window.pendingCurrentPage === 1 ? 'disabled' : ''}`;
            const prevLink = document.createElement('a');
            prevLink.className = 'page-link';
            prevLink.textContent = '上一頁';
            prevLink.addEventListener('click', () => {
                if (window.pendingCurrentPage > 1) renderPendingPage(window.pendingCurrentPage - 1);
            });
            prev.appendChild(prevLink);

            const next = document.createElement('li');
            next.className = `page-item ${window.pendingCurrentPage === totalPages ? 'disabled' : ''}`;
            const nextLink = document.createElement('a');
            nextLink.className = 'page-link';
            nextLink.textContent = '下一頁';
            nextLink.addEventListener('click', () => {
                if (window.pendingCurrentPage < totalPages) renderPendingPage(window.pendingCurrentPage + 1);
            });
            next.appendChild(nextLink);

            nav.appendChild(prev);
            nav.appendChild(next);

            pagination.innerHTML = '';
            pagination.appendChild(info);
            pagination.appendChild(nav);
        }

        function renderAssignmentAssetsModal() {
            const titleEl = document.getElementById('assignmentAssetsTitle');
            const metaEl = document.getElementById('assignment-assets-meta');
            const bodyEl = document.getElementById('assignment-assets-body');
            const paginationEl = document.getElementById('assignment-assets-pagination');
            const state = window.assignmentModalState || {};

            const normalizedKey = state.key || '未指派';
            const titleLabel = normalizedKey === '未指派'
                ? '未指派'
                : (String(normalizedKey).includes('@')
                    ? `${state.title || normalizedKey} (${normalizedKey})`
                    : (state.title || normalizedKey));

            if (titleEl) titleEl.textContent = `分派清單 - ${titleLabel}`;
            if (metaEl) metaEl.textContent = state.loading
                ? '載入中...'
                : (state.error ? '' : `共 ${(state.assets || []).length} 筆資產`);

            if (!bodyEl || !paginationEl) return;
            bodyEl.innerHTML = '';
            paginationEl.innerHTML = '';

            if (state.loading) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 9;
                cell.className = 'text-center text-slate-500';
                cell.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>載入中...';
                row.appendChild(cell);
                bodyEl.appendChild(row);
                return;
            }

            if (state.error) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 9;
                cell.className = 'text-center text-red-600';
                cell.textContent = state.error;
                row.appendChild(cell);
                bodyEl.appendChild(row);
                return;
            }

            const assets = Array.isArray(state.assets) ? state.assets : [];
            const total = assets.length;
            if (total === 0) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 9;
                cell.className = 'text-center text-slate-500';
                cell.textContent = '沒有符合條件的資產';
                row.appendChild(cell);
                bodyEl.appendChild(row);
                return;
            }

            const pageCount = Math.max(1, Math.ceil(total / window.assignmentRowsPerPage));
            let page = Number(state.page || 1);
            if (page > pageCount) page = pageCount;

            const start = (page - 1) * window.assignmentRowsPerPage;
            const end = start + window.assignmentRowsPerPage;
            const pageAssets = assets.slice(start, end);
            const fragment = document.createDocumentFragment();

            pageAssets.forEach(asset => {
                const row = document.createElement('tr');
                const cells = [
                    asset.assetId,
                    asset.assetName,
                    legacyGetAssetAliasDisplay(asset, ''),
                    asset.userName,
                    asset.keeperName,
                    asset.location,
                    asset.inventoryResult,
                    asset.isItAsset || '',
                    asset.ismsAssetId || ''
                ];
                cells.forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value || '';
                    row.appendChild(td);
                });
                fragment.appendChild(row);
            });

            bodyEl.appendChild(fragment);

            if (pageCount <= 1) return;

            const info = document.createElement('div');
            info.className = 'text-slate-500';
            info.textContent = `第 ${page} / ${pageCount} 頁`;
            paginationEl.appendChild(info);

            const nav = document.createElement('div');
            const prevBtn = document.createElement('button');
            prevBtn.className = 'lm-btn lm-btn--sm lm-btn--outline-secondary mr-2';
            prevBtn.textContent = '上一頁';
            prevBtn.disabled = page <= 1;
            prevBtn.addEventListener('click', () => {
                if (page > 1) {
                    window.assignmentModalState.page = page - 1;
                    renderAssignmentAssetsModal();
                }
            });

            const nextBtn = document.createElement('button');
            nextBtn.className = 'lm-btn lm-btn--sm lm-btn--outline-secondary';
            nextBtn.textContent = '下一頁';
            nextBtn.disabled = page >= pageCount;
            nextBtn.addEventListener('click', () => {
                if (page < pageCount) {
                    window.assignmentModalState.page = page + 1;
                    renderAssignmentAssetsModal();
                }
            });

            nav.appendChild(prevBtn);
            nav.appendChild(nextBtn);
            paginationEl.appendChild(nav);
        }

        function submitPendingApproval() {
            const selected = Array.from(document.querySelectorAll('.pending-approval-checkbox:checked')).map(cb => cb.value);
            if (selected.length === 0) {
                alert('請至少勾選一個項目再送出。');
                return;
            }

            showToastProgress('正在處理接收作業...');
            google.script.run
                .withSuccessHandler(message => {
                    hideToastProgress('處理完成！', 300);
                    $('#pendingApprovalModal').modal('hide');
                    alert(message);
                    window.refreshReactData && window.refreshReactData();
                })
                .withFailureHandler(error => {
                    hideToastProgress('處理失敗！', 300);
                    alert('處理失敗：' + error.message);
                })
                .processBatchApproval(selected);
        }

        function submitPendingRejection() {
            const selected = Array.from(document.querySelectorAll('.pending-approval-checkbox:checked')).map(cb => cb.value);

        function renderDuplicateAssetsModal() {
            const metaEl = document.getElementById('duplicate-assets-meta');
            const bodyEl = document.getElementById('duplicate-assets-body');

            const groups = window.duplicateGroups.slice().sort((a, b) => {
                if (!a.assetId && !b.assetId) return 0;
                if (!a.assetId) return 1;
                if (!b.assetId) return -1;
                return String(a.assetId).localeCompare(String(b.assetId), 'zh-Hant');
            });

            const totalGroups = groups.length;
            const totalRows = groups.reduce((sum, group) => sum + group.items.length, 0);
            metaEl.textContent = `共 ${totalGroups} 組，${totalRows} 筆資產`;

            bodyEl.innerHTML = '';
            const fragment = document.createDocumentFragment();

            groups.forEach(group => {
                const groupRow = document.createElement('tr');
                groupRow.className = 'duplicate-group-row';
                const groupCell = document.createElement('td');
                groupCell.colSpan = 6;
                groupCell.textContent = `產編：${group.assetId || '(空白)'}（${group.items.length} 筆）`;
                groupRow.appendChild(groupCell);
                fragment.appendChild(groupRow);

                group.items.forEach(asset => {
                    const row = document.createElement('tr');
                const cells = [
                    asset.assetId,
                    asset.assetName,
                    legacyGetAssetAliasDisplay(asset, ''),
                    asset.userName,
                    asset.leader,
                    asset.location
                    ];
                    cells.forEach(value => {
                        const td = document.createElement('td');
                        td.textContent = value || '';
                        row.appendChild(td);
                    });
                    fragment.appendChild(row);
                });
            });

            bodyEl.appendChild(fragment);
        }

      @keyframes fabGradient {

    <script>
    (function() {
      'use strict';

      // ===== 設定快速導航連結（僅管理員可見 FAB） =====
      // 所有 URL 皆由後端 getFabNavigationUrls() 提供（子專案 URL 定義於 env.js）。
      google.script.run
        .withSuccessHandler(function(urls) {
          if (!urls || !urls.isAdmin) return; // 非管理員不顯示 FAB
          if (urls.fabMenuEnabled === false) return; // 若設定為隱藏，也不顯示 FAB
          if (urls.ismsAssetUrl)    document.getElementById('fabLinkIsmsAsset').href = urls.ismsAssetUrl;
          if (urls.ismsConnectUrl)  document.getElementById('fabLinkIsmsConnect').href = urls.ismsConnectUrl;
          if (urls.softwareListUrl) document.getElementById('fabLinkSoftware').href = urls.softwareListUrl;
          if (urls.barcodePrintUrl) document.getElementById('fabLinkBarcodePrint').href = urls.barcodePrintUrl;
          document.getElementById('fabContainer').style.display = '';
        })
        .withFailureHandler(function() {})
        .getFabNavigationUrls();

      // ===== FAB 開關 =====
      var container = document.getElementById('fabContainer');
      var mainBtn   = document.getElementById('fabMain');
      var overlay   = document.getElementById('fabOverlay');
      var isOpen    = false;

      function toggleFab() {
        isOpen = !isOpen;
        container.classList.toggle('open', isOpen);
        overlay.classList.toggle('show', isOpen);
      }
      function closeFab() {
        if (!isOpen) return;
        isOpen = false;
        container.classList.remove('open');
        overlay.classList.remove('show');
      }

      overlay.addEventListener('click', closeFab);

      // ===== 拖曳功能 =====
      var isDragging = false;
      var hasMoved   = false;
      var startX, startY, origX, origY;
      var DRAG_THRESHOLD = 6;

      function onPointerDown(e) {
        if (e.target.closest('.fab-menu')) return;
        e.preventDefault();
        var t = e.touches ? e.touches[0] : e;
        startX = t.clientX;
        startY = t.clientY;
        origX = container.offsetLeft || 32;
        origY = container.offsetTop  || (window.innerHeight - container.offsetHeight - 32);
        container.style.left   = origX + 'px';
        container.style.top    = origY + 'px';
        container.style.right  = 'auto';
        container.style.bottom = 'auto';
        isDragging = true;
        hasMoved   = false;
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        var t = e.touches ? e.touches[0] : e;
        var dx = t.clientX - startX;
        var dy = t.clientY - startY;
        if (!hasMoved && Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
        hasMoved = true;
        mainBtn.classList.add('dragging');
        closeFab();

        var newX = origX + dx;
        var newY = origY + dy;
        var maxX = window.innerWidth  - container.offsetWidth;
        var maxY = window.innerHeight - container.offsetHeight;
        newX = Math.max(0, Math.min(newX, maxX));
        newY = Math.max(0, Math.min(newY, maxY));

        container.style.left = newX + 'px';
        container.style.top  = newY + 'px';
      }

      function onPointerUp() {
        if (!isDragging) return;
        isDragging = false;
        mainBtn.classList.remove('dragging');
        if (!hasMoved) {
          toggleFab();
        }
      }

      // 桌面
      mainBtn.addEventListener('mousedown', onPointerDown);
      document.addEventListener('mousemove', onPointerMove);
      document.addEventListener('mouseup',   onPointerUp);
      // 行動裝置
      mainBtn.addEventListener('touchstart', onPointerDown, { passive: false });
      document.addEventListener('touchmove',  onPointerMove, { passive: false });
      document.addEventListener('touchend',   onPointerUp);

      // 子按鈕點擊後自動收合
      document.querySelectorAll('.fab-nav-item').forEach(function(link) {
        link.addEventListener('click', function() {
          setTimeout(closeFab, 150);
        });
      });
    })();
    </script>
