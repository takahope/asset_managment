<!--
  alpine_model_setting.html — 設定 Modal（管理員專用）
  外殼仿 alpine_modals_asset.html 的 AddAssetModal(fixed inset-0 + 白色卡片)。
  對應後端 copilot.js 的 getCopilotSettings() / saveCopilotSettings()。
-->
<script>
document.addEventListener('alpine:init', function () {

    Alpine.data('modelSettingModal', function () {
        return {
            isLoading: true, isSubmitting: false, activeTab: 'general',
            enabled: true, provider: 'GEMINI',
            geminiModelId: '', openaiModelId: '', nvidiaModelId: '',
            reportAdminEmails: '', dataUpdateEmails: '', adminEmailNotifyEnabled: false, userEmailNotifyEnabled: true,
            groupProxyEnabled: false, inventoryFeatureEnabled: true, fabMenuEnabled: true,
            locationErrorMode: 'immediate',
            hrGroupNameMap: '',
            parsedHrGroupNameMap: {}, hrOfficialGroups: [],
            infoStationCustodianEmails: '', infoStationUserEmails: '', intakeCustodianEmails: '',
            ismsInventoryGroups: '', hrLastSyncAt: '', isSyncing: false,
            staticLocations: '', infoLocation: '', intakeLocation: '', infoComputerLocation: '',
            stationCategories: { PERMANENT: false, OUTSOURCED: false, PORTABLE: false },
            stationCandidates: [],
            stationCategoryMeta: [
                { key: 'PERMANENT', label: '常設駐站', hint: '' },
                { key: 'OUTSOURCED', label: '委外駐站', hint: '' },
                { key: 'PORTABLE', label: '行動駐站', hint: '行動駐站走出借流程，一般不需列入存置地點' }
            ],
            hrGroupSearchQuery: '',
            get filteredHrOfficialGroups() {
                if (!this.hrGroupSearchQuery) return this.hrOfficialGroups;
                var q = this.hrGroupSearchQuery.toLowerCase();
                var self = this;
                return this.hrOfficialGroups.filter(function(g) {
                    var mapped = self.parsedHrGroupNameMap[g] || '';
                    return g.toLowerCase().indexOf(q) !== -1 || mapped.toLowerCase().indexOf(q) !== -1;
                });
            },
            get mergedLocationsPreview() {
                var self = this;
                var statics = this.staticLocations.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
                var stations = this.stationCandidates
                    .filter(function (c) { return self.stationCategories[c.category]; })
                    .map(function (c) { return c.name; });
                return statics.concat(stations);
            },
            candidatesOf: function (categoryKey) {
                return this.stationCandidates.filter(function (c) { return c.category === categoryKey; });
            },
            isDangling: function (value) {
                return !!value && this.mergedLocationsPreview.indexOf(value) === -1;
            },

            auditRecordCount: 0,
            isExportingAudit: false,
            loadAuditRecordCount: function () {
                var self = this;
                google.script.run
                    .withSuccessHandler(function (count) {
                        self.auditRecordCount = count || 0;
                    })
                    .withFailureHandler(function (error) {
                        console.error('載入稽核筆數失敗：', error);
                    })
                    .getResolvedLocationErrorCount();
            },
            exportAuditRecords: function () {
                var self = this;
                if (!confirm('確定要導出並清除目前的所有已處理紀錄嗎？')) return;
                this.isExportingAudit = true;
                google.script.run
                    .withSuccessHandler(function (result) {
                        self.isExportingAudit = false;
                        if (result && result.success) {
                            alert(result.message);
                            self.auditRecordCount = 0;
                        } else {
                            alert('導出失敗：' + (result ? result.message : '未知錯誤'));
                        }
                    })
                    .withFailureHandler(function (error) {
                        self.isExportingAudit = false;
                        alert('導出發生異常：' + (error && error.message ? error.message : error));
                    })
                    .exportResolvedLocationErrors();
            },

            init: function () {
                var self = this;
                var copilotLoaded = false, systemLoaded = false;
                function maybeFinishLoading() {
                    if (copilotLoaded && systemLoaded) self.isLoading = false;
                }
                google.script.run
                    .withSuccessHandler(function (s) {
                        var settings = s || {};
                        self.enabled = settings.enabled !== false;
                        self.provider = settings.provider || 'GEMINI';
                        self.geminiModelId = settings.geminiModelId || '';
                        self.openaiModelId = settings.openaiModelId || '';
                        self.nvidiaModelId = settings.nvidiaModelId || '';
                        copilotLoaded = true;
                        maybeFinishLoading();
                    })
                    .withFailureHandler(function (error) {
                        alert('載入 AI 設定失敗：' + (error && error.message ? error.message : error));
                        self.close();
                    })
                    .getCopilotSettings();
                google.script.run
                    .withSuccessHandler(function (s) {
                        var settings = s || {};
                        self.reportAdminEmails = settings.reportAdminEmails || '';
                        self.dataUpdateEmails = settings.dataUpdateEmails || '';
                        self.adminEmailNotifyEnabled = !!settings.adminEmailNotifyEnabled;
                        self.userEmailNotifyEnabled = settings.userEmailNotifyEnabled !== false;
                        self.groupProxyEnabled = !!settings.groupProxyEnabled;
                        self.inventoryFeatureEnabled = settings.inventoryFeatureEnabled !== false;
                        self.locationErrorMode = settings.locationErrorMode === 'queue' ? 'queue' : 'immediate';
                        self.fabMenuEnabled = settings.fabMenuEnabled !== false;
                        self.hrGroupNameMap = settings.hrGroupNameMap || '';
                        try { self.parsedHrGroupNameMap = JSON.parse(self.hrGroupNameMap || '{}'); } catch(e) { self.parsedHrGroupNameMap = {}; }
                        self.hrOfficialGroups = settings.hrOfficialGroups || [];
                        self.infoStationCustodianEmails = settings.infoStationCustodianEmails || '';
                        self.infoStationUserEmails = settings.infoStationUserEmails || '';
                        self.intakeCustodianEmails = settings.intakeCustodianEmails || '';
                        self.ismsInventoryGroups = settings.ismsInventoryGroups || '';
                        self.hrLastSyncAt = settings.hrLastSyncAt || '';
                        self.staticLocations = settings.staticLocations || '';
                        var cats = String(settings.stationCategories || '').split(',');
                        self.stationCategories = {
                            PERMANENT: cats.indexOf('PERMANENT') !== -1,
                            OUTSOURCED: cats.indexOf('OUTSOURCED') !== -1,
                            PORTABLE: cats.indexOf('PORTABLE') !== -1
                        };
                        self.stationCandidates = settings.stationCandidates || [];
                        var _infoLoc = settings.infoLocation || '';
                        var _intakeLoc = settings.intakeLocation || '';
                        var _infoCompLoc = settings.infoComputerLocation || '';
                        self.$nextTick(function () {
                            self.infoLocation = _infoLoc;
                            self.intakeLocation = _intakeLoc;
                            self.infoComputerLocation = _infoCompLoc;
                        });
                        systemLoaded = true;
                        maybeFinishLoading();
                    })
                    .withFailureHandler(function (error) {
                        alert('載入系統設定失敗：' + (error && error.message ? error.message : error));
                        self.close();
                    })
                    .getSystemSettings();
            },
            close: function () { this.$store.app.showModelSettingModal = false; },
            syncFromHr: function () {
                var self = this;
                if (this.isSyncing) return;
                this.isSyncing = true;
                google.script.run
                    .withSuccessHandler(function (result) {
                        self.isSyncing = false;
                        self.hrLastSyncAt = (result && result.syncedAt) || self.hrLastSyncAt;
                        alert('HR 同步完成，寫入 ' + ((result && result.count) || 0) + ' 筆。');
                    })
                    .withFailureHandler(function (error) {
                        self.isSyncing = false;
                        alert('HR 同步失敗：' + (error && error.message ? error.message : error));
                    })
                    .manualSyncFromHr();
            },
            save: function () {
                var self = this;
                this.isSubmitting = true;
                this.hrGroupNameMap = JSON.stringify(this.parsedHrGroupNameMap);
                google.script.run
                    .withSuccessHandler(function () {
                        google.script.run
                            .withSuccessHandler(function () {
                                self.isSubmitting = false;
                                self.$store.app.applyInventoryFeatureState(self.inventoryFeatureEnabled);
                                self.$store.app.userEmailNotifyEnabled = self.userEmailNotifyEnabled;
                                self.$store.app.locationErrorMode = self.locationErrorMode;
                                self.close();
                            })
                            .withFailureHandler(function (error) {
                                self.isSubmitting = false;
                                alert('儲存系統設定失敗：' + (error && error.message ? error.message : error));
                            })
                            .saveSystemSettings({
                                reportAdminEmails: self.reportAdminEmails,
                                dataUpdateEmails: self.dataUpdateEmails,
                                adminEmailNotifyEnabled: self.adminEmailNotifyEnabled,
                                userEmailNotifyEnabled: self.userEmailNotifyEnabled,
                                groupProxyEnabled: self.groupProxyEnabled,
                                inventoryFeatureEnabled: self.inventoryFeatureEnabled,
                                locationErrorMode: self.locationErrorMode,
                                fabMenuEnabled: self.fabMenuEnabled,
                                hrGroupNameMap: self.hrGroupNameMap,
                                infoStationCustodianEmails: self.infoStationCustodianEmails,
                                infoStationUserEmails: self.infoStationUserEmails,
                                intakeCustodianEmails: self.intakeCustodianEmails,
                                ismsInventoryGroups: self.ismsInventoryGroups,
                                staticLocations: self.staticLocations,
                                stationCategories: Object.keys(self.stationCategories).filter(function (k) { return self.stationCategories[k]; }).join(','),
                                infoLocation: self.infoLocation,
                                intakeLocation: self.intakeLocation,
                                infoComputerLocation: self.infoComputerLocation
                            });
                    })
                    .withFailureHandler(function (error) {
                        self.isSubmitting = false;
                        alert('儲存失敗：' + (error && error.message ? error.message : error));
                    })
                    .saveCopilotSettings({
                        enabled: self.enabled,
                        provider: self.provider,
                        geminiModelId: self.geminiModelId,
                        openaiModelId: self.openaiModelId,
                        nvidiaModelId: self.nvidiaModelId
                    });
            }
        };
    });

});
</script>

<!-- ===== AiSettingsModal ===== -->
<template x-if="$store.app.showModelSettingModal && $store.app.isAdminView">
    <div x-data="modelSettingModal">
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
                
                <!-- Header -->
                <div class="px-6 py-4 border-b bg-slate-50 flex justify-between items-center shrink-0">
                    <h3 class="text-lg font-bold text-slate-800">
                        <i class="fa-solid fa-cog mr-2 text-slate-500"></i>系統與環境設定
                    </h3>
                    <button @click="close()" :disabled="isSubmitting" class="text-slate-500 hover:text-slate-700 transition-colors disabled:opacity-50">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>

                <!-- Body (Sidebar + Content) -->
                <div class="flex flex-1 overflow-hidden min-h-[500px]">
                    
                    <!-- Left Sidebar Navigation -->
                    <div class="w-56 lg:w-64 border-r border-slate-200 bg-slate-50 flex-shrink-0 overflow-y-auto">
                        <nav class="p-4 space-y-1">
                            <button @click="activeTab = 'general'" 
                                    :class="activeTab === 'general' ? 'bg-blue-100 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'" 
                                    class="w-full text-left px-3 py-2 rounded-lg transition-colors flex items-center text-sm">
                                <i class="fa-solid fa-sliders w-6 text-center mr-2" :class="activeTab === 'general' ? 'text-blue-600' : 'text-slate-400'"></i>
                                一般設定
                            </button>
                            <button @click="activeTab = 'notifications'" 
                                    :class="activeTab === 'notifications' ? 'bg-blue-100 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'" 
                                    class="w-full text-left px-3 py-2 rounded-lg transition-colors flex items-center text-sm">
                                <i class="fa-solid fa-bell w-6 text-center mr-2" :class="activeTab === 'notifications' ? 'text-blue-600' : 'text-slate-400'"></i>
                                通知與權限
                            </button>
                            <button @click="activeTab = 'ai'" 
                                    :class="activeTab === 'ai' ? 'bg-blue-100 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'" 
                                    class="w-full text-left px-3 py-2 rounded-lg transition-colors flex items-center text-sm">
                                <i class="fa-solid fa-robot w-6 text-center mr-2" :class="activeTab === 'ai' ? 'text-blue-600' : 'text-slate-400'"></i>
                                AI 助理
                            </button>
                            <button @click="activeTab = 'hr'" 
                                    :class="activeTab === 'hr' ? 'bg-blue-100 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'" 
                                    class="w-full text-left px-3 py-2 rounded-lg transition-colors flex items-center text-sm">
                                <i class="fa-solid fa-people-arrows w-6 text-center mr-2" :class="activeTab === 'hr' ? 'text-blue-600' : 'text-slate-400'"></i>
                                HR 同步
                            </button>
                            <button @click="activeTab = 'locations'" 
                                    :class="activeTab === 'locations' ? 'bg-blue-100 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'" 
                                    class="w-full text-left px-3 py-2 rounded-lg transition-colors flex items-center text-sm">
                                <i class="fa-solid fa-location-dot w-6 text-center mr-2" :class="activeTab === 'locations' ? 'text-blue-600' : 'text-slate-400'"></i>
                                地點管理
                            </button>
                            <button @click="activeTab = 'audit'; loadAuditRecordCount();" 
                                    :class="activeTab === 'audit' ? 'bg-blue-100 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'" 
                                    class="w-full text-left px-3 py-2 rounded-lg transition-colors flex items-center text-sm">
                                <i class="fa-solid fa-clipboard-check w-6 text-center mr-2" :class="activeTab === 'audit' ? 'text-blue-600' : 'text-slate-400'"></i>
                                財產稽核
                            </button>
                        </nav>
                    </div>

                    <!-- Right Content Area -->
                    <div class="flex-1 overflow-y-auto bg-white relative">
                        <template x-if="isLoading">
                            <div class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10 gap-4">
                                <i class="fas fa-spinner fa-spin text-4xl text-slate-400"></i>
                                <p class="text-slate-500 font-medium">載入設定中...</p>
                            </div>
                        </template>

                        <div class="p-6 h-full" x-show="!isLoading">
                            
                            <!-- 1. 一般設定 (General) -->
                            <div x-show="activeTab === 'general'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-5" style="display: none;">
                                <h4 class="text-base font-bold text-slate-800 border-b pb-2 mb-4"><i class="fa-solid fa-sliders mr-2 text-slate-400"></i>一般設定</h4>
                                
                                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200 hover:border-slate-300 transition-colors">
                                    <span class="text-sm font-medium text-slate-700">顯示懸浮按鈕 (FAB)</span>
                                    <button type="button" role="switch" :aria-checked="!!fabMenuEnabled" @click="fabMenuEnabled = !fabMenuEnabled"
                                            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
                                            :class="fabMenuEnabled ? 'bg-blue-500' : 'bg-slate-300'" aria-label="切換顯示懸浮按鈕">
                                        <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                                              :class="fabMenuEnabled ? 'translate-x-6' : 'translate-x-1'"></span>
                                    </button>
                                </div>
                                
                                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200 hover:border-slate-300 transition-colors">
                                    <span class="text-sm font-medium text-slate-700">盤點功能</span>
                                    <button type="button" role="switch" :aria-checked="!!inventoryFeatureEnabled" @click="inventoryFeatureEnabled = !inventoryFeatureEnabled"
                                            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
                                            :class="inventoryFeatureEnabled ? 'bg-blue-500' : 'bg-slate-300'" aria-label="切換盤點功能">
                                        <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                                              :class="inventoryFeatureEnabled ? 'translate-x-6' : 'translate-x-1'"></span>
                                    </button>
                                </div>

                                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200 hover:border-slate-300 transition-colors">
                                    <div>
                                        <span class="text-sm font-medium text-slate-700 block">同組資產可見</span>
                                        <span class="text-xs text-slate-500 block mt-0.5">允許檢視同組成員的資產設備</span>
                                    </div>
                                    <button type="button" role="switch" :aria-checked="!!groupProxyEnabled" @click="groupProxyEnabled = !groupProxyEnabled"
                                            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
                                            :class="groupProxyEnabled ? 'bg-blue-500' : 'bg-slate-300'" aria-label="切換同組資產可見狀態">
                                        <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                                              :class="groupProxyEnabled ? 'translate-x-6' : 'translate-x-1'"></span>
                                    </button>
                                </div>
                            </div>

                            <!-- 2. 通知與權限 (Notifications) -->
                            <div x-show="activeTab === 'notifications'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-5" style="display: none;">
                                <h4 class="text-base font-bold text-slate-800 border-b pb-2 mb-4"><i class="fa-solid fa-bell mr-2 text-slate-400"></i>通知與信箱設定</h4>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200">
                                        <span class="text-sm font-medium text-slate-700">管理員通知信</span>
                                        <button type="button" role="switch" :aria-checked="!!adminEmailNotifyEnabled" @click="adminEmailNotifyEnabled = !adminEmailNotifyEnabled"
                                                class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
                                                :class="adminEmailNotifyEnabled ? 'bg-blue-500' : 'bg-slate-300'" aria-label="切換管理員通知信">
                                            <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                                                  :class="adminEmailNotifyEnabled ? 'translate-x-6' : 'translate-x-1'"></span>
                                        </button>
                                    </div>

                                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200">
                                        <span class="text-sm font-medium text-slate-700">一般使用者通知信</span>
                                        <button type="button" role="switch" :aria-checked="!!userEmailNotifyEnabled" @click="userEmailNotifyEnabled = !userEmailNotifyEnabled"
                                                class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
                                                :class="userEmailNotifyEnabled ? 'bg-blue-500' : 'bg-slate-300'" aria-label="切換一般使用者通知信">
                                            <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                                                  :class="userEmailNotifyEnabled ? 'translate-x-6' : 'translate-x-1'"></span>
                                        </button>
                                    </div>
                                </div>

                                <div class="space-y-4 pt-2">
                                    <label class="block">
                                        <span class="text-sm font-medium text-slate-700 block mb-1">資料更新承辦窗口 Email (多筆請用逗號分隔)</span>
                                        <input type="text" x-model="dataUpdateEmails" placeholder="example1@company.com, example2@company.com"
                                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                        <p class="mt-1 text-xs text-slate-500">系統發出的轉移或報廢等異動通知，將統一寄給此名單。設定在此名單的人員將自動具有與管理員相同的系統操作權限。</p>
                                    </label>

                                    <label class="block">
                                        <span class="text-sm font-medium text-slate-700 block mb-1">電腦回報管理員 Email</span>
                                        <textarea x-model="reportAdminEmails" rows="2" placeholder="多筆以逗號或換行分隔"
                                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                                        <p class="text-xs text-amber-600 mt-1">⚠ 「電腦回報」子系統為獨立專案，此處儲存僅影響本系統；電腦回報通知收件人需另在該專案指令碼屬性設定。</p>
                                    </label>

                                    <label class="block">
                                        <span class="text-sm font-medium text-slate-700 block mb-1">資訊組駐站資產保管人 Email</span>
                                        <textarea x-model="infoStationCustodianEmails" rows="2" placeholder="多筆以逗號分隔"
                                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                                    </label>

                                    <label class="block">
                                        <span class="text-sm font-medium text-slate-700 block mb-1">資訊組駐站資產使用人 Email</span>
                                        <textarea x-model="infoStationUserEmails" rows="2" placeholder="多筆以逗號分隔"
                                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                                    </label>

                                    <label class="block">
                                        <span class="text-sm font-medium text-slate-700 block mb-1">駐站轉中心收案組保管＆使用人 Email</span>
                                        <textarea x-model="intakeCustodianEmails" rows="2" placeholder="多筆以逗號分隔"
                                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                                    </label>

                                    <label class="block">
                                        <span class="text-sm font-medium text-slate-700 block mb-1">ISMS 盤點組別</span>
                                        <input type="text" x-model="ismsInventoryGroups" placeholder="多筆以逗號分隔"
                                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    </label>
                                </div>
                            </div>

                            <!-- 3. AI 助理 (AI Assistant) -->
                            <div x-show="activeTab === 'ai'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-5" style="display: none;">
                                <h4 class="text-base font-bold text-slate-800 border-b pb-2 mb-4"><i class="fa-solid fa-robot mr-2 text-slate-400"></i>AI 助理設定</h4>

                                <div class="flex items-center justify-between p-4 bg-blue-50 rounded-lg border border-blue-100">
                                    <div>
                                        <span class="text-sm font-bold text-blue-900 block">啟用智慧導覽助理</span>
                                        <span class="text-xs text-blue-700 block mt-0.5">提供使用者系統操作指引與問答</span>
                                    </div>
                                    <button type="button" role="switch" :aria-checked="!!enabled" @click="enabled = !enabled"
                                            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
                                            :class="enabled ? 'bg-blue-600' : 'bg-slate-300'" aria-label="切換智慧導覽助理">
                                        <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                                              :class="enabled ? 'translate-x-6' : 'translate-x-1'"></span>
                                    </button>
                                </div>

                                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                                    <div>
                                        <label class="block text-sm font-bold text-slate-700 mb-1">模型供應商</label>

                                            <option value="OPENAI">OpenAI (ChatGPT)</option>
                                            <option value="NVIDIA">NVIDIA AI</option>
                                        </select>

                                            切換供應商前，請先請系統管理員在 Apps Script 編輯器的「指令碼屬性」新增對應的 API Key。

                                    </div>

                                    <div class="space-y-3 pt-2">

                                                   class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                                        </label>
                                        <label class="block">
                                            <span class="text-xs font-semibold text-slate-600">OPENAI_MODEL_ID <span class="font-normal text-slate-400">（預設：gpt-4o-mini）</span></span>
                                            <input type="text" x-model="openaiModelId" placeholder="gpt-4o-mini"
                                                   class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                                        </label>
                                        <label class="block">
                                            <span class="text-xs font-semibold text-slate-600">NVIDIA_MODEL_ID <span class="font-normal text-slate-400">（預設：meta/llama-3.1-70b-instruct）</span></span>
                                            <input type="text" x-model="nvidiaModelId" placeholder="meta/llama-3.1-70b-instruct"
                                                   class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                                            <p class="text-xs text-slate-400 mt-1">需為支援 chat/completions 的 NIM 模型</p>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- 4. HR 同步 (HR Sync) -->
                            <div x-show="activeTab === 'hr'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-5" style="display: none;">
                                <div class="flex items-center justify-between border-b pb-2 mb-4">
                                    <h4 class="text-base font-bold text-slate-800"><i class="fa-solid fa-people-group mr-2 text-slate-400"></i>人員資料來源（HR）</h4>
                                    <button type="button" @click="syncFromHr()" :disabled="isSyncing || isSubmitting"
                                            class="px-3 py-1 text-xs font-medium rounded-md bg-slate-700 text-white hover:bg-slate-800 transition-colors disabled:opacity-50 shadow-sm flex items-center">
                                        <i class="fa-solid fa-rotate mr-1" :class="isSyncing ? 'fa-spin' : ''"></i><span x-text="isSyncing ? '同步中...' : '立即從 HR 同步'"></span>
                                    </button>
                                </div>

                                <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 flex items-start gap-3">
                                    <i class="fa-solid fa-circle-info text-blue-500 mt-0.5"></i>
                                    <div class="text-xs text-blue-800 space-y-1">
                                        <p>保管人與組別資料由 HR 主表單向同步。此區清單為主專案不再讀取「保管人/信箱」工作表後的角色設定來源。</p>
                                        <p class="font-medium" x-text="hrLastSyncAt ? '上次同步時間：' + hrLastSyncAt.replace('T', ' ').slice(0, 16) : '尚未進行過同步'"></p>
                                    </div>
                                </div>

                                <div class="space-y-2">
                                    <span class="text-sm font-bold text-slate-700 block">組別名稱轉換表</span>
                                    <p class="text-xs text-slate-500 mb-2">對應 HR 組織名稱為系統內顯示名稱。若右側留白，則預設使用 HR 原名稱。</p>
                                    
                                    <template x-if="hrOfficialGroups.length === 0">
                                        <div class="text-sm text-amber-700 bg-amber-50 p-4 rounded-lg border border-amber-200 flex items-center">
                                            <i class="fa-solid fa-triangle-exclamation mr-3 text-amber-500 text-lg"></i>
                                            <div>
                                                <p class="font-bold">無法取得 HR 組織架構</p>
                                                <p class="text-xs mt-1">請確認 HR 主表讀取權限。您仍可使用下方進階設定手動輸入 JSON。</p>
                                            </div>
                                        </div>
                                    </template>
                                    
                                    <template x-if="hrOfficialGroups.length > 0">
                                        <div class="relative mb-3">
                                            <i class="fa-solid fa-search text-slate-400 text-sm absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                                            <input type="text" x-model="hrGroupSearchQuery" placeholder="搜尋官方名稱或已設定名稱..."
                                                   class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                                        </div>
                                    </template>
                                    
                                    <div class="max-h-[300px] overflow-y-auto border border-slate-200 rounded-lg bg-slate-50 divide-y divide-slate-200">
                                        <template x-for="hrGroup in filteredHrOfficialGroups" :key="hrGroup">
                                            <div class="flex items-center px-4 py-2 hover:bg-white transition-colors">
                                                <div class="w-1/2 text-sm text-slate-700 font-medium truncate pr-3" x-text="hrGroup" :title="hrGroup"></div>
                                                <div class="w-1/2 flex items-center">
                                                    <i class="fa-solid fa-arrow-right-long text-slate-400 mx-3"></i>
                                                    <input type="text" x-model="parsedHrGroupNameMap[hrGroup]" :placeholder="hrGroup"
                                                           class="w-full px-3 py-1 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                    
                                    <details class="mt-4 bg-slate-50 border border-slate-200 rounded-lg overflow-hidden">
                                        <summary class="px-4 py-2 text-xs font-semibold text-slate-600 cursor-pointer hover:bg-slate-100 outline-none select-none">
                                            <i class="fa-solid fa-code mr-1"></i>進階：編輯原始 JSON
                                        </summary>
                                        <div class="p-3 border-t border-slate-200 bg-white">
                                            <textarea :value="JSON.stringify(parsedHrGroupNameMap, null, 2)" @input="try { parsedHrGroupNameMap = JSON.parse($event.target.value); } catch(e){}" rows="5"
                                                      class="w-full px-3 py-2 border border-slate-300 rounded bg-slate-50 text-xs font-mono focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                                        </div>
                                    </details>
                                </div>
                            </div>

                            <!-- 5. 地點管理 (Locations) -->
                            <div x-show="activeTab === 'locations'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-5" style="display: none;">
                                <h4 class="text-base font-bold text-slate-800 border-b pb-2 mb-4"><i class="fa-solid fa-location-dot mr-2 text-slate-400"></i>存置地點與分派</h4>

                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    
                                    <!-- 靜態地點設定 -->
                                    <div class="space-y-4">
                                        <div>
                                            <label class="block text-sm font-bold text-slate-700 mb-1">靜態地點</label>
                                            <p class="text-xs text-slate-500 mb-2">一行一個，將依填寫順序顯示於下拉選單前端。</p>
                                            <textarea x-model="staticLocations" rows="6" placeholder="例：中心八樓&#10;中心九樓"
                                                      class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"></textarea>
                                        </div>

                                        <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
                                            <span class="text-xs font-bold text-slate-600 block mb-2"><i class="fa-solid fa-list-ol mr-1"></i>合併清單預覽</span>
                                            <div class="flex flex-wrap gap-1 max-h-32 overflow-y-auto">
                                                <template x-for="(loc, idx) in mergedLocationsPreview" :key="loc + '-' + idx">
                                                    <span class="px-2 py-1 text-xs rounded bg-white border border-slate-200 text-slate-700 font-medium" x-text="loc"></span>
                                                </template>
                                                <span class="text-xs text-slate-400 italic py-1" x-show="mergedLocationsPreview.length === 0">尚未設定任何地點</span>
                                            </div>
                                            <p class="text-xs text-slate-400 mt-2">使用者介面下拉順序為：靜態地點在前、駐站地點在後。</p>
                                        </div>
                                    </div>

                                    <!-- 駐站與目標地點設定 -->
                                    <div class="space-y-5">
                                        <div class="space-y-3">
                                            <div>
                                                <span class="text-sm font-bold text-slate-700 block mb-1">駐站來源自動匯入</span>
                                                <p class="text-xs text-slate-500 mb-2">依 HR 組織架構自動同步，可依類別開關是否納入存置地點選單。</p>
                                            </div>
                                            
                                            <template x-for="meta in stationCategoryMeta" :key="meta.key">
                                                <div class="p-3 bg-white rounded-lg border border-slate-200 shadow-sm">
                                                    <div class="flex items-center justify-between">
                                                        <span class="text-sm font-medium text-slate-700">
                                                            <span x-text="meta.label"></span>
                                                            <span class="text-slate-400 text-xs ml-1 bg-slate-100 px-1.5 py-0.5 rounded-full" x-text="candidatesOf(meta.key).length + ' 站'"></span>
                                                        </span>
                                                        <button type="button" role="switch" :aria-checked="!!stationCategories[meta.key]"
                                                                @click="stationCategories[meta.key] = !stationCategories[meta.key]"
                                                                class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
                                                                :class="stationCategories[meta.key] ? 'bg-blue-500' : 'bg-slate-300'">
                                                            <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                                                                  :class="stationCategories[meta.key] ? 'translate-x-6' : 'translate-x-1'"></span>
                                                        </button>
                                                    </div>
                                                    <p class="text-xs text-amber-600 mt-1.5" x-show="meta.hint" x-text="meta.hint"></p>
                                                    
                                                    <details class="mt-2" x-show="candidatesOf(meta.key).length > 0">
                                                        <summary class="text-xs text-slate-500 cursor-pointer hover:text-slate-700 outline-none select-none">檢視包含的駐站名單</summary>
                                                        <div class="mt-1.5 p-2 bg-slate-50 rounded border border-slate-100 max-h-24 overflow-y-auto">
                                                            <ul class="text-xs text-slate-600 space-y-1">
                                                                <template x-for="c in candidatesOf(meta.key)" :key="c.code">
                                                                    <li class="flex items-center"><i class="fa-solid fa-caret-right text-slate-300 mr-1"></i><span x-text="c.name"></span> <span class="text-slate-400 ml-1" x-text="'(' + c.code + ')'"></span></li>
                                                                </template>
                                                            </ul>
                                                        </div>
                                                    </details>
                                                </div>
                                            </template>
                                            
                                            <template x-if="stationCandidates.length === 0">
                                                <div class="text-xs text-amber-700 bg-amber-50 p-3 rounded-lg border border-amber-200">
                                                    目前無法取得 HR 駐站清單，駐站相關設定暫不可用。
                                                </div>
                                            </template>
                                        </div>

                                        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                                            <h5 class="text-sm font-bold text-slate-700">自動分派目標地點</h5>
                                            
                                            <label class="block">
                                                <span class="text-xs font-semibold text-slate-600 block mb-1">駐站轉「資訊組」目標</span>
                                                <select x-model="infoLocation"
                                                        class="w-full px-3 py-1 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
                                                        :class="isDangling(infoLocation) ? 'border-amber-400 bg-amber-50' : 'border-slate-300'">
                                                    <option value="">（未設定）</option>
                                                    <template x-if="isDangling(infoLocation)"><option :value="infoLocation" x-text="infoLocation + '（已不在清單）'"></option></template>
                                                    <template x-for="loc in mergedLocationsPreview" :key="loc"><option :value="loc" x-text="loc"></option></template>
                                                </select>
                                                <p class="text-xs text-amber-600 mt-1" x-show="isDangling(infoLocation)">⚠ 此地點不在目前合併清單中，儲存會被拒絕。</p>
                                            </label>

                                            <label class="block">
                                                <span class="text-xs font-semibold text-slate-600 block mb-1">駐站轉「中心收案組」目標</span>

                                                        class="w-full px-3 py-1 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
                                                        :class="isDangling(intakeLocation) ? 'border-amber-400 bg-amber-50' : 'border-slate-300'">
                                                    <option value="">（未設定）</option>
                                                    <template x-if="isDangling(intakeLocation)"><option :value="intakeLocation" x-text="intakeLocation + '（已不在清單）'"></option></template>
                                                    <template x-for="loc in mergedLocationsPreview" :key="loc"><option :value="loc" x-text="loc"></option></template>
                                                </select>
                                                <p class="text-xs text-amber-600 mt-1" x-show="isDangling(intakeLocation)">⚠ 此地點不在目前合併清單中，儲存會被拒絕。</p>
                                            </label>

                                            <label class="block">
                                                <span class="text-xs font-semibold text-slate-600 block mb-1">資訊組「電腦」專用地點</span>
                                                <select x-model="infoComputerLocation"
                                                        class="w-full px-3 py-1 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
                                                        :class="isDangling(infoComputerLocation) ? 'border-amber-400 bg-amber-50' : 'border-slate-300'">
                                                    <option value="">（未設定）</option>
                                                    <template x-if="isDangling(infoComputerLocation)"><option :value="infoComputerLocation" x-text="infoComputerLocation + '（已不在清單）'"></option></template>
                                                    <template x-for="loc in mergedLocationsPreview" :key="loc"><option :value="loc" x-text="loc"></option></template>
                                                </select>
                                                <p class="text-xs text-amber-600 mt-1" x-show="isDangling(infoComputerLocation)">⚠ 此地點不在目前合併清單中，儲存會被拒絕。</p>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 6. 財產稽核 (Audit) -->
                            <div x-show="activeTab === 'audit'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-5" style="display: none;">
                                <h4 class="text-base font-bold text-slate-800 border-b pb-2 mb-4"><i class="fa-solid fa-clipboard-check mr-2 text-slate-400"></i>財產稽核紀錄</h4>
                                
                                <div class="mb-6 p-4 bg-slate-50 rounded-lg border border-slate-200">
                                    <label class="block text-sm font-medium text-slate-700 mb-1">位置有誤執行模式</label>
                                    <select x-model="locationErrorMode"
                                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                                        <option value="immediate">立即執行（點按鈕即寄信/紀錄）</option>
                                        <option value="queue">加入購物車（批次送出時處理）</option>
                                    </select>
                                    <p class="mt-1 text-xs text-slate-500">控制資產動作面板中「位置有誤」按鈕的行為。</p>
                                </div>

                                <div class="bg-blue-50 text-blue-800 p-4 rounded-lg text-sm mb-6 flex items-start gap-3">
                                    <i class="fa-solid fa-circle-info mt-0.5"></i>
                                    <div>
                                        <p class="font-bold mb-1">位置有誤處理紀錄</p>
                                        <p class="opacity-90 leading-relaxed">當使用者針對位置有誤的財產點擊「已處理」後，系統會在此暫存紀錄。請定期點擊下方按鈕將紀錄匯出至後端 Google Sheet 的「財產稽核紀錄」工作表中，匯出完成後會自動釋放暫存空間。</p>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between p-5 border border-slate-200 rounded-xl bg-white shadow-sm">
                                    <div class="flex flex-col">
                                        <span class="text-slate-500 text-sm font-medium">目前待匯出的紀錄筆數</span>
                                        <div class="text-3xl font-bold text-slate-800 mt-1" x-text="auditRecordCount"></div>
                                    </div>
                                    <button type="button" 
                                            @click="exportAuditRecords()" 
                                            :disabled="isExportingAudit || auditRecordCount === 0"
                                            class="px-5 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:bg-slate-300 disabled:cursor-not-allowed flex items-center font-medium shadow-sm">
                                        <template x-if="isExportingAudit">
                                            <i class="fa-solid fa-spinner fa-spin mr-2"></i>
                                        </template>
                                        <template x-if="!isExportingAudit">
                                            <i class="fa-solid fa-file-export mr-2"></i>
                                        </template>
                                        <span x-text="isExportingAudit ? '導出中...' : '導出至 Sheet 並清除紀錄'"></span>
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Footer -->
                <div class="px-6 py-4 border-t bg-slate-50 flex justify-end gap-3 shrink-0">
                    <button @click="close()" :disabled="isSubmitting" class="px-4 py-2 text-slate-600 font-medium hover:bg-slate-200 rounded-lg transition-colors disabled:opacity-50">
                        取消
                    </button>
                    <button @click="save()" :disabled="isSubmitting || isLoading" class="px-5 py-2 bg-blue-600 font-medium text-white rounded-lg hover:bg-blue-700 shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                        <template x-if="isSubmitting"><span class="flex items-center gap-2"><span class="inline-block animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span><span>儲存中...</span></span></template>
                        <template x-if="!isSubmitting"><span class="flex items-center gap-2"><i class="fas fa-check"></i><span>儲存設定</span></span></template>
                    </button>
                </div>

            </div>
        </div>
    </div>
</template>
