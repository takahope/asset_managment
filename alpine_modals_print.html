<script>
document.addEventListener('alpine:init', function () {
    var S = window.AppShared;

    /* ===== TransferringModal(舊頁 6949-7325) ===== */
    Alpine.data('transferringModal', function () {
        return {
            selectedAssetIds: [], selectAll: false, isSubmitting: false,
            filters: { newKeeper: '', search: '' },

            init: function () {
                var self = this;
                this.$watch('assets', function () { self.selectedAssetIds = []; self.selectAll = false; });
            },
            get assets() { return this.$store.app.transferringAssets; },
            get isLoading() { return this.$store.app.isLoadingTransferring; },
            get filteredAssets() {
                var assets = this.assets;
                var f = this.filters;
                if (!assets) return [];
                return assets.filter(function (asset) {
                    var matchNewKeeper = !f.newKeeper || asset.newKeeper === f.newKeeper;
                    var kw = (f.search || '').toUpperCase();
                    var matchSearch = !kw ||
                        asset.assetId.toUpperCase().indexOf(kw) !== -1 ||
                        (asset.assetName && asset.assetName.toUpperCase().indexOf(kw) !== -1) ||
                        S.getAssetAliasValue(asset).toUpperCase().indexOf(kw) !== -1 ||
                        (asset.newKeeper && asset.newKeeper.toUpperCase().indexOf(kw) !== -1) ||
                        (asset.newLocation && asset.newLocation.toUpperCase().indexOf(kw) !== -1);
                    return matchNewKeeper && matchSearch;
                });
            },
            get uniqueNewKeepers() {
                var assets = this.assets;
                if (!assets) return [];
                var set = {};
                assets.forEach(function (a) { if (a.newKeeper) set[a.newKeeper] = true; });
                return Object.keys(set).sort();
            },
            handleSelectAll: function (checked) {
                this.selectAll = checked;
                this.selectedAssetIds = checked ? this.filteredAssets.map(function (a) { return a.assetId; }) : [];
            },
            handleCheckboxChange: function (assetId) {
                var idx = this.selectedAssetIds.indexOf(assetId);
                if (idx !== -1) {
                    this.selectedAssetIds = this.selectedAssetIds.filter(function (id) { return id !== assetId; });
                    if (this.filteredAssets && this.selectedAssetIds.length < this.filteredAssets.length) this.selectAll = false;
                } else {
                    this.selectedAssetIds = this.selectedAssetIds.concat([assetId]);
                    if (this.filteredAssets && this.selectedAssetIds.length === this.filteredAssets.length) this.selectAll = true;
                }
            },
            keeperHasChange: function (a) { return a.newKeeper && a.oldKeeper !== a.newKeeper; },
            oldUser: function (a) { return a.oldUser || a.userName || ''; },
            userHasChange: function (a) { var newUser = a.newUser || ''; return newUser && this.oldUser(a) !== newUser; },
            locationHasChange: function (a) { return a.newLocation && a.oldLocation !== a.newLocation; },
            transferTypeLabel: function (a) {
                var t = a.transferType || '地點';
                if (t.indexOf('保管人') !== -1 && t.indexOf('使用人') !== -1) return '保管人+使用人';
                if (t.indexOf('保管人') !== -1) return '保管人';
                if (t.indexOf('使用人') !== -1) return '使用人';
                return '地點';
            },
            transferTypeClass: function (a) {
                var t = a.transferType || '地點';
                if (t.indexOf('保管人') !== -1 && t.indexOf('使用人') !== -1) return 'bg-red-100 text-red-800';
                if (t.indexOf('保管人') !== -1) return 'bg-yellow-100 text-yellow-800';
                if (t.indexOf('使用人') !== -1) return 'bg-sky-100 text-sky-800';
                return 'bg-slate-100 text-slate-800';
            },
            handleCancelTransfer: function () {
                var self = this;
                if (this.selectedAssetIds.length === 0) { alert('請至少勾選一筆要取消的項目。'); return; }
                if (!confirm('確定要取消所選的 ' + this.selectedAssetIds.length + ' 筆轉移申請嗎？\n\n⚠️ 取消後資產狀態將恢復為「在庫」。')) return;
                this.isSubmitting = true;
                showToastProgress('正在處理取消作業...');
                var successCount = 0, failCount = 0, errorMessages = [];
                var ids = this.selectedAssetIds;
                var processNext = function (index) {
                    if (index >= ids.length) {
                        hideToastProgress('取消完成！', 300);
                        self.isSubmitting = false;
                        var message = '取消完成！\n成功：' + successCount + ' 筆';
                        if (failCount > 0) {
                            message += '\n失敗：' + failCount + ' 筆';
                            if (errorMessages.length > 0) {
                                message += '\n\n失敗原因：\n' + errorMessages.slice(0, 3).join('\n');
                                if (errorMessages.length > 3) message += '\n...及其他 ' + (errorMessages.length - 3) + ' 項';
                            }
                        }
                        alert(message);
                        if (successCount > 0) self.$store.app.handleCancelTransferSuccess();
                        return;
                    }
                    google.script.run
                        .withSuccessHandler(function (result) {
                            if (result.success) successCount++;
                            else { failCount++; errorMessages.push(ids[index] + ': ' + (result.error || '未知錯誤')); }
                            processNext(index + 1);
                        })
                        .withFailureHandler(function (error) {
                            failCount++; errorMessages.push(ids[index] + ': ' + (error.message || '未知錯誤'));
                            processNext(index + 1);
                        })
                        .cancelTransferOrScrap(ids[index]);
                };
                processNext(0);
            }
        };
    });

    /* ===== LentAssetsModal(舊頁 7590-7959) ===== */
    Alpine.data('lentAssetsModal', function () {
        return {
            selectedLendIds: [], selectAll: false, isSubmitting: false,
            filters: { location: '', startDate: '', endDate: '', overdueOnly: '', search: '' },
            visibleColumns: {
                assetId: true, assetName: true, assetAlias: true, modelBrand: true,
                keeperName: true, userName: false, lenderName: false, borrower: true,
                expectedReturnDate: true, originalLocation: false, lendingLocation: true, reason: true
            },
            sortCol: null,
            sortDir: null,
            toggleSort: function(colId) {
                if (this.sortCol === colId) {
                    if (this.sortDir === 'asc') {
                        this.sortDir = 'desc';
                    } else if (this.sortDir === 'desc') {
                        this.sortDir = null;
                        this.sortCol = null;
                    }
                } else {
                    this.sortCol = colId;
                    this.sortDir = 'asc';
                }
            },

            init: function () {
                var self = this;
                this.$watch('lentAssetsDetails', function () { self.selectedLendIds = []; self.selectAll = false; });
            },
            get lentAssetsDetails() { return this.$store.app.lentAssetsDetails; },
            get isLoading() { return this.$store.app.isLoadingLentDetails; },
            get filteredAssets() {
                var d = this.lentAssetsDetails;
                var f = this.filters;
                if (!d) return [];
                var filtered = d.filter(function (asset) {
                    var matchLocation = !f.location || asset.lendingLocation === f.location;
                    var returnDate = new Date(asset.expectedReturnDate);
                    var matchDateRange = (!f.startDate || returnDate >= new Date(f.startDate)) && (!f.endDate || returnDate <= new Date(f.endDate));
                    var matchOverdue = true;
                    if (f.overdueOnly === 'overdue' || f.overdueOnly === 'notOverdue') {
                        var today = new Date(); today.setHours(0, 0, 0, 0);
                        var assetReturnDate = new Date(asset.expectedReturnDate); assetReturnDate.setHours(0, 0, 0, 0);
                        var isOverdue = assetReturnDate < today;
                        matchOverdue = f.overdueOnly === 'overdue' ? isOverdue : !isOverdue;
                    }
                    var kw = (f.search || '').toUpperCase();
                    var matchSearch = !kw ||
                        asset.assetId.toUpperCase().indexOf(kw) !== -1 ||
                        S.getAssetAliasValue(asset).toUpperCase().indexOf(kw) !== -1 ||
                        (asset.borrower && asset.borrower.toUpperCase().indexOf(kw) !== -1) ||
                        (asset.reason && asset.reason.toUpperCase().indexOf(kw) !== -1) ||
                        (asset.keeperName && asset.keeperName.toUpperCase().indexOf(kw) !== -1) ||
                        (asset.userName && asset.userName.toUpperCase().indexOf(kw) !== -1) ||
                        (asset.lenderName && asset.lenderName.toUpperCase().indexOf(kw) !== -1);
                    return matchLocation && matchDateRange && matchOverdue && matchSearch;
                });

                if (this.sortCol && this.sortDir) {
                    var colId = this.sortCol;
                    var dir = this.sortDir;
                    filtered.sort(function(a, b) {
                        var valA = String(a[colId] || '');
                        var valB = String(b[colId] || '');
                        return dir === 'asc' 
                            ? valA.localeCompare(valB, 'zh-TW') 
                            : valB.localeCompare(valA, 'zh-TW');
                    });
                }
                return filtered;
            },
            get uniqueLocations() {
                var d = this.lentAssetsDetails;
                if (!d) return [];
                var set = {};
                d.forEach(function (a) { if (a.lendingLocation) set[a.lendingLocation] = true; });
                return Object.keys(set).sort();
            },
            isOverdue: function (asset) {
                var today = new Date(); today.setHours(0, 0, 0, 0);
                var returnDate = new Date(asset.expectedReturnDate); returnDate.setHours(0, 0, 0, 0);
                return returnDate < today;
            },
            handleSelectAll: function (checked) {
                this.selectAll = checked;
                this.selectedLendIds = checked ? this.filteredAssets.map(function (a) { return a.lendId; }) : [];
            },
            handleCheckboxChange: function (lendId) {
                var idx = this.selectedLendIds.indexOf(lendId);
                if (idx !== -1) {
                    this.selectedLendIds = this.selectedLendIds.filter(function (id) { return id !== lendId; });
                    if (this.filteredAssets && this.selectedLendIds.length < this.filteredAssets.length) this.selectAll = false;
                } else {
                    this.selectedLendIds = this.selectedLendIds.concat([lendId]);
                    if (this.filteredAssets && this.selectedLendIds.length === this.filteredAssets.length) this.selectAll = true;
                }
            },
            handleSubmitReturn: function () {
                var self = this;
                if (this.selectedLendIds.length === 0) { alert('請至少勾選一筆要歸還的項目。'); return; }
                if (!confirm('確定要歸還所選的 ' + this.selectedLendIds.length + ' 筆資產嗎？\n\n⚠️ 請確認此資產已歸還至原存放地點。')) return;
                this.isSubmitting = true;
                showToastProgress('正在處理歸還作業...');
                google.script.run
                    .withSuccessHandler(function (message) {
                        hideToastProgress('歸還完成！', 300);
                        setTimeout(function () {
                            alert(message);
                            self.isSubmitting = false;
                            self.$store.app.handleReturnSuccess();
                        }, 400);
                    })
                    .withFailureHandler(function (error) {
                        hideToastProgress('歸還失敗！', 300);
                        self.isSubmitting = false;
                        alert('歸還失敗：' + error.message);
                    })
                    .processBatchReturn(this.selectedLendIds);
            }
        };
    });

    /* ===== ScrapPrintModal(舊頁 7961-8551) ===== */
    Alpine.data('scrapPrintModal', function () {
        return {
            selectedCategory: '財產', selectedIds: [], selectAll: false, isGenerating: false,
            activeTab: 'pending',
            historyFiles: [], isLoadingHistory: false,
            startDate: '', endDate: '', previewAssets: [], isLoadingPreview: false, isGeneratingByDate: false,

            init: function () {
                var self = this;
                this.$watch('selectedCategory', function () { self.selectedIds = []; self.selectAll = false; });
                this.$watch('activeTab', function (v) { if (v === 'history' && self.historyFiles.length === 0) self.loadHistoryFiles(); });
                if (!this.isLoading && this.details === null) {
                    console.error('收到的報廢資料為 null，可能是後端序列化失敗');
                    alert('載入失敗：資料格式錯誤');
                    this.$store.app.closeScrapPrintModal();
                }
            },
            get details() { return this.$store.app.scrapPendingDetails; },
            get isLoading() { return this.$store.app.isLoadingScrapDetails; },
            get webAppUrl() { return this.$store.app.webAppUrl; },
            get currentAssets() {
                var d = this.details;
                if (!d) return [];
                return this.selectedCategory === '財產' ? d.property : d.items;
            },
            handleSelectAll: function (checked) {
                this.selectAll = checked;
                this.selectedIds = checked ? this.currentAssets.map(function (a) { return a.assetId; }) : [];
            },
            handleSelectOne: function (assetId) {
                var idx = this.selectedIds.indexOf(assetId);
                this.selectedIds = idx !== -1 ? this.selectedIds.filter(function (id) { return id !== assetId; }) : this.selectedIds.concat([assetId]);
            },
            handleGenerateDoc: function () {
                var self = this;
                if (this.selectedIds.length === 0) { alert('請至少勾選一個項目來產生報表。'); return; }
                this.isGenerating = true;
                google.script.run
                    .withSuccessHandler(function (adminName) {
                        google.script.run
                            .withSuccessHandler(function (result) {
                                var shouldUpdate = confirm(
                                    '📄 彙總報表產生成功！\n\n是否要在列印後同步更新這些財產的狀態為「已報廢」？\n\n⚠️ 重要提醒\n選擇【確定】後，這些記錄將不會再出現在待列印清單中\n\n' +
                                    '✅ 【確定】= 列印後更新狀態，將 ' + result.assetIds.length + ' 筆財產狀態更新為「已報廢」（財產將標記為已報廢，無法再次列印此申請）\n' +
                                    '❌ 【取消】= 僅列印報表，不更新狀態（需至"總表更新"更新狀態）'
                                );
                                window.open(result.fileUrl, '_blank');
                                if (shouldUpdate) {
                                    google.script.run
                                        .withSuccessHandler(function (message) { alert('✅ ' + message); self.$store.app.handleScrapPrintRefresh(); })
                                        .withFailureHandler(function (error) {
                                            alert('❌ 狀態更新失敗：' + error.message + '\n⚠️  文件已成功產生，但狀態未更新。\n💡 請稍後使用「管理後台」手動更新狀態。');
                                            self.$store.app.handleScrapPrintRefresh();
                                        })
                                        .processScrapConfirmation(result.assetIds);
                                } else {
                                    self.$store.app.handleScrapPrintRefresh();
                                }
                                self.isGenerating = false;
                            })
                            .withFailureHandler(function (error) { alert('生成失敗：' + (error.message || error)); self.isGenerating = false; })
                            .createScrapDoc(adminName, self.selectedCategory, self.selectedIds);
                    })
                    .withFailureHandler(function (error) { alert('載入失敗：' + (error.message || error)); self.isGenerating = false; })
                    .getAdminName();
            },
            loadHistoryFiles: function () {
                var self = this;
                this.isLoadingHistory = true;
                google.script.run
                    .withSuccessHandler(function (files) { self.historyFiles = files || []; self.isLoadingHistory = false; })
                    .withFailureHandler(function (error) { console.error('載入歷史文件失敗:', error); self.historyFiles = []; self.isLoadingHistory = false; })
                    .getScrapDriveFiles();
            },
            handlePreviewByDate: function () {
                var self = this;
                if (!this.startDate || !this.endDate) { alert('請選擇起始和結束日期'); return; }
                if (new Date(this.startDate) > new Date(this.endDate)) { alert('起始日期不能晚於結束日期'); return; }
                this.isLoadingPreview = true;
                this.previewAssets = [];
                google.script.run
                    .withSuccessHandler(function (assets) {
                        if (assets === null) { alert('載入失敗：資料格式錯誤'); self.previewAssets = []; }
                        else if (!Array.isArray(assets)) { alert('載入失敗：預期為陣列'); self.previewAssets = []; }
                        else if (assets.length === 0) { alert('該日期範圍內沒有已報廢的資產'); self.previewAssets = []; }
                        else self.previewAssets = assets;
                        self.isLoadingPreview = false;
                    })
                    .withFailureHandler(function (error) { alert('載入失敗：' + error.message); self.isLoadingPreview = false; })
                    .getScrapAssetsByDateRange(this.startDate, this.endDate, this.selectedCategory);
            },
            handleGenerateByDate: function () {
                var self = this;
                if (this.previewAssets.length === 0) { alert('沒有可列印的資產'); return; }
                this.isGeneratingByDate = true;
                google.script.run
                    .withSuccessHandler(function (result) {
                        alert('報廢申請單已成功生成（共 ' + result.assetCount + ' 筆資產）');
                        window.open(result.fileUrl, '_blank');
                        self.isGeneratingByDate = false;
                    })
                    .withFailureHandler(function (error) { alert('生成失敗：' + error.message); self.isGeneratingByDate = false; })
                    .createScrapDocByDateRange(this.startDate, this.endDate, this.selectedCategory);
            }
        };
    });

    /* ===== TransferPrintModal(舊頁 8553-8981) ===== */
    Alpine.data('transferPrintModal', function () {
        return {
            selectedCategory: '財產', selectedIds: [], selectAll: false, isGenerating: false,
            activeTab: 'pending',
            historyRecords: [], isLoadingHistory: false, historyError: '', hasHistoryLoaded: false, historyLoadedCategory: '',

            init: function () {
                var self = this;
                this.$watch('selectedCategory', function () {
                    self.selectedIds = []; self.selectAll = false;
                    self.historyRecords = []; self.historyError = ''; self.hasHistoryLoaded = false; self.historyLoadedCategory = '';
                });
                Alpine.effect(function () {
                    if (self.activeTab !== 'history') return;
                    if (self.isLoadingHistory) return;
                    if (self.hasHistoryLoaded && self.historyLoadedCategory === self.selectedCategory) return;
                    self.loadHistoryRecords();
                });
                if (!this.isLoading && this.details === null) {
                    console.error('收到的轉移資料為 null，可能是後端序列化失敗');
                    alert('載入失敗：資料格式錯誤');
                    this.$store.app.closeTransferPrintModal();
                }
            },
            get details() { return this.$store.app.transferPendingDetails; },
            get isLoading() { return this.$store.app.isLoadingTransferDetails; },
            get webAppUrl() { return this.$store.app.webAppUrl; },
            get currentAssets() {
                var d = this.details;
                if (!d) return [];
                return this.selectedCategory === '財產' ? d.property : d.items;
            },
            handleSelectAll: function (checked) {
                this.selectAll = checked;
                this.selectedIds = checked ? this.currentAssets.map(function (a) { return a.assetId; }) : [];
            },
            handleSelectOne: function (assetId) {
                var idx = this.selectedIds.indexOf(assetId);
                this.selectedIds = idx !== -1 ? this.selectedIds.filter(function (id) { return id !== assetId; }) : this.selectedIds.concat([assetId]);
            },
            handleGenerateDoc: function () {
                var self = this;
                if (this.selectedIds.length === 0) { alert('請至少勾選一個項目來產生報表。'); return; }
                this.isGenerating = true;
                google.script.run
                    .withSuccessHandler(function (adminName) {
                        google.script.run
                            .withSuccessHandler(function (result) {
                                var shouldUpdate = confirm(
                                    '📄 彙總轉移記錄產生成功！\n\n❓ 是否要在生成文件後同步更新這些財產的更新狀態？\n\n⚠️  提醒：選擇【確定】後，這些記錄將不會再出現在待列印清單中\n\n' +
                                    '✅ 【確定】= 標記 ' + result.assetIds.length + ' 筆轉移記錄為已更新（無法再次列印）\n' +
                                    '❌ 【取消】= 僅開啟文件，不標記狀態（可再次列印，需至"總表更新"更新狀態）'
                                );
                                window.open(result.fileUrl, '_blank');
                                if (shouldUpdate) {
                                    google.script.run
                                        .withSuccessHandler(function (message) { alert('✅ ' + message); self.$store.app.handleTransferPrintRefresh(); })
                                        .withFailureHandler(function (error) {
                                            alert('❌ 狀態更新失敗：' + error.message + '\n⚠️  文件已成功產生，但未標記為已上傳。\n💡 請稍後使用「管理後台」手動更新狀態。');
                                            self.$store.app.handleTransferPrintRefresh();
                                        })
                                        .processUploadConfirmation(result.assetIds);
                                } else {
                                    self.$store.app.handleTransferPrintRefresh();
                                }
                                self.isGenerating = false;
                            })
                            .withFailureHandler(function (error) { alert('生成失敗：' + (error.message || error)); self.isGenerating = false; })
                            .createTransferDoc(adminName, self.selectedCategory, self.selectedIds);
                    })
                    .withFailureHandler(function (error) { alert('載入失敗：' + (error.message || error)); self.isGenerating = false; })
                    .getAdminName();
            },
            loadHistoryRecords: function () {
                var self = this;
                this.isLoadingHistory = true; this.historyError = ''; this.historyRecords = [];
                var category = this.selectedCategory;
                google.script.run
                    .withSuccessHandler(function (records) {
                        if (records === null || !Array.isArray(records)) { self.historyError = '載入失敗：資料格式錯誤'; self.historyRecords = []; }
                        else self.historyRecords = records;
                        self.isLoadingHistory = false; self.hasHistoryLoaded = true; self.historyLoadedCategory = category;
                    })
                    .withFailureHandler(function (error) {
                        self.historyError = '載入失敗：' + (error.message || error); self.historyRecords = [];
                        self.isLoadingHistory = false; self.hasHistoryLoaded = true; self.historyLoadedCategory = category;
                    })
                    .getTransferDocHistory(category);
            }
        };
    });

    /* ===== LendingPrintModal(舊頁 8983-9244) ===== */
    Alpine.data('lendingPrintModal', function () {
        return {
            activeTab: 'pending', groups: [], isLoading: false, error: '', isGenerating: false,
            historyRecords: [], isLoadingHistory: false, historyError: '',

            init: function () {
                var self = this;
                this.loadGroups();
                this.$watch('activeTab', function (v) { if (v === 'history' && self.historyRecords.length === 0) self.loadHistory(); });
            },
            get forceUserScope() { return this.$store.app.viewMode === 'user'; },
            loadGroups: function () {
                var self = this;
                this.isLoading = true; this.error = '';
                google.script.run
                    .withSuccessHandler(function (response) {
                        if (!response || response.error) { self.groups = []; self.error = (response && response.error) || '載入失敗'; }
                        else self.groups = Array.isArray(response.groups) ? response.groups : [];
                        self.isLoading = false;
                    })
                    .withFailureHandler(function (loadError) { self.groups = []; self.error = (loadError && loadError.message) || '載入失敗'; self.isLoading = false; })
                    .getExternalLendingPrintGroups(this.forceUserScope);
            },
            loadHistory: function () {
                var self = this;
                this.isLoadingHistory = true; this.historyError = '';
                google.script.run
                    .withSuccessHandler(function (records) { self.historyRecords = Array.isArray(records) ? records : []; self.isLoadingHistory = false; })
                    .withFailureHandler(function (loadError) { self.historyRecords = []; self.historyError = (loadError && loadError.message) || '載入失敗'; self.isLoadingHistory = false; })
                    .getLendingDocHistory(this.forceUserScope);
            },
            handlePrintGroup: function (group) {
                var self = this;
                if (this.isGenerating) return;
                var lendIds = ((group && group.assets) || []).map(function (a) { return a.lendId; }).filter(Boolean);
                if (lendIds.length === 0) { alert('此群組沒有可列印的項目。'); return; }
                this.isGenerating = true;
                this.$store.app.toastProgress('正在產生出借申請單...');
                google.script.run
                    .withSuccessHandler(function (result) {
                        self.$store.app.toastOrAlert('✅ 出借申請單已產生！', 'success');
                        if (result && result.fileUrl) window.open(result.fileUrl, '_blank');
                        self.isGenerating = false;
                        self.loadGroups();
                        self.historyRecords = [];
                        if (self.activeTab === 'history') self.loadHistory();
                    })
                    .withFailureHandler(function (loadError) {
                        self.$store.app.toastOrAlert('❌ 產生失敗：' + ((loadError && loadError.message) || loadError), 'error');
                        alert('產生失敗：' + ((loadError && loadError.message) || loadError));
                        self.isGenerating = false;
                    })
                    .createLendingDoc(lendIds);
            }
        };
    });

    /* ===== OperationManualModal(舊頁 11081-11207) ===== */
    Alpine.data('operationManualModal', function () {
        return {
            manualFrameHeight: 1200,
            _escHandler: null,

            init: function () {
                var self = this;
                document.body.style.overflow = 'hidden';
                this._escHandler = function (event) { if (event.key === 'Escape') self.$store.app.closeOperationManualModal(); };
                document.addEventListener('keydown', this._escHandler);
            },
            destroy: function () {
                document.body.style.overflow = '';
                if (this._escHandler) document.removeEventListener('keydown', this._escHandler);
            },
            get pageUrls() { return this.$store.app.userStatePageUrls; },
            get pdfDownloadUrl() { return String((this.pageUrls && this.pageUrls.operationManualPdfDownloadUrl) || '').trim(); },
            get manualSrcDoc() { return S.getOperationManualSrcDoc(); },
            resizeManualFrame: function () {
                var iframe = this.$refs.manualIframe;
                if (!iframe) return;
                try {
                    var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
                    if (!doc) return;
                    var bodyHeight = doc.body ? doc.body.scrollHeight : 0;
                    var documentHeight = doc.documentElement ? doc.documentElement.scrollHeight : 0;
                    var nextHeight = Math.max(bodyHeight, documentHeight, 1200);
                    this.manualFrameHeight = Math.min(nextHeight, 6000);
                } catch (error) {
                    console.warn('操作說明內容高度調整失敗：', error);
                }
            },
            handleFrameLoad: function () {
                var self = this;
                this.resizeManualFrame();
                setTimeout(function () { self.resizeManualFrame(); }, 200);
                setTimeout(function () { self.resizeManualFrame(); }, 800);
            }
        };
    });
});
</script>
