<!--
  alpine_views.html — P2 唯讀視圖層:頁面主結構、儀表板卡片、篩選卡、資產表格、狀態詳情
  markup 與 class 字串逐字對應舊頁 App render(userstate.html:15748-16280)與各元件。
  元件邏輯以 Alpine.data 註冊;後續 Phase 的 modal 於檔尾標記的掛載點加入。
-->
<script>
document.addEventListener('alpine:init', function () {
    var S = window.AppShared;

    /* ===== FilterSection(舊頁 5356-6039) ===== */
    Alpine.data('filterSection', function () {
        return {
            localSearch: '',
            allToggleableColumns: [
                { key: 'systemCategory', label: '系統類別' },
                { key: 'assetName', label: '財產名稱' },
                { key: 'aliasDisplay', label: '財產別名' },
                { key: 'modelBrand', label: '型號/廠牌' },
                { key: 'userName', label: '使用者' },
                { key: 'leader', label: '保管人' },
                { key: 'location', label: '保管位置' },
                { key: 'group', label: '組別' },
                { key: 'category', label: '財產類別' },
                { key: 'status', label: '狀態' }
            ],
            visibleColumns: [],
            isColumnMenuOpen: false,
            debounceTimer: null,
            dropdownOpen: { status: false, leader: false, user: false, group: false, location: false },
            optionSearch: { leader: '', user: '', group: '', location: '' },
            // 下拉卡設定(渲染順序與舊頁一致;status 在 category/systemCategory 之前)
            msBefore: [
                { key: 'status', label: '依狀態篩選', placeholder: '請選擇狀態...', empty: '找不到符合的狀態', searchable: false, searchPlaceholder: '' }
            ],
            msAfter: [
                { key: 'leader', label: '依保管人篩選', placeholder: '請選擇保管人...', empty: '找不到符合的保管人', searchable: true, searchPlaceholder: '搜尋保管人...' },
                { key: 'user', label: '依使用人篩選', placeholder: '請選擇使用人...', empty: '找不到符合的使用人', searchable: true, searchPlaceholder: '搜尋使用人...' },
                { key: 'group', label: '依組別篩選', placeholder: '請選擇組別...', empty: '找不到符合的組別', searchable: true, searchPlaceholder: '搜尋組別...' },
                { key: 'location', label: '依保管位置篩選', placeholder: '請選擇保管位置...', empty: '找不到符合的保管位置', searchable: true, searchPlaceholder: '搜尋保管位置...' }
            ],
            _outsideHandler: null,

            init: function () {
                var self = this;
                this.localSearch = this.$store.app.filters.search;
                
                var savedColumns = localStorage.getItem('assetTableVisibleColumns');
                if (savedColumns) {
                    try {
                        self.visibleColumns = JSON.parse(savedColumns);
                    } catch (e) {
                        self.visibleColumns = self.allToggleableColumns.map(function(c) { return c.key; });
                    }
                } else {
                    self.visibleColumns = self.allToggleableColumns.map(function(c) { return c.key; });
                }
                
                self.$watch('visibleColumns', function (value) {
                    localStorage.setItem('assetTableVisibleColumns', JSON.stringify(value));
                });

                // 外部 filters.search 變化時同步(例如 Scanner 清空搜尋框;舊頁 5376-5378)
                this.$watch('$store.app.filters.search', function (value) {
                    self.localSearch = value;
                });
                // 暴露清空搜尋框契約(舊頁 5405-5418)
                window.clearSearchBox = function () {
                    if (self.debounceTimer) {
                        clearTimeout(self.debounceTimer);
                        self.debounceTimer = null;
                    }
                    self.localSearch = '';
                    self.$store.app.handleFilterChange('search', '');
                };
                // 點擊外部關閉下拉(舊頁 5491-5506;mousedown 語意保留)
                this._outsideHandler = function (event) {
                    var root = event.target && event.target.closest ? event.target.closest('.fs-dropdown-root') : null;
                    if (!root || !self.$root.contains(root)) self.closeAllDropdowns();
                    
                    var colRoot = event.target && event.target.closest ? event.target.closest('.column-dropdown-root') : null;
                    if (!colRoot) self.isColumnMenuOpen = false;
                };
                document.addEventListener('mousedown', this._outsideHandler);
            },
            destroy: function () {
                if (this._outsideHandler) document.removeEventListener('mousedown', this._outsideHandler);
                if (this.debounceTimer) clearTimeout(this.debounceTimer);
                delete window.clearSearchBox;
            },

            /* 選項(舊頁 5420-5489 useMemo 群) */
            get statusOptions() {
                return Array.from(new Set(this.$store.app.allAssets.map(function (a) { return a.status; }))).filter(Boolean).sort();
            },
            get categoryOptions() {
                return Array.from(new Set(this.$store.app.allAssets.map(function (a) { return a.category; }))).filter(Boolean).sort();
            },
            baseOptionsFor: function (key) {
                var assets = this.$store.app.allAssets;
                if (key === 'status') return this.statusOptions;
                if (key === 'leader') {
                    return Array.from(new Set(assets.map(function (a) { return a.leader; }))).filter(Boolean).sort();
                }
                if (key === 'user') {
                    var userOptions = new Set();
                    assets.forEach(function (asset) {
                        var userName = String(asset.userName || '').trim();
                        if (userName) userOptions.add(userName);
                    });
                    userOptions.add('無');
                    return Array.from(userOptions).sort();
                }
                if (key === 'group') {
                    var groupOptions = new Set();
                    assets.forEach(function (asset) {
                        var groupName = String(asset.group || '').trim();
                        if (groupName) groupOptions.add(groupName);
                    });
                    return Array.from(groupOptions).sort();
                }
                if (key === 'location') {
                    return Array.from(new Set(assets.map(function (a) { return a.location; }))).filter(Boolean).sort();
                }
                return [];
            },
            optionsFor: function (key) {
                var base = this.baseOptionsFor(key);
                var keyword = String(this.optionSearch[key] || '').trim().toLowerCase();
                if (!keyword) return base;
                return base.filter(function (option) {
                    return String(option || '').toLowerCase().indexOf(keyword) !== -1;
                });
            },
            selectedFor: function (key) {
                return S.ensureArray(this.$store.app.filters[key]);
            },

            /* 開合與選取(舊頁 5541-5564) */
            toggleDropdown: function (filterKey) {
                var self = this;
                Object.keys(this.dropdownOpen).forEach(function (key) {
                    var next = key === filterKey ? !self.dropdownOpen[key] : false;
                    if (!next && self.dropdownOpen[key] && self.optionSearch[key] !== undefined && self.optionSearch[key]) {
                        self.optionSearch[key] = ''; // 關閉時清空搜尋(舊頁 5508-5530)
                    }
                    self.dropdownOpen[key] = next;
                });
            },
            closeAllDropdowns: function () {
                var self = this;
                Object.keys(this.dropdownOpen).forEach(function (key) {
                    if (self.dropdownOpen[key] && self.optionSearch[key] !== undefined && self.optionSearch[key]) {
                        self.optionSearch[key] = '';
                    }
                    self.dropdownOpen[key] = false;
                });
            },
            toggleFilterOption: function (filterKey, value) {
                var current = S.ensureArray(this.$store.app.filters[filterKey]);
                var next = current.indexOf(value) !== -1
                    ? current.filter(function (item) { return item !== value; })
                    : current.concat([value]);
                this.$store.app.handleFilterChange(filterKey, next);
            },
            removeFilterOption: function (filterKey, value) {
                var current = S.ensureArray(this.$store.app.filters[filterKey]);
                this.$store.app.handleFilterChange(filterKey, current.filter(function (item) { return item !== value; }));
            },
            selectAllFilterOptions: function (filterKey) {
                this.$store.app.handleFilterChange(filterKey, this.optionsFor(filterKey).slice());
            },
            clearFilterOptions: function (filterKey) {
                this.$store.app.handleFilterChange(filterKey, []);
            },

            /* 搜尋 debounce(舊頁 5381-5393) */
            handleSearchChange: function (value) {
                var self = this;
                this.localSearch = value;
                if (this.debounceTimer) clearTimeout(this.debounceTimer);
                this.debounceTimer = setTimeout(function () {
                    self.$store.app.handleFilterChange('search', value);
                }, 180);
            },

            /* 已套用條件(舊頁 5713-5780) */
            get hasActiveFilter() {
                var filters = this.$store.app.filters;
                if (!filters) return false;
                if ((filters.search || '').trim() !== '') return true;
                if ((filters.category || '').trim() !== '') return true;
                if ((filters.systemCategory || '').trim() !== '') return true;
                if (filters.inventoryTaskOnly) return true;
                return ['status', 'leader', 'user', 'group', 'location'].some(function (key) {
                    return Array.isArray(filters[key]) && filters[key].length > 0;
                });
            },
            get activeFilterChips() {
                var self = this;
                var filters = this.$store.app.filters;
                if (!filters) return [];
                var chips = [];
                var searchTrimmed = (filters.search || '').trim();
                if (searchTrimmed) {
                    chips.push({ type: 'search', label: '關鍵字', value: searchTrimmed });
                }
                if ((filters.category || '').trim()) {
                    chips.push({ type: 'category', label: '財產類別', value: filters.category });
                }
                if ((filters.systemCategory || '').trim()) {
                    chips.push({ type: 'systemCategory', label: '系統類別', value: filters.systemCategory });
                }
                var multiLabels = { status: '狀態', leader: '保管人', user: '使用人', group: '組別', location: '保管位置' };
                Object.keys(multiLabels).forEach(function (key) {
                    var arr = Array.isArray(filters[key]) ? filters[key] : [];
                    arr.forEach(function (v) {
                        chips.push({ type: key, label: multiLabels[key], value: v });
                    });
                });
                if (filters.inventoryTaskOnly) {
                    chips.push({ type: 'inventoryTaskOnly', label: '盤點任務', value: '僅顯示' });
                }
                return chips;
            },
            removeChip: function (chip) {
                var store = this.$store.app;
                if (chip.type === 'search') {
                    if (this.debounceTimer) {
                        clearTimeout(this.debounceTimer);
                        this.debounceTimer = null;
                    }
                    this.localSearch = '';
                    store.handleFilterChange('search', '');
                    return;
                }
                if (chip.type === 'category' || chip.type === 'systemCategory') {
                    store.handleFilterChange(chip.type, '');
                    return;
                }
                if (chip.type === 'inventoryTaskOnly') {
                    store.handleFilterChange('inventoryTaskOnly', false);
                    return;
                }
                this.removeFilterOption(chip.type, chip.value);
            },
            handleResetAllFilters: function () {
                if (this.debounceTimer) {
                    clearTimeout(this.debounceTimer);
                    this.debounceTimer = null;
                }
                this.localSearch = '';
                this.$store.app.handleResetFilters();
            },
            get totalExportCount() {
                var count = this.$store.app.filteredAssets.length;
                return Number.isFinite(count) ? count : 0;
            },
            get exportDisabled() {
                return this.totalExportCount === 0 || this.$store.app.isExporting;
            }
        };
    });

    /* ===== AssetTable(舊頁 6356-6946) ===== */
    Alpine.data('assetTable', function () {
        return {
            ROWS_PER_PAGE: 50,
            currentPage: 1,
            expandedAssetIds: [],
            inventoryStatusStyles: {
                '未盤點': 'text-slate-400 hover:text-slate-600',
                '正常': 'text-emerald-600 hover:text-emerald-800',
                '遺失': 'text-rose-600 hover:text-rose-800',
                '損壞': 'text-orange-600 hover:text-orange-800',
                '過舊': 'text-amber-600 hover:text-amber-800'
            },
            _lastSig: null,

            init: function () {
                var self = this;
                // 對應舊頁 useEffect [assets]→重設頁碼、[assets,currentPage]→收合展開
                //(filteredAssets 為 getter 無穩定識別,以「資產版本+篩選內容」作為變更訊號)
                Alpine.effect(function () {
                    var store = Alpine.store('app');
                    var sig = store.assetsVersion + '|' + S.stableStringify(store.filters);
                    if (self._lastSig !== null && sig !== self._lastSig) {
                        self.currentPage = 1;
                        self.expandedAssetIds = [];
                    }
                    self._lastSig = sig;
                });
                this.$watch('currentPage', function () {
                    self.expandedAssetIds = [];
                });
            },

            get assets() { return this.$store.app.filteredAssets; },
            get totalPages() {
                return Math.max(1, Math.ceil(((this.assets && this.assets.length) || 0) / this.ROWS_PER_PAGE));
            },
            get paginatedAssets() {
                if (!this.assets) return [];
                var start = (this.currentPage - 1) * this.ROWS_PER_PAGE;
                return this.assets.slice(start, start + this.ROWS_PER_PAGE);
            },
            get selectableAssets() {
                return this.assets ? this.assets.filter(function (a) { return a.status === '在庫'; }) : [];
            },
            get isAllSelected() {
                var store = this.$store.app;
                return this.selectableAssets.length > 0 &&
                    this.selectableAssets.every(function (a) { return store.isAssetSelected(a.assetId); });
            },
            get isPartialSelected() {
                var store = this.$store.app;
                return this.selectableAssets.some(function (a) { return store.isAssetSelected(a.assetId); }) && !this.isAllSelected;
            },
            // 每列預計算(對應舊頁 buildAssetState 6408-6483)
            get rows() {
                var self = this;
                var store = this.$store.app;
                var normalizedCurrentEmail = String(store.currentUserEmail || '').toLowerCase().trim();
                var groupProxyEnabled = (store.transferOptions && store.transferOptions.groupProxyEnabled) || false;
                var groupMemberEmailsLower = (store.transferOptions && store.transferOptions.groupMemberEmailsLower) || [];
                var isAdmin = store.isAdminView;
                return this.paginatedAssets.map(function (asset, index) {
                    var isTask = store.isInventoryTaskOnly(asset);
                    var isOwner = normalizedCurrentEmail &&
                        (normalizedCurrentEmail === String(asset.leaderEmail || '').toLowerCase().trim() ||
                            normalizedCurrentEmail === String(asset.userEmail || '').toLowerCase().trim());
                    var canCancel = !isTask && (isAdmin || isOwner);
                    var isSelectable = asset.status === '在庫';
                    // 注意:選取/展開狀態刻意「不」放進 row 物件 — 否則每次勾選都會重建
                    // 整頁 row 物件並重算所有列綁定(~500ms 停頓)。markup 改用
                    // $store.app.isAssetSelected() / isRowExpanded() 逐列 O(1) 查詢。
                    var assetLeaderEmail = String(asset.leaderEmail || '').toLowerCase().trim();
                    var isGroupMemberAsset = groupProxyEnabled &&
                        assetLeaderEmail !== normalizedCurrentEmail &&
                        groupMemberEmailsLower.indexOf(assetLeaderEmail) !== -1;

                    var rowBaseClass = '';
                    var borderClass = '';
                    var cardSurfaceClass = 'border-slate-200 bg-white';
                    if (isTask && isGroupMemberAsset) {
                        rowBaseClass = 'bg-teal-50';
                        borderClass = 'border-l-4 border-l-blue-500';
                        cardSurfaceClass = 'border-sky-200 bg-gradient-to-br from-teal-50 via-white to-sky-50';
                    } else if (isTask) {
                        rowBaseClass = 'bg-teal-50';
                        cardSurfaceClass = 'border-teal-200 bg-gradient-to-br from-teal-50 via-white to-white';
                    } else if (isGroupMemberAsset) {
                        rowBaseClass = 'bg-blue-50';
                        borderClass = 'border-l-4 border-l-blue-400';
                        cardSurfaceClass = 'border-blue-200 bg-gradient-to-br from-blue-50 via-white to-white';
                    }
                    var inventoryEntry = store.inventoryStatusByAsset ? store.inventoryStatusByAsset[asset.assetId] : null;
                    var inventoryStatus = inventoryEntry ? (inventoryEntry.status || '未盤點') : '';
                    var inventorySessionCount = inventoryEntry && typeof inventoryEntry.sessionCount === 'number'
                        ? inventoryEntry.sessionCount : 0;
                    var statusDetailType = S.STATUS_DETAIL_TYPES[asset.status];
                    return {
                        asset: asset,
                        index: index,
                        rowKey: asset.assetId + '-' + index,
                        isTask: isTask,
                        canCancel: canCancel,
                        isSelectable: isSelectable,
                        isGroupMemberAsset: isGroupMemberAsset,
                        rowBaseClass: rowBaseClass,
                        borderClass: borderClass,
                        rowHoverClass: isTask ? 'hover:bg-teal-100' : 'hover:bg-slate-50',
                        cardSurfaceClass: cardSurfaceClass,
                        statusBadgeClass: S.STATUS_COLORS[asset.status] || 'bg-slate-100 text-slate-700 border-slate-200',
                        canOpenStatusDetail: !!statusDetailType,
                        inventoryEntry: inventoryEntry,
                        inventoryStatus: inventoryStatus,
                        inventorySessionCount: inventorySessionCount,
                        inventoryTitle: inventoryStatus
                            ? ('盤點狀態：' + inventoryStatus + (inventorySessionCount > 0 ? '（進行中會話 ' + inventorySessionCount + ' 個）' : ''))
                            : '盤點確認',
                        inventoryButtonClass: self.inventoryStatusStyles[inventoryStatus] || 'text-slate-500 hover:text-slate-700',
                        aliasLabel: S.getAssetAliasLabel(asset),
                        aliasDisplay: S.getAssetAliasDisplay(asset)
                    };
                });
            },
            isRowExpanded: function (rowKey) {
                return this.expandedAssetIds.indexOf(rowKey) !== -1;
            },
            toggleExpandedAsset: function (rowKey) {
                this.expandedAssetIds = this.expandedAssetIds.indexOf(rowKey) !== -1
                    ? this.expandedAssetIds.filter(function (id) { return id !== rowKey; })
                    : this.expandedAssetIds.concat([rowKey]);
            },
            prevPage: function () { this.currentPage = Math.max(1, this.currentPage - 1); },
            nextPage: function () { this.currentPage = Math.min(this.totalPages, this.currentPage + 1); }
        };
    });

    /* ===== StatusDetailModal(舊頁 9246-9397) ===== */
    Alpine.data('statusDetailModal', function () {
        var normalizeText = function (value) { return String(value || '').trim(); };
        var formatValue = function (value) {
            var text = normalizeText(value);
            return text ? text : '-';
        };
        var formatChange = function (oldValue, newValue) {
            var oldText = normalizeText(oldValue);
            var newText = normalizeText(newValue);
            if (!oldText && !newText) return '-';
            if (!newText || oldText === newText) return oldText || newText || '-';
            return (oldText || '-') + ' → ' + newText;
        };
        return {
            get state() { return this.$store.app.statusDetailState; },
            get theme() {
                var type = this.state && this.state.type;
                return S.STATUS_DETAIL_THEMES[type] || {
                    title: '狀態詳情', icon: 'fa-circle-info', headerClass: 'bg-slate-50', textClass: 'text-slate-800'
                };
            },
            get statusBadgeClass() {
                var asset = this.state && this.state.asset;
                return S.STATUS_COLORS[asset && asset.status] || 'bg-slate-100 text-slate-700 border-slate-200';
            },
            get aliasLabel() { return S.getAssetAliasLabel(this.state && this.state.asset); },
            get aliasDisplay() { return S.getAssetAliasDisplay(this.state && this.state.asset); },
            get hasAlias() {
                var asset = this.state && this.state.asset;
                return !!(asset && (asset.assetAlias || asset.productSerial));
            },
            get detailRows() {
                var state = this.state;
                if (!state || !state.detail) return [];
                var detail = state.detail;
                var type = state.type;
                if (type === 'transfer') {
                    var rows = [
                        { label: '流程狀態', value: formatValue(detail.workflowStatus || detail.status) },
                        { label: '申請時間', value: formatValue(detail.applicationTime) },
                        { label: '轉移類型', value: formatValue(detail.transferType) },
                        { label: '保管人變更', value: formatChange(detail.oldKeeper, detail.newKeeper), full: true },
                        { label: '使用人變更', value: formatChange(detail.oldUser, detail.newUser), full: true },
                        { label: '地點變更', value: formatChange(detail.oldLocation, detail.newLocation), full: true }
                    ];
                    if (detail.applicantEmail) {
                        rows.push({ label: '申請人', value: formatValue(detail.applicantEmail), full: true });
                    }
                    return rows;
                }
                if (type === 'lending') {
                    var lendingRows = [];
                    var borrowerTypeLabel = detail.borrowerType === 'external' ? '外部'
                        : detail.borrowerType === 'internal' ? '內部' : '';
                    if (borrowerTypeLabel) {
                        lendingRows.push({ label: '借用類型', value: formatValue(borrowerTypeLabel) });
                    }
                    lendingRows.push(
                        { label: '出借人', value: formatValue(detail.lenderName) },
                        { label: '借用人', value: formatValue(detail.borrower) },
                        { label: '出借日期', value: formatValue(detail.applyTime) },
                        { label: '預計歸還日', value: formatValue(detail.expectedReturnDate) },
                        { label: '原放置地點', value: formatValue(detail.originalLocation) },
                        { label: '出借後地點', value: formatValue(detail.lendingLocation) },
                        { label: '出借事由', value: formatValue(detail.reason), full: true }
                    );
                    if (detail.contactPhone) {
                        lendingRows.splice(2, 0, { label: '聯絡電話', value: formatValue(detail.contactPhone) });
                    }
                    return lendingRows;
                }
                if (type === 'scrap') {
                    return [
                        { label: '報廢日期', value: formatValue(detail.scrapDate) },
                        { label: '報廢原因', value: formatValue(detail.scrapReason), full: true },
                        { label: '原保管人', value: formatValue(detail.originalKeeper) },
                        { label: '原使用人', value: formatValue(detail.originalUser) },
                        { label: '保管位置', value: formatValue(detail.location) }
                    ];
                }
                return [];
            }
        };
    });

    /* ===== 頁首(問候日期;對應舊頁 15756-15759 即時計算) ===== */
    Alpine.data('pageHero', function () {
        return {
            get todayText() {
                return new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
            }
        };
    });

    /* ===== DashboardCards 卡片定義(舊頁 3451-3500) ===== */
    Alpine.data('dashboardCards', function () {
        return {
            cards: [
                { id: 'transferring', label: '轉移中', countKey: 'transferring', dataSource: 'overview', color: 'bg-cyan-500', icon: '🔁', description: '我申請轉出、等待對方接收' },
                { id: 'pending', label: '待接收', countKey: 'pending', dataSource: 'overview', color: 'bg-blue-500', icon: '📥', description: '需要您確認接收的資產' },
                { id: 'lent', label: '出借中', countKey: 'lent', dataSource: 'core', color: 'bg-green-500', icon: '📤', description: '目前出借的資產' },
                { id: 'scrapPending', label: '待列印報廢申請單', countKey: 'scrapPending', dataSource: 'scrap', color: 'bg-orange-500', icon: '🗑️', description: '報廢中的資產（需列印申請單）' },
                { id: 'transferPending', label: '待列印轉移申請單', countKey: 'transferPending', dataSource: 'secondary', color: 'bg-purple-500', icon: '🔄', description: '已被接收的資產（需列印轉移申請單）' },
                { id: 'inventory', label: '待盤點', countKey: 'inventory', dataSource: 'secondary', color: 'bg-red-500', icon: '📋', description: '需要您完成的盤點任務' },
                { id: 'locationError', label: '需確認財產', countKey: 'locationError', dataSource: 'locationError', color: 'bg-amber-500', icon: '📍', description: '系統顯示位置有誤，需確認或申請轉移' }
            ]
        };
    });
});
</script>

<style>
    .filter-native-select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: none;
    }

    .filter-native-select::-ms-expand {

                                            <div class="line-clamp-2 text-xs break-all" :title="row.asset.modelBrand" x-text="row.asset.modelBrand || '-'"></div>
                                        </td>
                                        <td class="px-2 py-3 text-slate-600 whitespace-nowrap align-top" x-text="row.asset.userName"></td>
                                        <td class="px-2 py-3 text-slate-600 whitespace-nowrap align-top" x-text="row.asset.leader"></td>
                                        <td class="px-2 py-3 text-slate-600 align-top">
                                            <div class="line-clamp-2" :title="row.asset.location" x-text="row.asset.location"></div>
                                        </td>
                                        <td class="px-2 py-3 text-slate-600 align-top">
                                            <span class="bg-sky-50 text-sky-700 border border-sky-200 px-2 py-1 rounded text-xs whitespace-nowrap" x-text="row.asset.group || '未分組'"></span>
                                        </td>
                                        <td class="px-2 py-3 text-slate-600 align-top">
                                            <span class="bg-slate-100 px-2 py-1 rounded text-xs whitespace-nowrap" x-text="row.asset.category"></span>
                                        </td>
                                        <td class="px-2 py-3 align-top">
                                            <template x-if="row.canOpenStatusDetail">
                                                <button type="button"
                                                        @click="$store.app.handleOpenStatusDetail(row.asset)"
                                                        class="inline-flex items-center gap-1.5 rounded-full border font-medium whitespace-nowrap px-2.5 py-1 text-xs cursor-pointer transition-shadow hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-200"
                                                        :class="row.statusBadgeClass"
                                                        :title="'查看' + row.asset.status + '詳情'"
                                                        :aria-label="'查看 ' + row.asset.assetId + ' ' + row.asset.status + ' 詳情'">
                                                    <span x-text="row.asset.status"></span>
                                                    <i class="fa-solid fa-circle-info text-[10px]"></i>
                                                </button>
                                            </template>
                                            <template x-if="!row.canOpenStatusDetail">
                                                <span class="inline-flex items-center gap-1.5 rounded-full border font-medium whitespace-nowrap px-2.5 py-1 text-xs"
                                                      :class="row.statusBadgeClass" x-text="row.asset.status"></span>
                                            </template>
                                        </td>
                                        <td class="px-2 py-3 text-left align-top whitespace-nowrap">
                                            <!-- 處理中狀態鎖定 -->
                                            <div class="flex items-center gap-2 text-blue-500 font-medium p-1" x-show="$store.app.isAssetProcessing(row.asset.assetId)">
                                                <i class="fa-solid fa-spinner fa-spin text-base"></i>
                                                <span class="text-xs" x-text="row.asset.status === '待處理' ? '處理中...' : '更新中...'"></span>
                                            </div>
                                            <div class="flex justify-start gap-2" x-show="!$store.app.isAssetProcessing(row.asset.assetId)">
                                                <button type="button" x-show="$store.app.isAdminView"
                                                        @click="$store.app.handleOpenEditModal(row.asset)"
                                                        class="text-amber-600 hover:text-amber-800 transition-colors p-1" title="修改基本資料">
                                                    <i class="fa-solid fa-pen-to-square text-base"></i>
                                                </button>
                                                <template x-if="!row.isTask && row.asset.status === '在庫'">
                                                    <div class="flex justify-start gap-2">
                                                        <button type="button" @click="$store.app.handleOpenTransferModal(row.asset)"
                                                                class="text-blue-600 hover:text-blue-800 transition-colors p-1" title="轉移">
                                                            <i class="fa-solid fa-right-left text-base"></i>
                                                        </button>
                                                        <button type="button" @click="$store.app.handleOpenLendingModal(row.asset)"
                                                                class="text-purple-600 hover:text-purple-800 transition-colors p-1" title="出借">
                                                            <i class="fa-solid fa-hand-holding-hand text-base"></i>
                                                        </button>
                                                        <button type="button" @click="$store.app.handleOpenScrapModal(row.asset)"
                                                                class="text-red-600 hover:text-red-800 transition-colors p-1" title="報廢">
                                                            <i class="fa-regular fa-trash-can text-base"></i>
                                                        </button>
                                                    </div>
                                                </template>
                                                <button type="button" x-show="row.inventoryEntry"
                                                        @click="$store.app.handleOpenInventoryModal(row.asset)"
                                                        class="transition-colors p-1" :class="row.inventoryButtonClass"
                                                        :title="row.inventoryTitle" :aria-label="row.inventoryTitle">
                                                    <i class="fa-solid fa-clipboard-check text-base"></i>
                                                </button>
                                                <span x-show="row.isTask" class="text-slate-400 p-1" title="僅限盤點">
                                                    <i class="fa-solid fa-lock text-lg"></i>
                                                </span>
                                                <button type="button" x-show="row.canCancel && (row.asset.status === '待接收' || row.asset.status === '轉移中' || row.asset.status === '報廢中')"
                                                        @click="$store.app.handleCancel(row.asset.assetId, row.asset.status)"
                                                        class="px-3 py-1 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-colors text-sm font-medium">
                                                    <i class="fa-solid fa-ban text-sm"></i>
                                                    取消
                                                </button>
                                                <button type="button" x-show="$store.app.isAdminView && row.asset.status === '已報廢'"
                                                        @click="$store.app.handleRestore(row.asset.assetId)"
                                                        class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-lg hover:bg-yellow-200 transition-colors text-sm font-medium">
                                                    <i class="fa-solid fa-rotate-left text-sm"></i>
                                                    回溯
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>
        </div>

        <!-- 狀態詳情 Modal(舊頁 9246-9397) -->
        <template x-if="$store.app.statusDetailState">
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" x-data="statusDetailModal">
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                    <div class="px-6 py-4 border-b flex justify-between items-center" :class="theme.headerClass">
                        <div>
                            <h3 class="text-lg font-bold" :class="theme.textClass">
                                <i class="fa-solid mr-2" :class="theme.icon"></i>
                                <span x-text="theme.title"></span>
                            </h3>
                            <div class="text-xs text-slate-500 mt-1">
                                <span x-text="(state.asset && state.asset.assetId) || ''"></span>
                                <span x-show="state.asset && state.asset.assetName" x-text="'・' + state.asset.assetName"></span>
                                <span x-show="hasAlias" x-text="'・' + aliasLabel + '：' + aliasDisplay"></span>
                            </div>
                        </div>
                        <button @click="$store.app.handleCloseStatusDetail()" class="text-slate-400 hover:text-slate-600 transition-colors">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                    <div class="p-6">
                        <div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 mb-4">
                            <div class="text-xs text-slate-500 mb-1">資產狀態</div>
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="font-mono text-slate-700" x-text="(state.asset && state.asset.assetId) || '-'"></span>
                                <span class="text-slate-700" x-text="(state.asset && state.asset.assetName) || '-'"></span>
                                <span class="text-slate-500" x-text="aliasLabel + '：' + aliasDisplay"></span>
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border whitespace-nowrap"
                                      :class="statusBadgeClass" x-text="(state.asset && state.asset.status) || '-'"></span>
                            </div>
                        </div>
                        <template x-if="state.isLoading">
                            <div class="flex flex-col items-center justify-center py-10 gap-3">
                                <i class="fas fa-spinner fa-spin text-3xl text-slate-400"></i>
                                <p class="text-slate-500 font-medium">載入狀態詳情中...</p>
                            </div>
                        </template>
                        <template x-if="!state.isLoading && state.error">
                            <div class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700" x-text="state.error"></div>
                        </template>
                        <template x-if="!state.isLoading && !state.error && detailRows.length === 0">
                            <div class="text-center py-10 text-slate-500">
                                <i class="fas fa-info-circle text-3xl mb-2 text-slate-300"></i>
                                <p>目前沒有可顯示的詳情。</p>
                            </div>
                        </template>
                        <template x-if="!state.isLoading && !state.error && detailRows.length > 0">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <template x-for="row in detailRows" :key="row.label">
                                    <div class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2" :class="row.full ? 'md:col-span-2' : ''">
                                        <div class="text-xs font-semibold text-slate-500" x-text="row.label"></div>
                                        <div class="text-sm text-slate-700 mt-1 whitespace-pre-line" x-text="row.value"></div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="px-6 py-4 border-t bg-slate-50 flex justify-end">
                        <button @click="$store.app.handleCloseStatusDetail()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">關閉</button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>

<!-- ===== Modal / Script 掛載區已移至 userstate_alpine.html 作為第一層 include ===== -->
</main>
