<!--
  alpine_modals_single.html — P3 單筆操作 modal:快速轉移/出借/報廢 + 新增/編輯資產 + ISMS 新增
  逐行對應舊頁 QuickTransferModal(9402)/QuickLendingModal(9783)/QuickScrapModal(10059)。
  x-if 掛載 = React 條件渲染:每次開啟即全新表單狀態(語意等價)。
-->
<script>
document.addEventListener('alpine:init', function () {
    var S = window.AppShared;

    /* ===== QuickTransferModal(舊頁 9402-9780) ===== */
    Alpine.data('quickTransferModal', function () {
        return {
            transferMode: 'normal', // 'normal' | 'station' | 'info' | 'intake' | 'info_out' | 'lab'
            labType: 'personal',
            labTargetEmail: '',
            changeLocation: false,
            changeKeeper: false,
            changeUser: false,
            newLocation: '',
            newKeeperEmail: '',
            newUserEmail: '',
            infoOutTargetEmail: '',
            custodianEmail: '',
            stationLocation: '',
            isSubmitting: false,

            get asset() { return this.$store.app.selectedAsset; },
            get options() { return this.$store.app.transferOptions; },
            get uniqueLocations() {
                return Array.from(new Set(((this.options && this.options.locations) || []).filter(Boolean)));
            },
            get uniqueStationLocations() {
                return Array.from(new Set(((this.options && this.options.stationLocations) || []).filter(Boolean)));
            },
            get hasCustodians() {
                return !!(this.options && this.options.custodians && Object.keys(this.options.custodians).length > 0);
            },
            entries: function (obj) {
                return Object.entries(obj || {});
            },
            get availableStationLocations() {
                var allLocations = this.uniqueStationLocations || [];
                if (!this.custodianEmail) return allLocations;
                var mapping = (this.options && this.options.custodianToStations) || {};
                var allowed = mapping[this.custodianEmail];
                if (!allowed || allowed.length === 0) return allLocations;
                return allLocations.filter(function (loc) { return allowed.indexOf(loc) !== -1; });
            },
            get availableCustodians() {
                var allCustodians = this.entries((this.options && this.options.custodians) || {});
                if (!this.stationLocation) return allCustodians;
                var mapping = (this.options && this.options.stationToCustodians) || {};
                var allowed = mapping[this.stationLocation];
                if (!allowed || allowed.length === 0) return allCustodians;
                var allowedEmails = allowed.map(function (c) { return c.email; });
                return allCustodians.filter(function (entry) { return allowedEmails.indexOf(entry[0]) !== -1; });
            },
            handleStationChange: function (newStation) {
                this.stationLocation = newStation;
                if (!newStation) return;
                var mapping = (this.options && this.options.stationToCustodians) || {};
                var matched = mapping[newStation] || [];
                if (matched.length === 1) {
                    this.custodianEmail = matched[0].email;
                } else if (matched.length > 1) {
                    var emails = matched.map(function (c) { return c.email; });
                    if (this.custodianEmail && emails.indexOf(this.custodianEmail) === -1) {
                        this.custodianEmail = '';
                    }
                }
            },
            handleCustodianChange: function (newEmail) {
                this.custodianEmail = newEmail;
                if (!newEmail) return;
                var mapping = (this.options && this.options.custodianToStations) || {};
                var matched = mapping[newEmail] || [];
                if (matched.length === 1) {
                    this.stationLocation = matched[0];
                } else if (matched.length > 1) {
                    if (this.stationLocation && matched.indexOf(this.stationLocation) === -1) {
                        this.stationLocation = '';
                    }
                }
            },
            get aliasLabel() { return S.getAssetAliasLabel(this.asset); },
            get aliasDisplay() { return S.getAssetAliasDisplay(this.asset); },
            get availableKeepers() {
                var keepers = (this.options && this.options.keepers) || {};
                var currentLeaderEmail = (this.asset && this.asset.leaderEmail)
                    ? String(this.asset.leaderEmail).toLowerCase().trim()
                    : '';
                return Object.entries(keepers).filter(function (entry) {
                    if (!currentLeaderEmail) return true;
                    return String(entry[0]).toLowerCase().trim() !== currentLeaderEmail;
                });
            },
            get availableUsers() {
                var users = (this.options && this.options.users) || {};
                var currentUserEmail = (this.asset && this.asset.userEmail)
                    ? String(this.asset.userEmail).toLowerCase().trim()
                    : '';
                return Object.entries(users).filter(function (entry) {
                    if (!currentUserEmail) return true;
                    return String(entry[0]).toLowerCase().trim() !== currentUserEmail;
                });
            },
            get availableLabKeepers() {
                var labMembers = (this.options && this.options.labMembers) || {};
                var currentLeaderEmail = (this.asset && this.asset.leaderEmail)
                    ? String(this.asset.leaderEmail).toLowerCase().trim()
                    : '';
                return Object.entries(labMembers).filter(function (entry) {
                    if (!currentLeaderEmail) return true;
                    return String(entry[0]).toLowerCase().trim() !== currentLeaderEmail;
                });
            },

            buildSummary: function () {
                var options = this.options || {};
                if (this.transferMode === 'station') {
                    var custodianName = (options.custodians && options.custodians[this.custodianEmail]) || this.custodianEmail || '-';
                    return '中心轉駐站｜駐管:' + custodianName + '｜地點:' + (this.stationLocation || '-');
                }
                if (this.transferMode === 'info') return '駐站回送中心資訊組';
                if (this.transferMode === 'intake') return '駐站回送中心收案組';
                if (this.transferMode === 'info_out') {
                    var recipientName = (options.keepers && options.keepers[this.infoOutTargetEmail]) || this.infoOutTargetEmail || '-';
                    var locText = this.newLocation ? '｜地點:' + this.newLocation : '';
                    return '資訊組轉出｜接收人:' + recipientName + locText;
                }
                if (this.transferMode === 'lab') {
                    var locText = this.newLocation ? '｜地點:' + this.newLocation : '';
                    if (this.labType === 'personal') {
                        var targetName = (options.labMembers && options.labMembers[this.labTargetEmail]) || this.labTargetEmail || '-';
                        return '轉移給實驗組(個人)｜接收人:' + targetName + locText;
                    } else {
                        var commonName = options.labCommonCustodianName || options.labCommonCustodianEmail || '-';
                        return '轉移給實驗組(共用)｜公用保管人:' + commonName + locText;
                    }
                }
                var parts = [];
                if (this.changeLocation) parts.push('地點:' + (this.newLocation || '-'));
                if (this.changeKeeper) {
                    var keeperName = (options.keepers && options.keepers[this.newKeeperEmail]) || this.newKeeperEmail || '-';
                    parts.push('保管人:' + keeperName);
                }
                if (this.changeUser) {
                    var userName = (options.users && options.users[this.newUserEmail]) || this.newUserEmail || '-';
                    parts.push('使用人:' + userName);
                }
                return '一般轉移' + (parts.length > 0 ? '｜' + parts.join('｜') : '');
            },
            handleSubmit: function () {
                var self = this;
                var store = this.$store.app;
                var asset = this.asset;
                var options = this.options;
                // 驗證(Guard Clauses,同舊頁 9444-9472)
                if (this.transferMode === 'normal') {
                    if (!this.changeLocation && !this.changeKeeper && !this.changeUser) {
                        alert('請至少選擇一項變更（地點、保管人或使用人）');
                        return;
                    }
                    if (this.changeLocation && !this.newLocation) { alert('請選擇新地點'); return; }
                    if (this.changeKeeper) {
                        if (!this.newKeeperEmail) { alert('請選擇新保管人'); return; }
                        if (this.asset && this.asset.leaderEmail && String(this.newKeeperEmail).toLowerCase().trim() === String(this.asset.leaderEmail).toLowerCase().trim()) {
                            alert('新保管人不能與原保管人相同');
                            return;
                        }
                    }
                    if (this.changeUser) {
                        if (!this.newUserEmail) { alert('請選擇新使用人'); return; }
                        if (this.asset && this.asset.userEmail && String(this.newUserEmail).toLowerCase().trim() === String(this.asset.userEmail).toLowerCase().trim()) {
                            alert('新使用人不能與原使用人相同');
                            return;
                        }
                    }
                } else if (this.transferMode === 'station') {
                    if (!this.custodianEmail) { alert('請選擇駐管！'); return; }
                    if (!this.stationLocation) { alert('請選擇駐站地點！'); return; }
                } else if (this.transferMode === 'info_out') {
                    if (!this.infoOutTargetEmail) { alert('請選擇接收人員（保管人兼使用人）！'); return; }
                } else if (this.transferMode === 'lab') {
                    if (this.labType === 'personal') {
                        if (!this.labTargetEmail) {
                            alert('請選擇接收人員（限實驗組成員）！');
                            return;
                        }
                        if (this.asset && this.asset.leaderEmail && String(this.labTargetEmail).toLowerCase().trim() === String(this.asset.leaderEmail).toLowerCase().trim()) {
                            alert('新保管人不能與原保管人相同');
                            return;
                        }
                    } else if (this.labType === 'common') {
                        if (!this.options || !this.options.labCommonCustodianEmail) {
                            alert('系統尚未設定「實驗組共同財產保管與使用人」，請先至系統設定中完成配置！');
                            return;
                        }
                    }
                }

                var isLab = this.transferMode === 'lab';
                var labKeeperEmail = this.labType === 'personal' ? this.labTargetEmail : (this.options && this.options.labCommonCustodianEmail);

                var formData = {
                    assetIds: [asset.assetId],
                    newKeeperEmail: this.transferMode === 'info_out' ? this.infoOutTargetEmail : (isLab ? labKeeperEmail : (this.changeKeeper ? this.newKeeperEmail : null)),
                    newLocation: (this.transferMode === 'info_out' || isLab) ? (this.newLocation || null) : (this.changeLocation ? this.newLocation : null),
                    newUserName: null,
                    newUserEmail: this.transferMode === 'info_out' ? this.infoOutTargetEmail : (isLab ? labKeeperEmail : (this.changeUser ? this.newUserEmail : null)),
                    isStationTransfer: this.transferMode === 'station',
                    isInfoTransfer: this.transferMode === 'info',
                    isIntakeTransfer: this.transferMode === 'intake',
                    isInfoOutTransfer: this.transferMode === 'info_out',
                    isLabTransfer: isLab,
                    labType: isLab ? this.labType : null
                };
                if (this.transferMode === 'station') {
                    formData.custodianEmail = this.custodianEmail;
                    formData.stationLocation = this.stationLocation;
                } else if (this.transferMode === 'info' && options.infoCustodian) {
                    formData.infoCustodianEmail = Object.keys(options.infoCustodian)[0];
                    formData.infoUserEmail = Object.keys(options.infoUser || {})[0];
                    formData.infoLocation = options.infoLocation;
                    formData.infoComputerLocation = options.infoComputerLocation;
                } else if (this.transferMode === 'intake' && options.intakeCustodian) {
                    formData.intakeCustodianEmail = Object.keys(options.intakeCustodian)[0];
                    formData.intakeLocation = options.intakeLocation;
                }

                if (store.quickActionMode === 'queue') {
                    var payload = Object.assign({}, formData);
                    delete payload.assetIds;
                    store.handleQueueAction('TRANSFER', payload, this.buildSummary(), asset);
                    store.handleQueueModalClose();
                    return;
                }

                var confirmation = confirm('確定要轉移財產「' + asset.assetId + '」嗎？');
                if (!confirmation) return;
                
                if (store.isAssetProcessing(asset.assetId)) return; // 防重複送出
                store.toastProgress('正在提交「' + asset.assetId + '」的轉移申請...');
                store.addProcessingAsset(asset.assetId);
                store.handleCloseQuickActionModal();

                google.script.run
                    .withSuccessHandler(function (message) {
                        store.removeProcessingAsset(asset.assetId);
                        // 後端 catch 會以「申請失敗：」字串回傳(非拋出),須在成功回呼中辨識為失敗
                        if (typeof message === 'string' && message.indexOf('申請失敗') === 0) {
                            store.toastOrAlert('❌ 提交轉移失敗：' + message, 'error');
                            alert(message);
                            return;
                        }
                        var requiresPrint = message.includes('請列印轉移申請單') || message.includes('需列印');
                        var waitReview = message.includes('需要審核') || message.includes('等待') || message.includes('任一方審核');
                        
                        store.toastOrAlert('✅ 「' + asset.assetId + '」轉移申請已提交！', 'success');

                        store.showSuccessPrompt({
                            title: '轉移申請已提交',
                            message: message,
                            actionType: 'TRANSFER',
                            requiresPrint: requiresPrint,
                            waitReview: waitReview
                        });
                        // 以權威資料對帳:純地點轉移維持在庫、部分成功等情形皆由此修正,並更新卡片統計
                        store.refreshCardData('transfer');
                    })
                    .withFailureHandler(function (error) {
                        store.removeProcessingAsset(asset.assetId);
                        store.toastOrAlert('❌ 提交轉移失敗: ' + error.message, 'error');
                        alert('錯誤：' + error.message);
                    })
                    .processBatchTransferApplication(formData);
            },
            close: function () {
                var store = this.$store.app;
                if (store.quickActionMode === 'queue') store.handleQueueModalClose();
                else store.handleCloseQuickActionModal();
            }
        };
    });

    /* ===== QuickLendingModal(舊頁 9783-10056) ===== */
    Alpine.data('quickLendingModal', function () {
        return {
            borrowerType: 'internal',
            borrowerName: '',
            lendingLocation: '',
            returnDate: '',
            reason: '',
            contactPhone: '',
            isSubmitting: false,

            get asset() { return this.$store.app.selectedAsset; },
            get options() { return this.$store.app.lendingOptions; },
            get isExternal() { return this.borrowerType === 'external'; },
            get aliasLabel() { return S.getAssetAliasLabel(this.asset); },
            get aliasDisplay() { return S.getAssetAliasDisplay(this.asset); },

            buildSummary: function () {
                var typeLabel = this.isExternal ? '外部' : '內部';
                var parts = [
                    '類型:' + typeLabel,
                    '借用人:' + (this.borrowerName || '-'),
                    '地點:' + (this.lendingLocation || '-'),
                    '歸還:' + (this.returnDate || '-')
                ];
                if (this.isExternal) parts.push('電話:' + (this.contactPhone || '-'));
                return '出借｜' + parts.join('｜');
            },
            handleSubmit: function () {
                var self = this;
                var store = this.$store.app;
                var asset = this.asset;
                var trimmedBorrowerName = this.borrowerName.trim();
                var trimmedLocation = this.lendingLocation.trim();
                var trimmedReason = this.reason.trim();
                var trimmedContactPhone = this.contactPhone.trim();

                if (!trimmedBorrowerName || !trimmedLocation || !this.returnDate) {
                    alert('請填寫所有必填欄位（借用人、地點、歸還日期）');
                    return;
                }
                if (this.isExternal && (!trimmedReason || !trimmedContactPhone)) {
                    alert('外部借用需填寫聯絡電話與出借事由');
                    return;
                }
                var formData = {
                    assetIds: [asset.assetId],
                    borrowerName: trimmedBorrowerName,
                    lendingLocation: trimmedLocation,
                    returnDate: this.returnDate,
                    reason: trimmedReason,
                    borrowerType: this.borrowerType,
                    contactPhone: trimmedContactPhone
                };
                if (store.quickActionMode === 'queue') {
                    var payload = Object.assign({}, formData);
                    delete payload.assetIds;
                    store.handleQueueAction('LEND', payload, this.buildSummary(), asset);
                    store.handleQueueModalClose();
                    return;
                }
                var confirmation = confirm('確定要出借財產「' + asset.assetId + '」給 ' + this.borrowerName + ' 嗎？');
                if (!confirmation) return;

                if (store.isAssetProcessing(asset.assetId)) return; // 防重複送出
                store.toastProgress('正在提交「' + asset.assetId + '」的出借申請...');
                store.addProcessingAsset(asset.assetId);
                store.handleCloseQuickActionModal();

                google.script.run
                    .withSuccessHandler(function (message) {
                        store.removeProcessingAsset(asset.assetId);
                        // 後端 catch 會以「申請出借失敗：」字串回傳(非拋出),須辨識為失敗
                        if (typeof message === 'string' && message.indexOf('申請出借失敗') === 0) {
                            store.toastOrAlert('❌ 提交出借失敗：' + message, 'error');
                            alert(message);
                            return;
                        }
                        // 出借一律提供列印外部出借申請單入口(後端成功訊息不含列印關鍵字)
                        var requiresPrint = true;
                        var waitReview = message.includes('需要審核') || message.includes('等待') || message.includes('任一方審核');
                        
                        store.toastOrAlert('✅ 「' + asset.assetId + '」出借申請已提交！', 'success');

                        store.showSuccessPrompt({
                            title: '出借申請已提交',
                            message: message,
                            actionType: 'LEND',
                            requiresPrint: requiresPrint,
                            waitReview: waitReview
                        });
                        // 以權威資料對帳:部分成功(未在庫/無權限被跳過)等情形由此修正,並更新卡片統計
                        store.refreshCardData('lending');
                    })
                    .withFailureHandler(function (error) {
                        store.removeProcessingAsset(asset.assetId);
                        store.toastOrAlert('❌ 提交出借失敗: ' + error.message, 'error');
                        alert('錯誤：' + error.message);
                    })
                    .processBatchLending(formData);
            },
            close: function () {
                var store = this.$store.app;
                if (store.quickActionMode === 'queue') store.handleQueueModalClose();
                else store.handleCloseQuickActionModal();
            }
        };
    });

    /* ===== QuickScrapModal(舊頁 10059-10230) ===== */
    Alpine.data('quickScrapModal', function () {
        return {
            reason: '',
            remarks: '',
            isSubmitting: false,

            get asset() { return this.$store.app.selectedAsset; },
            get aliasLabel() { return S.getAssetAliasLabel(this.asset); },
            get aliasDisplay() { return S.getAssetAliasDisplay(this.asset); },

            buildSummary: function () {
                var reasonLabel = this.reason === 'A' ? 'A.維修不具效益'
                    : this.reason === 'B' ? 'B.損壞無法修復' : 'C.其他';
                return this.remarks.trim()
                    ? '報廢｜' + reasonLabel + '｜' + this.remarks.trim()
                    : '報廢｜' + reasonLabel;
            },
            handleSubmit: function () {
                var store = this.$store.app;
                var asset = this.asset;
                if (!this.reason) { alert('請選擇報廢原因'); return; }
                if ((this.reason === 'C' || this.reason === '其他') && !this.remarks.trim()) {
                    alert('選擇「其他」原因時，請務必填寫詳細說明');
                    return;
                }
                var formData = {
                    assetIds: [asset.assetId],
                    reason: this.reason,
                    remarks: this.remarks.trim()
                };
                if (store.quickActionMode === 'queue') {
                    var payload = Object.assign({}, formData);
                    delete payload.assetIds;
                    store.handleQueueAction('SCRAP', payload, this.buildSummary(), asset);
                    store.handleQueueModalClose();
                    return;
                }
                var confirmation = confirm('確定要申請報廢財產「' + asset.assetId + '」嗎？\n報廢原因：' + (this.reason === 'A' ? 'A.維修不具效益，且逾使用年限' : this.reason === 'B' ? 'B.損壞無法修復，且逾使用年限' : 'C.其他'));
                if (!confirmation) return;
                
                if (store.isAssetProcessing(asset.assetId)) return; // 防重複送出
                store.toastProgress('正在提交「' + asset.assetId + '」的報廢申請...');
                store.addProcessingAsset(asset.assetId);
                store.handleCloseQuickActionModal();

                google.script.run
                    .withSuccessHandler(function (message) {
                        store.removeProcessingAsset(asset.assetId);
                        // 後端 catch 會以「申請報廢失敗：」字串回傳(非拋出),須辨識為失敗
                        if (typeof message === 'string' && message.indexOf('申請報廢失敗') === 0) {
                            store.toastOrAlert('❌ 提交報廢失敗：' + message, 'error');
                            alert(message);
                            return;
                        }
                        var requiresPrint = message.includes('請列印報廢申請單') || message.includes('需列印');
                        var waitReview = message.includes('需要審核') || message.includes('等待');
                        
                        store.toastOrAlert('✅ 「' + asset.assetId + '」報廢申請已提交！', 'success');

                        store.showSuccessPrompt({
                            title: '報廢申請已提交',
                            message: message,
                            actionType: 'SCRAP',
                            requiresPrint: true,
                            waitReview: false
                        });
                        // 以權威資料對帳:部分成功等情形由此修正,並更新卡片統計(取代整頁 loadData)
                        store.refreshCardData('scrap');
                    })
                    .withFailureHandler(function (error) {
                        store.removeProcessingAsset(asset.assetId);
                        store.toastOrAlert('❌ 提交失敗：' + error.message, 'error');
                        alert('錯誤：' + error.message);
                    })
                    .processBatchScrapping(formData);
            },
            close: function () {
                var store = this.$store.app;
                if (store.quickActionMode === 'queue') store.handleQueueModalClose();
                else store.handleCloseQuickActionModal();
            }
        };
    });
});
</script>

<!-- ===== 快速轉移 Modal ===== -->
<template x-if="$store.app.quickActionModalType === 'transfer' && $store.app.selectedAsset && $store.app.transferOptions">
    <div class="fixed inset-0 z-[2002] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" x-data="quickTransferModal">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden">
            <div class="px-6 py-4 border-b bg-blue-50 flex justify-between items-center">
                <h3 class="text-lg font-bold text-blue-800">
                    <i class="fa-solid fa-right-left mr-2"></i>
                    轉移財產
                </h3>
                <button @click="close()" class="text-blue-600 hover:text-blue-800 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="px-6 py-4 overflow-y-auto max-h-[calc(90vh-140px)]">
                <div class="mb-4 p-4 bg-slate-50 rounded-lg">
                    <div class="text-sm text-slate-600 mb-1">財產編號</div>
                    <div class="font-bold text-slate-800" x-text="asset.assetId"></div>
                    <div class="text-sm text-slate-600 mt-2 mb-1">財產名稱</div>
                    <div class="text-slate-800" x-text="asset.assetName"></div>
                    <div class="text-sm text-slate-600 mt-2 mb-1" x-text="aliasLabel"></div>
                    <div class="text-slate-800" x-text="aliasDisplay"></div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-2">轉移模式</label>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="radio" name="transferMode" value="normal" x-model="transferMode" class="mr-2">
                            <span>一般轉移</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="transferMode" value="info_out" x-model="transferMode" class="mr-2">
                            <span>資訊組轉出</span>
                        </label>

                                詳細說明 <span class="text-red-500">*</span>
                            </label>
                            <textarea x-model="remarks" rows="4" placeholder="請詳細說明報廢原因..."
                                      class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500"></textarea>
                        </div>
                    </template>
                </div>
            </div>
            <div class="px-6 py-4 border-t bg-slate-50 flex justify-end gap-3">
                <button @click="close()" :disabled="isSubmitting"
                        class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors disabled:opacity-50">取消</button>
                <button @click="handleSubmit()" :disabled="isSubmitting"
                        class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                    <template x-if="isSubmitting">
                        <span class="flex items-center gap-2">
                            <span class="inline-block animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
                            <span>提交中...</span>
                        </span>
                    </template>
                    <template x-if="!isSubmitting">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i>
                            <span>提交報廢申請</span>
                        </span>
                    </template>
                </button>
            </div>
        </div>
    </div>
</template>
