<script>
// 原生 Modal shim:以約 90 行取代 jQuery 3.5.1 + bootstrap.bundle.js(僅本頁 modal 需要)。
// 相容介面:$('#id').modal('show'|'hide'|'toggle')、window.$.fn.modal 能力檢查、
// data-dismiss="modal" 按鈕、backdrop 點擊與 Esc 關閉。樣式沿用 Bootstrap CSS。
(function () {
  var TRANSITION_MS = 300;
  var openStack = []; // 目前開啟中的 modal 元素(後開在後)

  function reflow(el) { void el.offsetHeight; }

  function getBackdrop(modal) { return modal.__backdrop || null; }

  function showModal(modal) {
    if (!modal || openStack.indexOf(modal) !== -1) return;
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop fade';
    document.body.appendChild(backdrop);
    modal.__backdrop = backdrop;

    document.body.classList.add('modal-open');
    modal.style.display = 'block';
    modal.removeAttribute('aria-hidden');
    modal.setAttribute('aria-modal', 'true');
    reflow(modal);
    backdrop.classList.add('show');
    modal.classList.add('show');
    openStack.push(modal);
  }

  function hideModal(modal) {
    var idx = modal ? openStack.indexOf(modal) : -1;
    if (idx === -1) return;
    openStack.splice(idx, 1);

    modal.classList.remove('show');
    var backdrop = getBackdrop(modal);
    if (backdrop) backdrop.classList.remove('show');

    setTimeout(function () {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
      modal.removeAttribute('aria-modal');
      if (backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
      modal.__backdrop = null;
      if (openStack.length === 0) document.body.classList.remove('modal-open');
    }, TRANSITION_MS);
  }

  // --- jQuery 相容包裝 ---
  function Wrapper(el) { this.el = el; }
  Wrapper.prototype.modal = function (action) {
    if (!this.el) return this;
    if (action === 'show') showModal(this.el);
    else if (action === 'hide') hideModal(this.el);
    else if (action === 'toggle') (openStack.indexOf(this.el) === -1 ? showModal : hideModal)(this.el);
    return this;
  };

  // Toast 相容(toast_progress.html 使用;無 .fade class,直接切換即符合 Bootstrap 行為)
  Wrapper.prototype.toast = function (action) {
    if (!this.el) return this;
    if (action === 'show') { this.el.classList.remove('hide'); reflow(this.el); this.el.classList.add('show'); }
    else if (action === 'hide') { this.el.classList.remove('show'); this.el.classList.add('hide'); }
    return this;
  };

  function $(selector) {
    var el = typeof selector === 'string' ? document.querySelector(selector) : selector;
    return new Wrapper(el);
  }
  $.fn = Wrapper.prototype; // 讓 window.$ && typeof window.$.fn?.modal === 'function' 能力檢查通過
  window.$ = window.jQuery = $;

  // --- 全域事件委派 ---
  document.addEventListener('click', function (e) {
    // data-dismiss="modal":關閉所屬 modal
    var dismissBtn = e.target.closest('[data-dismiss="modal"]');
    if (dismissBtn) {
      var owner = dismissBtn.closest('.modal');
      if (owner) { hideModal(owner); return; }
    }
    // 點擊 modal 外圍(backdrop 區域):Bootstrap 的 backdrop 在 modal 下層,
    // 實際收到點擊的是 .modal 容器本身(非 .modal-dialog 內容)
    if (e.target.classList && e.target.classList.contains('modal')) {
      hideModal(e.target);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && openStack.length > 0) {
      hideModal(openStack[openStack.length - 1]);
    }
  });
})();
</script>
