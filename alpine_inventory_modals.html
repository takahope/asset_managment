<!-- ===== ActionPanel:Modal 形式(舊頁 15995-16013) ===== -->
<template x-if="$store.app.isAdvancedMode && $store.app.actionPanelState.isOpen && $store.app.actionPanelState.displayMode === 'modal'">
    <div class="advanced-scanner-overlay" @click="$store.app.closeActionPanel()">
        <div class="action-panel-modal action-panel" @click.stop x-data="actionPanel({ displayMode: 'modal' })">
            <div class="action-panel__header">
                <div class="flex items-center gap-3">
                    <button x-show="panelView === 'inventory'" type="button" class="action-panel__back" @click="panelView = 'actions'">
                        <i class="fa-solid fa-arrow-left"></i>返回
                    </button>
                    <h5 x-text="panelView === 'inventory' ? '盤點設定' : '動作決策面板'"></h5>
                </div>
                <button type="button" class="action-panel__secondary" @click="$store.app.closeActionPanel()">關閉</button>
            </div>
            <div class="action-panel__body">
                <template x-if="hasAsset">
                    <div>
                        <div class="action-panel__status-card">
                            <div>
                                <small>顯示掃描結果</small>
                                <h4 x-text="asset.assetId"></h4>
                                <p x-text="asset.assetName || '-'"></p>
                                <small x-text="aliasLabel + '：' + aliasDisplay"></small>
                            </div>
                            <div class="action-panel__status-badge"><i class="fa-solid fa-check"></i></div>
                        </div>
                        <div class="action-panel__meta">
                            <div><span>保管人：</span><span x-text="asset.leader || '-'"></span></div>
                            <div><span>使用人：</span><span x-text="asset.userName || '-'"></span></div>
                            <div><span>地點：</span><span x-text="asset.location || '-'"></span></div>
                            <div><span>狀態：</span><span x-text="asset.status || '-'"></span></div>
                            <div><span>盤點狀態：</span><span x-text="inventoryStatusLabel || '無盤點任務'"></span></div>
                        </div>
                    </div>
                </template>
                <template x-if="!hasAsset">
                    <div class="action-panel__info">
                        <div><strong>等待掃描或輸入資產編號...</strong></div>
                        <div>掃描成功後請選擇動作。</div>
                    </div>
                </template>
                <template x-if="panelView === 'inventory'">
                    <div class="action-panel__inventory-intro">
                        <div class="action-panel__inventory-note">加入清單後，送出時會同步更新所有進行中的盤點會話；若啟用 ISMS，也可一併設定資訊資產分類。</div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">盤點結果</label>
                            <div class="grid grid-cols-2 gap-2">
                                <template x-for="opt in window.AppShared.INVENTORY_RESULT_OPTIONS" :key="opt.label">
                                    <button type="button" @click="invResult = opt.label"
                                            class="py-2 rounded-lg border-2 text-sm font-medium transition-all flex items-center justify-center gap-1.5"
                                            :class="invResult === opt.label
                                                ? (opt.color === 'green' ? 'bg-emerald-500 text-white border-emerald-500' : opt.color === 'red' ? 'bg-red-500 text-white border-red-500' : opt.color === 'orange' ? 'bg-orange-500 text-white border-orange-500' : 'bg-amber-500 text-white border-amber-500')
                                                : (opt.color === 'green' ? 'border-emerald-300 text-emerald-700 hover:bg-emerald-50' : opt.color === 'red' ? 'border-red-300 text-red-700 hover:bg-red-50' : opt.color === 'orange' ? 'border-orange-300 text-orange-700 hover:bg-orange-50' : 'border-amber-300 text-amber-700 hover:bg-amber-50')">
                                        <i :class="opt.icon"></i><span x-text="opt.label"></span>
                                    </button>
                                </template>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1.5">備註（選填）</label>
                            <textarea x-model="invRemarks" rows="3" placeholder="輸入備註..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-colors text-sm resize-none"></textarea>
                        </div>
                        <template x-if="ismsEnabled">
                            <div class="border border-indigo-200 rounded-lg overflow-hidden">
                                <button type="button" @click="invIsmsExpanded = !invIsmsExpanded" class="w-full px-4 py-3 bg-indigo-50 flex items-center justify-between text-sm font-medium text-indigo-700 hover:bg-indigo-100 transition-colors">
                                    <span class="flex items-center gap-2">
                                        <i class="fa-solid fa-shield-halved"></i>資訊資產分類
                                        <span x-show="invIsItAsset" class="px-2 py-0.5 bg-indigo-200 text-indigo-800 rounded-full text-xs">已標記</span>
                                    </span>
                                    <i class="fa-solid text-xs" :class="invIsmsExpanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                                </button>
                                <template x-if="invIsmsExpanded">
                                    <div class="px-4 py-3 space-y-3 bg-white">
                                        <div class="flex items-center justify-between">
                                            <label class="text-sm text-slate-700">此資產是否為資訊資產？</label>
                                            <button type="button" @click="toggleIsItAsset()" class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors" :class="invIsItAsset ? 'bg-indigo-600' : 'bg-slate-300'">
                                                <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform" :class="invIsItAsset ? 'translate-x-6' : 'translate-x-1'"></span>
                                            </button>
                                        </div>
                                        <template x-if="invIsItAsset">
                                            <div class="flex items-center justify-between">
                                                <label class="text-sm text-slate-700">是否在驗證範圍？</label>
                                                <button type="button" @click="invIsIsoScope = !invIsIsoScope" class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors" :class="invIsIsoScope ? 'bg-indigo-600' : 'bg-slate-300'">
                                                    <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform" :class="invIsIsoScope ? 'translate-x-6' : 'translate-x-1'"></span>
                                                </button>
                                            </div>
                                        </template>
                                        <template x-if="invIsItAsset">
                                            <div class="space-y-2">
                                                <div class="flex items-center justify-between">
                                                    <label class="block text-sm font-medium text-slate-700">對應資訊資產<span class="text-slate-400 font-normal ml-1">（選填）</span></label>
                                                    <button type="button" @click="openCreateIsms()" class="inline-flex items-center gap-1 px-2 py-1 text-xs font-medium text-indigo-600 hover:bg-indigo-50 rounded" title="新增資訊資產"><i class="fa-solid fa-plus"></i>新增</button>
                                                </div>
                                                <div class="relative">
                                                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                                    <input type="text" x-model="invIsmsSearchKeyword" placeholder="搜尋資訊資產編號/名稱..." class="w-full pl-8 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                                </div>
                                                <template x-if="selectedIsmsAsset">
                                                    <div class="flex items-center gap-2 bg-indigo-50 rounded-lg px-3 py-2 text-sm">
                                                        <i class="fa-solid fa-link text-indigo-500"></i>
                                                        <span class="text-indigo-800 font-medium" x-text="selectedIsmsAsset.ismsAssetId"></span>
                                                        <span class="text-indigo-600" x-text="selectedIsmsAsset.name"></span>
                                                        <button type="button" @click="invSelectedIsmsAssetId = ''" class="ml-auto text-indigo-400 hover:text-indigo-600"><i class="fa-solid fa-xmark"></i></button>
                                                    </div>
                                                </template>
                                                <div class="max-h-36 overflow-y-auto border border-slate-200 rounded-lg divide-y divide-slate-100">
                                                    <template x-if="filteredIsmsAssets.length === 0">
                                                        <div class="px-3 py-4 text-center text-sm text-slate-400" x-text="invIsmsSearchKeyword ? '找不到符合條件的資訊資產' : '無資訊資產資料'"></div>
                                                    </template>
                                                    <template x-for="ismsAsset in filteredIsmsAssetsTop" :key="ismsAsset.ismsAssetId">
                                                        <button type="button" @click="invSelectedIsmsAssetId = ismsAsset.ismsAssetId" class="w-full text-left px-3 py-2 text-sm hover:bg-indigo-50 transition-colors" :class="invSelectedIsmsAssetId === ismsAsset.ismsAssetId ? 'bg-indigo-100 border-l-2 border-indigo-500' : ''">
                                                            <div class="flex items-center gap-2">
                                                                <span class="font-mono text-xs text-slate-500" x-text="ismsAsset.ismsAssetId"></span>
                                                                <span x-show="ismsAsset.category" class="px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded text-xs" x-text="ismsAsset.category"></span>
                                                            </div>
                                                            <div class="text-slate-700 mt-0.5" x-text="ismsAsset.name"></div>
                                                        </button>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
                <template x-if="panelView !== 'inventory'">
                    <div>
                        <div class="action-panel__section-title">資產操作 ACTIONS</div>
                        <div class="action-panel__actions">
                            <button type="button" class="action-panel__button action-panel__button--transfer" :disabled="!hasAsset" @click="$store.app.openQueueActionModal('TRANSFER')"><i class="fa-solid fa-right-left"></i>轉移</button>
                            <button type="button" class="action-panel__button action-panel__button--lend" :disabled="!hasAsset" @click="$store.app.openQueueActionModal('LEND')"><i class="fa-solid fa-hand-holding-hand"></i>出借</button>
                            <button type="button" class="action-panel__button action-panel__button--scrap" :disabled="!hasAsset" @click="$store.app.openQueueActionModal('SCRAP')"><i class="fa-regular fa-trash-can"></i>報廢</button>
                            <button type="button" class="action-panel__button action-panel__button--location-error" :disabled="!hasAsset" @click="$store.app.handleLocationErrorAction('position')"><i class="fa-solid fa-location-dot"></i>位置有誤</button>
                            <button type="button" class="action-panel__button action-panel__button--keeper-error" :disabled="!hasAsset" @click="$store.app.handleLocationErrorAction('keeper')"><i class="fa-solid fa-user-tag"></i>保管人有誤</button>
                            <button type="button" class="action-panel__button action-panel__button--tag-error" :disabled="!hasAsset" @click="$store.app.handleLocationErrorAction('tag')"><i class="fa-solid fa-tag"></i>標籤有誤</button>
                        </div>
                        <template x-if="hasInventoryTask">
                            <div>
                                <div class="action-panel__section-title">盤點狀態 INVENTORY STATUS</div>
                                <div class="action-panel__inventory-group">
                                    <template x-for="opt in window.AppShared.INVENTORY_RESULT_OPTIONS" :key="opt.label">
                                        <button type="button"
                                                class="action-panel__chip"
                                                :class="'action-panel__chip--' + (opt.color === 'green' ? 'normal' : opt.color === 'red' ? 'lost' : opt.color === 'orange' ? 'damaged' : 'old')"
                                                :disabled="!hasAsset" @click="openInventorySettings(opt.label)">
                                            <i :class="opt.icon"></i><span x-text="opt.label"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
            <div class="action-panel__footer">
                <template x-if="panelView === 'inventory'">
                    <div class="flex gap-2">
                        <button type="button" class="action-panel__secondary" @click="panelView = 'actions'">返回動作選擇</button>
                        <button type="button" class="action-panel__secondary" @click="handleInventoryReset()">加入重設</button>
                        <button type="button" class="action-panel__primary" @click="handleInventorySubmit()"><i class="fa-solid fa-cart-plus"></i>加入清單</button>
                    </div>
                </template>
                <template x-if="panelView !== 'inventory'">
                    <button type="button" class="action-panel__secondary" @click="$store.app.closeActionPanel()">取消</button>
                </template>
            </div>
            <div class="action-panel__hint" x-text="panelView === 'inventory' ? '設定完成後加入清單；可帶入備註與 ISMS 分類。' : '點擊上方按鈕將資產加入進階批次處理清單'"></div>
        </div>
    </div>
</template>

<!-- ===== PendingInventoryModal(舊頁 7326-7587) ===== -->
<template x-if="$store.app.activeModal === 'inventoryPending'">
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" x-data="pendingInventoryModal">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-6xl overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-red-50">
                <h3 class="text-lg font-bold text-red-800"><i class="fa-solid fa-clipboard-list mr-2"></i>待盤點資產清單</h3>
                <button @click="close()" class="text-red-600 hover:text-red-800 transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 max-h-[75vh] overflow-y-auto">
                <template x-if="isLoading">
                    <div class="flex flex-col items-center justify-center py-12 gap-4"><i class="fas fa-spinner fa-spin text-4xl text-red-500"></i><p class="text-slate-500 font-medium">載入待盤點清單中...</p></div>
                </template>
                <template x-if="!isLoading && error">
                    <div class="flex flex-col items-center justify-center py-12 gap-3 text-center">
                        <i class="fas fa-triangle-exclamation text-4xl text-red-500"></i><p class="text-slate-600 font-medium">載入失敗</p><p class="text-sm text-slate-500" x-text="error"></p>
                    </div>
                </template>
                <template x-if="!isLoading && !error && sessions.length === 0">
                    <div class="flex flex-col items-center justify-center py-12 gap-4">
                        <i class="fas fa-check-circle text-5xl text-green-500"></i><p class="text-slate-500 text-lg font-medium">目前沒有待盤點的資產。</p><p class="text-slate-400 text-sm">已完成所有盤點會話或尚未開始盤點。</p>
                    </div>
                </template>
                <template x-if="!isLoading && !error && sessions.length > 0">
                    <div>
                        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
                            <div class="text-sm text-slate-600">共 <span class="font-semibold text-red-600" x-text="totalCount"></span> 筆待盤點資產，<span class="font-semibold text-red-600" x-text="sessions.length"></span> 個會話</div>
                        </div>
                        <div class="border-b border-slate-200 mb-4 flex flex-wrap gap-2">
                            <template x-for="session in sessions" :key="session.inventoryId">
                                <button @click="activeSessionId = session.inventoryId"
                                        class="px-4 py-2 rounded-t-lg text-sm border"
                                        :class="activeSession && activeSession.inventoryId === session.inventoryId ? 'bg-white border-slate-200 border-b-white text-slate-800' : 'bg-slate-50 border-transparent text-slate-500 hover:text-slate-700'"
                                        :title="'會話代碼：' + session.inventoryId">
                                    <div class="font-medium line-clamp-1" x-text="formatSessionLabel(session)"></div>
                                    <div class="text-xs text-slate-400" x-text="session.items.length + ' 筆'"></div>
                                </button>
                            </template>
                        </div>
                        <div class="mb-4 text-sm text-slate-500" x-show="activeSession">會話資訊：<span class="text-slate-700" x-text="activeSession ? formatSessionLabel(activeSession) : ''"></span></div>
                        <template x-for="group in groupedItems" :key="group.key">
                            <div class="mb-6">
                                <div class="mb-2 text-sm font-semibold text-slate-700" x-show="isAdmin">
                                    <span x-text="group.label"></span> <span class="text-slate-400" x-text="'(' + group.items.length + ' 筆)'"></span>
                                </div>
                                <div class="overflow-x-auto border border-slate-200 rounded-lg">
                                    <table class="w-full text-sm border-collapse">
                                        <thead class="bg-slate-50 sticky top-0"><tr>
                                            <th class="px-3 py-2 text-left font-semibold text-slate-600 border-b">財產編號</th>
                                            <th class="px-3 py-2 text-left font-semibold text-slate-600 border-b">財產名稱</th>
                                            <th class="px-3 py-2 text-left font-semibold text-slate-600 border-b">財產別名</th>
                                            <th class="px-3 py-2 text-left font-semibold text-slate-600 border-b">使用者</th>
                                            <th class="px-3 py-2 text-left font-semibold text-slate-600 border-b">保管人</th>
                                            <th class="px-3 py-2 text-left font-semibold text-slate-600 border-b">保管位置</th>
                                            <th class="px-3 py-2 text-left font-semibold text-slate-600 border-b" x-show="isAdmin">指派對象</th>
                                        </tr></thead>
                                        <tbody class="divide-y divide-slate-100">
                                            <template x-for="(item, index) in group.items" :key="group.key + '-' + item.inventoryId + '-' + item.assetId + '-' + index">
                                                <tr class="hover:bg-slate-50 transition-colors">
                                                    <td class="px-3 py-2 font-mono text-slate-700 whitespace-nowrap" x-text="item.assetId || '-'"></td>
                                                    <td class="px-3 py-2 text-slate-700" x-text="item.assetName || '-'"></td>
                                                    <td class="px-3 py-2 text-slate-600" x-text="window.AppShared.getAssetAliasDisplay(item)"></td>
                                                    <td class="px-3 py-2 text-slate-600" x-text="item.userName || '-'"></td>
                                                    <td class="px-3 py-2 text-slate-600" x-text="item.keeperName || '-'"></td>
                                                    <td class="px-3 py-2 text-slate-600" x-text="item.location || '-'"></td>
                                                    <td class="px-3 py-2 text-slate-600" x-show="isAdmin" x-text="resolveAssignedDisplay(item)"></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
            <div class="px-6 py-4 border-t bg-slate-50 flex justify-end">
                <button @click="close()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">關閉</button>
            </div>
        </div>
    </div>
</template>

<!-- ===== InventoryConfirmModal:單筆(舊頁 16241-16260) ===== -->
<template x-if="$store.app.showInventoryModal && $store.app.inventoryModalAsset">
    <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-0 sm:p-4" x-data="inventoryConfirmModal({ isBatch: false })">
        <div class="bg-white rounded-t-2xl sm:rounded-xl shadow-2xl w-full max-w-md flex flex-col max-h-[92vh]">
            <div class="px-5 py-3.5 border-b bg-teal-50 flex justify-between items-center flex-shrink-0 rounded-t-2xl sm:rounded-t-xl">
                <h3 class="text-base font-bold text-teal-800"><i class="fa-solid fa-clipboard-check mr-2"></i>盤點確認</h3>
                <button @click="close()" class="text-teal-600 hover:text-teal-800 transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="px-5 py-4 space-y-3 overflow-y-auto flex-1">
                <div class="bg-slate-50 rounded-lg px-4 py-2.5 grid grid-cols-2 gap-x-4 gap-y-1 text-sm">
                    <p><span class="font-medium text-slate-500">財產編號</span><br><span class="text-slate-800" x-text="asset.assetId"></span></p>
                    <p><span class="font-medium text-slate-500">財產名稱</span><br><span class="text-slate-800" x-text="asset.assetName"></span></p>
                    <p><span class="font-medium text-slate-500" x-text="aliasLabel"></span><br><span class="text-slate-800" x-text="aliasDisplay"></span></p>
                    <p><span class="font-medium text-slate-500">保管人</span><br><span class="text-slate-800" x-text="asset.leader || asset.keeperName"></span></p>
                    <p><span class="font-medium text-slate-500">地點</span><br><span class="text-slate-800" x-text="asset.location"></span></p>
                </div>
                <div class="rounded-lg border border-teal-100 bg-teal-50 px-3 py-2 text-xs text-teal-700"
                     x-text="isQueueMode ? ('確認後會先加入批次清單，待送出時同步更新所有進行中的盤點會話' + (sessionCount > 0 ? ('（共 ' + sessionCount + ' 個）') : '') + '。') : ('送出後會同步更新所有進行中的盤點會話' + (sessionCount > 0 ? ('（共 ' + sessionCount + ' 個）') : '') + '。')"></div>
                <!-- InventoryFormFields(內嵌) -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">盤點結果</label>
                    <div class="grid grid-cols-4 gap-2">
                        <template x-for="opt in window.AppShared.INVENTORY_RESULT_OPTIONS" :key="opt.label">
                            <button type="button" @click="invResult = opt.label"
                                    class="py-2 rounded-lg border-2 text-sm font-medium transition-all flex items-center justify-center gap-1.5"
                                    :class="invResult === opt.label
                                        ? (opt.color === 'green' ? 'bg-emerald-500 text-white border-emerald-500' : opt.color === 'red' ? 'bg-red-500 text-white border-red-500' : opt.color === 'orange' ? 'bg-orange-500 text-white border-orange-500' : 'bg-amber-500 text-white border-amber-500')
                                        : (opt.color === 'green' ? 'border-emerald-300 text-emerald-700 hover:bg-emerald-50' : opt.color === 'red' ? 'border-red-300 text-red-700 hover:bg-red-50' : opt.color === 'orange' ? 'border-orange-300 text-orange-700 hover:bg-orange-50' : 'border-amber-300 text-amber-700 hover:bg-amber-50')">
                                <i :class="opt.icon"></i><span x-text="opt.label"></span>
                            </button>
                        </template>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">備註（選填）</label>
                    <textarea x-model="invRemarks" rows="2" placeholder="輸入備註..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-colors text-sm resize-none"></textarea>
                </div>
                <template x-if="ismsEnabled">
                    <div class="border border-indigo-200 rounded-lg overflow-hidden">
